# ESM_auto_lpjg2nc.yaml
# Configuration for automatic lpjg2nc2 post-processing
#
# This configuration file enables automatic conversion of LPJ-GUESS .out files to NetCDF
# after model runs, using the lpjg2nc2 tool.

# Enable/disable automatic lpjg2nc2 post-processing
auto_lpjg2nc: False  # Set to True to enable

# Plugin requirements for lpjg2nc2
required_python_packages:
    - numpy>=1.20.0
    - pandas>=1.3.0
    - xarray>=0.19.0
    - netCDF4>=1.5.7
    - tqdm>=4.61.0

# Default configuration for lpjg2nc2
lpjg2nc_settings:
    # Output directory for NetCDF files (relative to experiment directory)
    output_dir: "${this.outdata_dir}/lpjg_netcdf"
    
    # Parameters for lpjg2nc2 processing
    parallel_jobs: 8       # Number of parallel jobs (outer parallelization)
    inner_jobs: 16         # Inner parallelization
    chunk_size: 50000      # Chunk size for processing arrays
    remap: "1"            # Set to "1" for 1-degree grid or specify dimensions like "360x180"
    verbose: True          # Enable verbose output

# Environment setup required before running lpjg2nc2
pre_run_commands:
    - "module load python3"
    - "python -m pip install --user git+https://github.com/JanStreffing/lpjg2nc2.git"

# Add the post-processing command to run after LPJ-GUESS completion
post_processing:
    post_run_scripts:
        lpjg2nc_convert:
            command: >-
                python -m lpjg2nc.lpjg2nc -p ${this.experiment_dir} 
                -o ${lpjg2nc_settings.output_dir} 
                -j ${lpjg2nc_settings.parallel_jobs} 
                --inner-jobs ${lpjg2nc_settings.inner_jobs} 
                --chunk-size ${lpjg2nc_settings.chunk_size} 
                --remap ${lpjg2nc_settings.remap} 
                ${lpjg2nc_settings.verbose:--v}
            description: "Converting LPJ-GUESS output files to NetCDF format"
            exit_if_failed: False  # Continue even if this post-processing fails
            log_output: True       # Log the output of the post-processing
            output_path: "${this.log_dir}/lpjg2nc.log"

# Conditional configurations based on whether auto_lpjg2nc is enabled
choose_auto_lpjg2nc:
    True:
        # Documentation references
        further_reading:
            - "https://github.com/JanStreffing/lpjg2nc2"
        
        # Enable post-processing when this feature is active
        add_post_processing:
            # Inherit the post_run_scripts configuration above
            post_run_scripts: ${post_processing.post_run_scripts}
