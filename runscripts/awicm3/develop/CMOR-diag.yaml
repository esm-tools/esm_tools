general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ab0246"
    compute_time: "00:30:00"
    initial_date: "1350-01-01"
    final_date: "1350-02-01"
    use_venv: true
    install_esm_tools_branch: "feat/awiesm3-v3.4"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    #base_dir: "/work/ab0995/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 1
    nyear: 0
    parallel_file_movements: 'threads'

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"
    #model_dir: "/work/ab0995/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "m"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 768
    omp_num_threads: 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.ice:
            ice_therm:
                use_meltponds: true
        namelist.io:
            diag_list:
                lcmor_diag: true       

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 1
    mpi: 'cmip6'
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850
            NAERAD:
                #NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
                RCL_OVERLAPLIQICE: 0.1

            NAMGWWMS:
                GGAUSSB: -0.6

oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600

xios:
    with_model: oifs
    nproc: 8
    omp_num_threads: 32
