general:
        user: !ENV ${USER}
        account: "paleodyn.paleodyn"
        setup_name: fesom
        compute_time: "00:30:00"
        initial_date: '1959-01-01'
        final_date: '1959-01-02'
        base_dir: "/albedo/work/user/jstreffi/runtime/${general.setup_name}-${general.version}/"
        nyear: 0
        nmonth: 0
        nday: 1
        use_venv: False

fesom:
        version: 2.8
        model_dir: "/albedo/work/user/jstreffi/model_codes/fesom-2.8/"
        pool_dir: "/albedo/work/projects/p_pool_fesom2"
        mesh_dir: "/albedo/work/projects/p_pool_fesom2/core2/"
        climate_data_dir: "/albedo/work/projects/p_pool_fesom2/hydrography/"
        forcing_data_dir: "/albedo/work/projects/p_pool_fesom2/forcing/"
        restart_rate: 1
        restart_first: 1
        restart_unit: 'd'
        resolution: "CORE2"
        lresume: false
        time_step: 1800
        nproc: 128
        # The derived-type ("bin") and core-dump ("raw") restarts are one file
        # per rank per derived type -- 640 files for 128 ranks -- all created in
        # one directory at once. On albedo's GPFS that serialises: 29 KB
        # t_partit files land one rank at a time, ~6 s apart, and the dump takes
        # far longer than the integration it is protecting. Only the netCDF
        # restart is needed to continue a run, so turn the other two off, the
        # same as the awicm3/awiesm3 setups do.
        add_namelist_changes:
            namelist.config:
                restart_log:
                    raw_restart_length_unit: "off"
                    bin_restart_length_unit: "off"
