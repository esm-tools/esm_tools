computer:
    use_hyperthreading: True
    additional_flags: 
        - "--tasks-per-node=128"
        #- "--threads-per-core=2"
        #- "--nnodes=52"
   # launcher_flags: -l --kill-on-bad-exit=1 --nodes=${SLURM_JOB_NUM_NODES:-1} --distribution=plane --hint=nomultithread --ntasks=$((no_of_nodes * mpi_procs_pernode)) --ntasks-per-node=${mpi_procs_pernode} --cpus-per-task=${OMP_NUM_THREADS}
    launcher_flags: "-l --kill-on-bad-exit=1 --hint=nomultithread --distribution=plane" 
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill" # default is kill
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
      "Lookup table problem" :
          frequency: 30
          method: "kill" # default is kill
          message: "The good old lookup table overflow."
          file: "stdout"
      "write_blowup" :
          frequency: 30
          method: "kill" # default is kill
          message: "FESOM2 exploded."
          file: "stdout"
general:
   use_venv: false
   homedir: !ENV ${HOME}
   setup_name: icon-fesom
   compute_time: "01:32:00"
   account: bb1460
   # monthly restart
   #initial_date: "1850-01-01T00:00:00"       # Initial exp. date
   #final_date: "1850-04-01T00:00:00"         # Final date of the experiment
   #nmonth: 1
   # yearly restart
   initial_date: "1850-01-01T00:00:00"       # Initial exp. date
   final_date: "1852-01-01T00:00:00"         # Final date of the experiment
   # set length and unit, both are used to set ICON and FESOM
   # time intervals correctly
   runlength: 1
   unit: 'y' # 'd' for day, 'y' for year
   nmonth: 12
   # needs fixing
   # https://github.com/esm-tools/esm_tools/issues/1453
   choose_unit:
      'd':
         #nday: ${runlength}
         unitUpper: 'D'
      'm':
         nmonth: 1 # works
         #nmonth: ${runlength} # doesn't work
         unitUpper: 'M'
      'y':
         #nyear: ${runlength}
         unitUpper: 'Y'
   
   base_dir: ${homedir}/esm/esm-experiments/ 
   #model_dir: /work/bb0519/b350071/models/icon-fesom-v3.0
   model_dir: ${homedir}/esm/models/icon-fesom-v3.0
   version: "v1.0"

yac:
    input_sources:
        coupling_yaml: ${computer.pool_directories.focipool}/ICON-FESOM/ICON/coupling.yaml  

icon:
   monitoring: True 
   monitoringscript: "run_qp_driver_r2b5_icon-esm-tools.sh"
   # As icon insist on having the restart files in link that points to a directory
   # we have to run this pre_run_command, this can hopefully change in the future
   pre_run_commands: 
       - "ulimit -c 0"
       - "ulimit -a"
       - "LD_LIBRARY_PATH=/sw/spack-levante/libfyaml-0.7.12-fvbhgo/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
         # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*
   version: "2025.10-public"
   resolution: "R02B05"
   grid_id: "0030"
   #nproc: 256
   #omp_num_threads: 8
   nproc: 2560
   #nproc: 1488
   #nproc: 2560
   omp_num_threads: 1
   
   dtime: 450 # 450 used with R02B04 900 is the current default in icon.yaml
   #dtime: 60 
   # yearly restart and monthyl output interval
   checkpoint_interval: P01Y
   restart_interval: P01Y
   output_interval: P01M
   # yearly restart and output interval
   #checkpoint_interval: P${general.runlength}${general.unitUpper}
   #restart_interval: ${checkpoint_interval}
   #output_interval: ${checkpoint_interval}

   # example, change a namelist parameter
   # be aware of typos, use the exact name as in the namelist 
   # otherwise a new namelist parameter will be created which will 
   # not be recognized by ICON.
   #add_namelist_changes:
   #   NAMELIST_atm:
   #      nwp_tuning_nml:
   #         tune_entrorg: 2.2e-3
   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 10
         output_nml:
            output_interval: "${output_interval}"
            # file_interval must be > output_interval
            file_interval: "P50Y"
fesom:
   version: "2.6.2-yac"
   time_step: 1800
   resolution: "CORE2"
   nproc: 512 
   #nproc: 4096
   #nproc: 1280
   #nproc: 1920
   # monthly restarts
   restart_unit: "y"
   restart_rate: "1"
   # daily restarts 
   #restart_unit: "$general.unit}"
   #restart_rate: "${general.runlength}"
   # does not help
   namelist_changes:
      #namelist.config:
      #     paths:
      #          meshpath: /work/bk1415/a270044/YET_ON_YAC/icon-fesom/exp007/fesom/FESOM2_one_year_input/mesh/dars/
       namelist.ice:
           ice_dyn:
               alpha_evp: 800
               beta_evp: 800

   #add_input_files:
       #fesom_griddes: fesom_griddes
   #add_input_sources:
       #fesom_griddes: ${computer.pool_directories.focipool}/ICON-FESOM/YAC/core2_griddes_elements.nc  
   #add_input_in_work: 
       #fesom_griddes: core2_griddes_elements.nc
