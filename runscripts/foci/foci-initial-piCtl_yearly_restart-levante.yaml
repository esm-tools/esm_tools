general:
   use_venv: False
   verbose: False
   setup_name: "foci"
   version: "default_oasismct4"
   homedir: !ENV ${HOME}

   compute_time: "01:29:00"
   initial_date: "1850-01-01T00:00:00"       # Initial exp. date
   final_date: "1852-01-01T00:00:00"         # Final date of the experiment
   postprocessing: true
   nmonth: 12
   clean_runs: 6
   
   # machine specific setup 
   account: bb0519
   base_dir: ${homedir}/esm/esm-experiments/

foci:
   model_dir: ${general.homedir}/wenjuan/models/foci-default_oasismct5/

oasis3mct:
    coupling_time_step: 3600

echam:
   scenario: "PI-CTRL"
   resolution: "T63"
   restart_rate: ${general.nmonth}
   restart_unit: "months"
   nproca: 32
   nprocb: 24
   # parallel I/O, off by default
   nprocio: 6
   namelist_changes:
      namelist.echam:
         parctl:
            iomode: 2 
            nprocio: ${nprocio}
   
nemo:
   resolution: "ORCA05"
   version: "ORCA05_LIM2_KCM_AOW_OASISMCT4"
   jpni: 32 
   jpnj: 18
   nproc: 576 
   # jpni and jpnj are 0 by default, i.e. automatic distribution on CPUs
   
xios:
   nproc: 12
