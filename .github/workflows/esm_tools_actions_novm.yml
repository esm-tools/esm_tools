name: esm-tools no Docker

# Controls when the action will run. Triggers the workflow on push or pull request.

on: [push, pull_request]


jobs:
  basic_tests_no_docker:
    runs-on: ubuntu-latest
    env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          # Python versions newer than ``python_requires`` (setup.py): install anyway
          # to see what breaks
          PIP_IGNORE_REQUIRES_PYTHON: ${{ matrix.experimental && '1' || '0' }}
    # Failures in the experimental versions are reported but do not fail the workflow
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
            - "3.10"
            - "3.11"
            - "3.12"
        experimental: [false]
        # Not supported yet (``python_requires``), early warning for the next versions
        include:
          - python-version: "3.13"
            experimental: true
          - python-version: "3.14"
            experimental: true
          - python-version: "3.15"
            experimental: true
    name: Python ${{ matrix.python-version }} sample${{ matrix.experimental && ' (experimental)' || '' }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Update Ubuntu
        run: sudo apt-get update

      - name: Install libhdf5-dev
        run: sudo apt-get install libhdf5-dev

      - name: Install libnetcdf-dev
        run: sudo apt-get install libnetcdf-dev
        
      - name: add to the path
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: install esm-tools
        run: |
          ./install.sh

      - name: Run Pytest
        run: |
          pip install pytest
          pytest -v .

      - name: run esm_master first time
        run: |
          yes Y | esm_master

      - name: run esm_master second time
        run: |
          esm_master

      - name: run esm_plugins
        run: |
          esm_plugins

      - name: run get-fesom-2.0
        run: |
          esm_master get-fesom-2.0

      - name: run status-fesom-2.0
        run: |
          esm_master status-fesom-2.0

      - name: run clean-fesom-2.0
        run: |
          esm_master clean-fesom-2.0
