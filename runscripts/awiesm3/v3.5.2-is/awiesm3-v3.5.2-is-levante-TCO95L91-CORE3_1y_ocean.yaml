# AWI-ESM3 v3.5.2-is on levante, ocean chain of awiesm3-v3.5.2-is-levante-TCO95L91-CORE3_1y_couple.yaml.
# Chunk 1 restarts every component from dbm3 at the start of 1905: the coupling state from the
# bundle pism_cavity_ini_branch_dbm3_1905 (see its README.md), OIFS and LPJ-GUESS from dbm3's restarts.
general:
    user: !ENV ${USER}
    use_venv: False
    setup_name: "awiesm3"
    version: "v3.5.2-is"
    # Also a literal outside any choose_ block: checked while initializing the iterative coupling.
    account: "bb1469"
    # antfill_root, not work_dir: general.work_dir is reserved by esm_tools for <rundir>/work/.
    antfill_root: "/work/ab0246/a270234"
    model_code_dir: "/work/bb1469/${general.user}/model_codes/awiesm3-v3.5.2-is"
    conda_env_dir: "/work/ab0246/a270234/conda/envs"
    shared_a270092: "/work/ab0246/a270092"
    shared_a270234: "/work/ab0246/a270234"
    idemix_bot_forcing: "/work/ab0246/a270092/input/fesom2/forcing/idemix/forcing_idemix_final_bin/FIN_STORMTIDE2_M2_plus_NYCANDER_CnoM2_bin_0.40deg.nc"
    compute_time: "01:00:00"
    initial_date: "1905-01-01"
    # Must end on the same cycle as the pism runscript's final_date.
    final_date: "1906-01-01"
    oifs_6h_pl_output: false
    base_dir: "/work/bb1469/${general.user}/runtime/awiesm3-v3.5.2-is/"
    interactive_mesh: true
    ism_freshwater_return: true
    smb_coupled: true
    icb_prep_background: true
    debm_coupled: true
    debm2_ice_initial_state: "${general.antfill_root}/pism_repro/antg065/ic_X_nofrag_phi9.nc"
    pism_cavity_ini_dir: "/work/ab0246/a270092/input/fesom2/pism_cavity_ini_branch_dbm3_1905"
    nday: 0
    nmonth: 0
    nyear: 1
    force_overwrite_in_file_movements: True

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "${general.model_code_dir}/"

fesom:
    ini_iceberg_dir: "${general.pism_cavity_ini_dir}/icebergs"
    ini_disch_file: "${general.pism_cavity_ini_dir}/icebergs/ini_discharge.nc"
    basin_file: "${general.shared_a270092}/input/pism/basins/antarct_cr.08km.nc"
    chunk1_mesh: "${general.pism_cavity_ini_dir}/submesh"
    oce2ice_method: "DIRECT"
    resolution: "CORE3"
    with_cavity: true
    # Inside the mother mesh dir: build_submesh resolves it as ${MAX_MESH}/${MESH_GRIDDES_fesom}.
    griddes_nodes: "core3_ant_fill_griddes_nodes.nc"
    ice2fesom_remap: "masked"
    gl_rule: "element_majority"
    cavity_dig: true
    cavity_icemean: true
    # Mother mesh: CORE3 with all of Antarctica meshed. Its node numbering is not CORE3's;
    # node_map_to_core3.txt is the map, see its PROVENANCE.md.
    mesh_dir: "${general.antfill_root}/mesh/core3_ant_fill_bedmap2/"
    # Must equal the mother mesh node count: a stale nx only shows as an OASIS
    # "av gsize nx ny mismatch" at the last exchange of the year.
    nx: 292256
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    # dbm3's end of 1904, remapped onto the 1905 submesh (bundle).
    lresume: true
    ini_parent_exp_id: "dbm3"
    ini_parent_date: "1904-12-31"
    ini_restart_dir: "${general.pism_cavity_ini_dir}/fesom_restart/"
    time_step: 1800
    nproc: 1792
    omp_num_threads: 2
    tar_binary_restarts: true
    cmip7_cmor_output: false
    change_ocean: 1
    ocp_template_config: "${ocp_tool_dir}/configs/TCO95_CORE3_ICE.yaml"
    ocp_weightgen_partition: "compute"
    # Set explicitly: conda is not on PATH in the batch jobs, so the fallback finds no python.
    # ocp-tool2 carries pyfesom2 + eccodes (driver), ocp-worker mpi4py against the run's OpenMPI.
    ocp_weightgen_driver_py: "${general.conda_env_dir}/ocp-tool2/bin/python"
    ocp_weightgen_worker_py: "${general.conda_env_dir}/ocp-worker/bin/python"
    # Only the mesh-independent rmp_R096_to_RnfA is taken from here.
    oasis_rmp_template_dir: "${general.shared_a270092}/input/oasis/cy48r1/TCO95-CORE3/1792"
    add_namelist_changes:
        namelist.config:
            run_config:
                cavity_gamma_scale: 0.65
        namelist.oce:
            oce_dyn:
                redi_kmax: 0.0
                k_gm_max: 1000.0
        namelist.cvmix:
            param_idemix:
                idemix_botforc_file: "${general.idemix_bot_forcing}"
            param_kpp:
                kpp_av0: 0.005
                kpp_kv0: 0.005
                kpp_avbckg: 0.0001
                kpp_kvbckg: 1e-05

lpj_guess:
    slt_dir: "${general.antfill_root}/input/lpj-guess/slt/"
    nproc: 64
    omp_num_threads: 4
    mip: "cmip7"
    lresume: true
    ini_parent_exp_id: "dbm3"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "/work/ab0246/a270092/runtime/awiesm3-develop-is/dbm3/restart/lpj_guess"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_1905/*

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: true
    ini_restart_dir: "/work/ab0246/a270092/runtime/awiesm3-develop-is/dbm3/restart/oifs/"
    ini_restart_exp_id: "dbm3"
    ini_restart_date: "1904-12-31T23:00:00"
    ini_pseudo_initial_date: "1904-01-01"
    prev_run_config_file: "/work/ab0246/a270092/runtime/awiesm3-develop-is/dbm3/config/dbm3_awiesm3_finished_config.yaml_19040101-19041231"
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: cmip7
    scenario: piControl
    cmip7_cmor_output: false
    choose_general.chunk_number:
        1:
            add_input_files:
                pism2ece_antar: pism2ece_antar
            add_input_sources:
                ICMGG_INIT: "${general.pism_cavity_ini_dir}/oasis/ICMGGab45INIT_feomdyn"
                # The _orog file: ECE_ISM_OROG makes suorog read usurf_oifs from it.
                pism2ece_antar: "${general.pism_cavity_ini_dir}/antar_pism2ece_orog.nc"
                wam_grid_tables: "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_grid_tables"
                wam_subgrid_0:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_0"
                wam_subgrid_1:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_1"
                wam_subgrid_2:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_2"
            add_input_in_work:
                pism2ece_antar: antar_pism2ece.nc
            add_namelist_changes:
                fort.4:
                    NAMECECFG:
                        ECE_LANDICE: ".true."
                        ECE_LANDICE_THRESH: 0.5
                        NISMRGNS: 1
                        "ISMRGNPFX(1)": "antar"
                        "ISMRGNCIS(1)": ".false."
                        ECE_CPL_ISMM: ".true."
                        ECE_ISM_OROG: ".true."
        "*":
            add_input_files:
                pism2ece_antar: pism2ece_antar
            add_input_sources:
                ICMGG_INIT: "${general.experiment_couple_dir}/oasis_regen/ICMGGab45INIT_feomdyn"
                pism2ece_antar: "${general.experiment_couple_dir}/antar_pism2ece.nc"
                wam_grid_tables: "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_grid_tables"
                wam_subgrid_0:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_0"
                wam_subgrid_1:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_1"
                wam_subgrid_2:   "${general.shared_a270092}/input/oifs-48r1/TCO95L91/wam_tables_maxocean_s85/wam_subgrid_2"
            add_input_in_work:
                pism2ece_antar: antar_pism2ece.nc
            add_namelist_changes:
                fort.4:
                    NAMECECFG:
                        ECE_LANDICE: ".true."
                        ECE_LANDICE_THRESH: 0.5
                        NISMRGNS: 1
                        "ISMRGNPFX(1)": "antar"
                        "ISMRGNCIS(1)": ".false."
                        ECE_CPL_ISMM: ".true."
                        ECE_ISM_OROG: ".true."
    namelist_changes:
        fort.4:
            NAMECECFG:
                ECE_CPL_NEMO_WEIGHTED_ICE: ".true."
            NAMSURFTUNE:
                ECE_LANDICE_ALB_FIRN: 0.83
                ECE_LANDICE_ALB_FRESH: 0.89
            NAMMCC:
                LNEMOLIMTEMP: ".false."
                LNEMOLIMTHK: ".true."
                LNEMOSICOUP: ".false."
            NAMECECMIP:
                LCMIP6: False
                LCMIP7: True
                # CMIP7DATADIR is not set here: oifs48.cmip.yaml derives it with its siblings.
                NCMIPFIXYR: 1850
                SCENARIONAME: 'SSP2-4.5'
                LMACV2SP: True
                LMACV2SP_CCNF: True
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8
            NAMDDH:
                LHDGLB: ".false."
                LHDPRG: ".false."
                LHDHKS: ".false."

ismm:
    # Chunk 1 continues dbm3's dEBM2 state (1904-12) instead of starting it cold.
    # Inputs, not restarts: the mapper has no lresume.
    choose_general.chunk_number:
        1:
            debm2_surface_from: ""
            debm2_cold_start: ""
            add_namelist_changes:
                namelist.ismm:
                    NAMISMM:
                        LColdStart: ".false."
                    NAMISMARR:
                        DEBMRunoffRestartList: "${ice_prefix}_debm_runoff_restart.nc"
            add_input_files:
                debm_restart: debm_restart
                debm_runoff_restart: debm_runoff_restart
            add_input_in_work:
                debm_restart: ${ice_prefix}_debm_restart.nc
                debm_runoff_restart: ${ice_prefix}_debm_runoff_restart.nc
            add_input_sources:
                debm_restart: ${general.pism_cavity_ini_dir}/debm/${ice_prefix}_debm_restart.nc
                debm_runoff_restart: ${general.pism_cavity_ini_dir}/debm/${ice_prefix}_debm_runoff_restart.nc

rnfmap:
    runoff_file: "${general.pool_dir}/runoff-mapper/runoff_maps_core3_beta_v1.1.nc"
    omp_num_threads: 4
    interleave_into: [oifs]

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600
    norestart: T
    debug_level: 1
    input_dir: "${general.shared_a270092}/input/oasis/cy48r1/TCO95-CORE3/"
    ini_restart_dir: "${general.shared_a270092}/input/oasis/cy48r1/TCO95-CORE3/"
    choose_general.chunk_number:
        1:
            input_sources:
                grids: "${general.pism_cavity_ini_dir}/oasis/grids.nc"
                masks: "${general.pism_cavity_ini_dir}/oasis/masks.nc"
                areas: "${general.pism_cavity_ini_dir}/oasis/areas.nc"
                rmp: "${general.pism_cavity_ini_dir}/oasis/rmp_*.nc"
            restart_in_sources:
                rmp: "${general.pism_cavity_ini_dir}/oasis/rmp_*.nc"
                rstas.nc: "${general.pism_cavity_ini_dir}/rstas.nc"
                rstos.nc: "${general.pism_cavity_ini_dir}/rstos.nc"
                vegin.nc: "${general.pism_cavity_ini_dir}/oasis/vegin.nc"
                rstism.nc: "${general.pism_cavity_ini_dir}/oasis/rstism.nc"
        "*":
            input_sources:
                grids: "${general.experiment_couple_dir}/oasis_regen/grids.nc"
                masks: "${general.experiment_couple_dir}/oasis_regen/masks.nc"
                areas: "${general.experiment_couple_dir}/oasis_regen/areas.nc"
                rmp: "${general.experiment_couple_dir}/oasis_regen/rmp_*.nc"
            restart_in_sources:
                rmp: "${general.experiment_couple_dir}/oasis_regen/rmp_*.nc"
                rstas.nc: "${general.experiment_couple_dir}/restart_remapped/rstas.nc"
                rstos.nc: "${general.experiment_couple_dir}/restart_remapped/rstos.nc"
                vegin.nc: vegin.nc
                rstism.nc: "${experiment_restart_in_dir}/rstism.nc"

xios:
    with_model:
        - oifs
        - fesom
    nproc: 32
    omp_num_threads: 4
    interleave_into: [oifs]
    ranks_per_node: 3
