name: esm-viz
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  # Web framework
  - fastapi>=0.109.0
  - uvicorn>=0.27.0
  - httpx>=0.26.0
  # Data handling
  - xarray>=2024.1.0
  - dask>=2024.1.0
  - netcdf4>=1.6.5
  - h5netcdf>=1.3.0
  - cfgrib>=0.9.10
  - eccodes>=2.33.0
  # Visualization
  - matplotlib>=3.8.0
  - cartopy>=0.22.0
  - scipy>=1.12.0
  # Interactive (Panel/hvplot with FastAPI integration)
  - panel>=1.5.0
  - hvplot>=0.9.0
  - holoviews>=1.18.0
  - bokeh>=3.3.0
  - geoviews>=1.11.0
  # Scientific colormaps for climate data
  - cmocean>=4.0
  # Remote access
  - fsspec>=2024.2.0
  - paramiko>=3.4.0
  # Utilities
  - loguru>=0.7.2
  - typer>=0.9.0
  - pydantic>=2.5.0
  - pydantic-settings>=2.1.0
  - numpy>=1.26.0
  # Panel FastAPI integration (pip install)
  - pip
  - pip:
    - panel[fastapi]>=1.5.0
