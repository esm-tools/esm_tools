general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "00:00:10"
    initial_date: "1960-01-01"
    final_date: "1960-01-02"
    #base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 10
    restart_unit: "y"
    restart_first: 10
    lresume: false
    time_step: 1800
    nproc: 128 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.ice:
            ice_therm:
                use_meltponds: true

lpj_guess:
    lresume: false 
    nproc: 8 # should be 8
    omp_num_threads: 16 # should be 8

oifs:
    resolution: TL255
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    nproc: 128 #should be 512
    omp_num_threads: 1 #should be 8
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
                RCL_OVERLAPLIQICE: 0.1
            NAMGWWMS:
                GGAUSSB: -0.6

oasis3mct:
    use_lucia: false #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    #lresume: true # Set to false to generate the rst files for first leg
    lresume: false # Set to false to generate the rst files for first leg 
    time_step: 7200
    norestart: false #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4 # should be 4
    omp_num_threads: 32 # should be 32
