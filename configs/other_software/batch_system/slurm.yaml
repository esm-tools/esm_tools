# SLURM YAML CONFIGURATION FILE
#
#

computer:
    header_start: "#SBATCH"
    submit: sbatch
    launcher: srun
    debugger: None
    mail_type: NONE
    account: None

    # Patterns to grep from `declare -p` to save/restore batch env vars across
    # job script stages (e.g. before resubmission). Needed because subprocesses
    # spawned during the job may clear these variables.
    save_batch_env_patterns:
        - "SLURM"

    # intermediate vars

    mail1: ""
    mail2: ""

    exclusive_flag: "--exclusive"

    choose_accounting:
            True:
                    accounting_flag: "--account=${general.account}"

    choose_mail_type:
            "*":
                    mail1:  "--mail-type=${mail_type}"
    choose_general.mail_type:
            "*":
                    mail1:  "--mail-type=${general.mail_type}"
    choose_mail_user:
            "*":
                    mail2:  "--mail-user=${mail_user}"
    choose_general.mail_user:
            "*":
                    mail2:  "--mail-user=${general.mail_user}"

    notification_flag: "${mail1} ${mail2}"
    single_proc_submit_flag: "--ntasks-per-node=1"
    tasks_flag: "--ntasks=@tasks@"
    partition_flag: "--partition=@partition@"
    nodes_flag: "--nodes=@nodes@"
    time_flag: "--time=${compute_time}"
    output_path: "${experiment_dir}/log/"
    thisrun_logfile: "${output_path}${expid}_${general.setup_name}_@jobtype@_${general.current_date!syear!smonth!sday}-${general.end_date!syear!smonth!sday}_%j.log"
    output_flags: "--output=${thisrun_logfile} --error=${thisrun_logfile}"
    name_flag: "--job-name=${expid}"

    taskset: false
    mt_launcher_flag: ""

    add_choose_heterogeneous_parallelization:
        true:
            cpu_bind: "none"
            choose_taskset:
                # Support for old taskset heterogeneous parallelization approach
                true:
                    srun_execution_command: "${debugger_flags_prelauncher} ${launcher} ${launcher_flags} ${mt_launcher_flag}--multi-prog ${config_files.hostfile}"
                # Support for new packjob heterogeneous parallelization approach
                    post_run_commands: "unset SLURM_HOSTFILE"
                false:

     # kh 24.06.22 --hint=nomultithread is needed (in many cases) on levante to avoid hyperthreading
                    launcher_flags_per_component: "
                        ${mt_launcher_flag}
                        --nodes=@nnodes@
                        --ntasks=@nproc@
                        --ntasks-per-node=@nproc_per_node@
                        --cpus-per-task=@cpus_per_proc@
                        --export=ALL,OMP_NUM_THREADS=@omp_num_threads@"
                    srun_execution_command: "${debugger_flags_prelauncher} ${launcher} ${launcher_flags} \\\n@components@"
                    launcher_comp_sep: " \\\n:"
        false:
            cpu_bind: "cores"
            srun_execution_command: "${debugger_flags_prelauncher} ${launcher} ${launcher_flags} ${mt_launcher_flag}--multi-prog ${config_files.hostfile}"

    choose_launcher:
            srun:
                    launcher_flags: "-l --kill-on-bad-exit=1 --cpu_bind=${cpu_bind}"
                    execution_command: ${srun_execution_command}
            mpiexec.hydra:
                    launcher_flags: "-bootstrap slurm"
                    execution_command: "echo mpiexec.hydra as launcher not yet available"
            mpirun:
                    launcher_flags: ""
                    execution_command: "${debugger_flags_prelauncher} ${launcher} ${launcher_flags} $(cat ${config_files.hostfile})"

    choose_debugger:
            None:
                debugger_flags_prelauncher: ""
            ddt:
                debugger_flags_prelauncher: "ddt --connect"
                add_module_actions:
                    - "load arm-forge"

    submitted: false
    script_name: "<--methods.scriptname--"
    actual_script_dir: "<--methods.script_dir--"
    hostname_list: "DUMMY_HOST1 DUMMY_HOST2"

    choose_SLURM_NNODES:
            "*":
                    submitted: true
                    script_name: "<--scriptname--"
                    actual_script_dir: "<--script_dir--"
                    total_nnodes: ${SLURM_NNODES}
                    hostname_list: "<--show_hostnames--"

                    #"<--scriptname--":
                    #method: "squeue --job ${JOB_ID} -o '%o' | cut -f1 -d' ' | basename | cut -f1 -d' '"
                    #"<--scriptdir--":
                    #method: "squeue --job ${JOB_ID} --format '%Z' squeue --job ${JOB_ID} --format '%Z'"
                    #"<--show_hostnames--":
                    #method: "scontrol show hostnames"

    config_files:
            # don't change the name at the moment, it's currently hardcoded in esm_runscripts/slurm.py
            hostfile: hostfile_srun

    check_error:
            # `srun: error:` fires for two distinct situations:
            #   1. Real launch failures (execve, bad host, lost node).
            #   2. The benign pmix_v3 finalize-race cascade where one rank
            #      exits MPI_Finalize a few ms before its peer, the
            #      errhandler fires, slurmstepd cancels the step, and srun
            #      reports `task X: Killed` for every still-living rank.
            # Case 2 happens AFTER all compute is done — we don't want to
            # scancel the job (that would skip tidy and lose all output
            # recovery). Demote to `warn` here; the specific real-failure
            # triggers below still kill the job.
            "srun: error:" :
                    frequency: 30
                    method: "warn"
                    message: "SLURM ERROR (benign finalize cascade or real launch failure — specific triggers below decide whether to abort)."
                    file: "stdout"

            "slurmstepd: error: execve():" :
                    frequency: 600
                    method: "kill"
                    message: "SLURM ERROR: slurm probably didn't find executable"
                    file: "stdout"

            # Real failure signatures — these still kill the job so that
            # tidy does NOT advance the date file on a silent crash.
            "oom_kill event" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: OOM kill event detected — a rank exceeded its cgroup memory limit."
                    file: "stdout"

            "Out Of Memory" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: srun reported Out Of Memory on a task."
                    file: "stdout"

            # NOTE: `Segmentation fault` is NOT in the kill list. At HR scale
            # (Final_CMIP7_IO_Test_14, Test_17 with ~3281 ranks) FESOM rank
            # 1394 hits a UCX `ucs_mpool_cleanup` NULL-deref SIGSEGV during
            # MPI_Finalize *after* compute has reached the final step. The
            # bash exit message is indistinguishable from a real compute
            # segfault via substring match (esm_tools' check_error is
            # substring-only, no regex). Killing on it would lose tidy
            # for a benign teardown bug. The narrower triggers below catch
            # real Fortran / MPI / heap crashes; raw C-level segfaults
            # during compute will produce incomplete output detectable on
            # inspection (output volume / final timestep mismatch).
            "forrtl: severe" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: Intel Fortran runtime error (forrtl: severe ...)."
                    file: "stdout"

            # `forrtl: error (NN)` is the Intel Fortran runtime error handler
            # for non-"severe" faults — floating divide-by-zero / FPE (73),
            # array-bounds, etc. These are genuine compute crashes (e.g. the
            # OIFS climaer/radaca FPE on the moving-cavity coastline emits
            # `forrtl: error (73): floating divide by zero`). Without this the
            # only Fortran trigger was `forrtl: severe`, so an FPE crash slipped
            # through as method-less, tidy advanced the date file, and the run
            # cascaded onto the next chunk on garbage output.
            "forrtl: error" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: Intel Fortran runtime error (forrtl: error (NN) ... — FPE / bounds / I/O)."
                    file: "stdout"

            "MPI_ABORT was invoked" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: explicit MPI_ABORT from a rank."
                    file: "stdout"

            "BAD TERMINATION OF ONE OF YOUR APPLICATION PROCESSES" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: OpenMPI BAD TERMINATION (process exited abnormally during compute)."
                    file: "stdout"

            "Bus error" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: bus error."
                    file: "stdout"

            "DUE TO TIME LIMIT" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: job hit SLURM walltime limit."
                    file: "stdout"

            "Aborted (signal" :
                    frequency: 30
                    method: "kill"
                    message: "MODEL ERROR: process aborted with a signal."
                    file: "stdout"

    # possibility to use less cores than processes. Useful for test runs / debugging
    # can be specified in user runscript
    overcommit_nodes: None
    overcommit_rule: ""

    choose_overcommit_nodes:
        None:
            overcommit_rule: ""
        "*":
            overcommit_rule:  "--overcommit --nodes=${overcommit_nodes}"

    overcommit_flag: "${overcommit_rule}"

    nnodes_envvar: "SLURM_JOB_NUM_NODES"
    nnodes: "$(( os.getenv('SLURM_JOB_NUM_NODES', 1) ))"

dask:
    ntasks: "$(( ${computer.nnodes} * ${computer.partition_cpn} / 4 ))"
    init_scheduler_cmd: "
        srun --ntasks=1 --nodes=1 --cpus-per-task=1 dask scheduler --scheduler-file ${dask.scheduler_json} --interface ib0
        "
    init_workers_cmd: "
        srun --ntasks=${dask.ntasks} --cpus-per-task=1 --nodes=@nodes@ --distribution=cyclic:cyclic:cyclic dask worker --scheduler-file ${dask.scheduler_json} --nthreads 1 --nworkers 1 --interface ib0
        "
