# ---------------------------------------------------------------------------------
# SB3 --- stable-BL mixing via the LENGTH, RSBLLMIN 30 -> 120 m.  The stability-function
# coefficient is left at its 5.0 default, so this arm isolates the mixing length.
#
# WHY THIS ARM.  SB2 works on the target but bills the tropics.  At 44 yr it gives Arctic
# DJF inversion -0.713* and mid-latitude land T2m +0.492* at ZERO Siberian summer cost,
# but its global net TOA +0.175* is SHORTWAVE and cloud-mediated -- SW +0.319, SW CRE
# +0.284, tcc -0.007, lcc -0.005 -- and the tropics carry essentially all of it: tropical
# SW CRE +0.515*, tropical net +0.235*.  Subtropical stratocumulus decks ARE stable
# boundary layers, so a global stability-function change hits them hardest.  That lands on
# nino34 and tas, exactly where cmpitool already scored 11G worse than 11E
# (0.8237 -> 0.8446).
#
# THE HYPOTHESIS.  RSBLLMIN acts through the mixing LENGTH rather than the stability
# function, and inside the stable BL the length is clamp(0.1h, 30, 300), so the 30 m floor
# only binds where the stable layer is shallower than 300 m.  A shallow Arctic winter SBL
# sits under that; a deep subtropical Sc boundary layer does not.  If that is the whole
# story, this buys a comparable Arctic response at a fraction of the tropical cost.  It is
# a REGIME discriminator, not a geographic one -- no latitude-dependent parameter is
# invented anywhere.
#
# WHY IT MAY COME OUT THE OTHER WAY, AND WHY THAT IS WORTH KNOWING.  RSBLLMIN also sets
# the mixing length ABOVE the stable BL: the ELSE branch of vdfexcu assigns
# ZKLENT = ZLMIN unconditionally in free-shear layers.  Over a subtropical Sc deck that is
# more mixing across the capping inversion, i.e. enhanced ENTRAINMENT DRYING, a known way
# to destroy stratocumulus.  So this arm could make the tropical cloud loss WORSE rather
# than better.  The regime argument covers the floor-within-the-BL half of what RSBLLMIN
# does and not the free-shear half; this run settles which dominates.
#
# THE DOSE.  The length route saturates: with l = kappa*z*lambda/(kappa*z+lambda), at
# z = 50 m lambda 30 -> l 12 m, 60 -> 15 m (K x1.56), 120 -> 17.1 m (K x2.03), and
# lambda -> infinity gives only 20 m (K x2.78).  120 m therefore sits near the SB2 dose,
# which is the point: it makes tropical-cost-per-Arctic-benefit directly comparable.
# Going much beyond 120 buys almost nothing.
#
# CONTROL: SB0, already complete, SAME BINARY, group absent so the defaults 5.0 and 30 m
# stand.  This arm changes exactly one number against it.
#
# READ AT LEG 2 (16 yr).  Thresholds there are 0.32 K on the Arctic DJF inversion and
# 0.151 W/m2 on tropical SW CRE, so 16 years already bounds the tropical cost below ~30 %
# of SB2's and resolves an Arctic response a third of SB2's.  The full 46 years only
# tightens the tropical bound to ~17 %; let it run if leg 2 is borderline.
#
# VERIFY: NODE.001_01 must show "SUVDFS: stable-BL mixing" with iostat=0 and
# RSBLLMIN= 1.20000E+02, with the stability coefficient still at 5.00000E+00.  grep it
# with -a; the file is ~2 GB with NUL bytes and reports nothing without it.
# ---------------------------------------------------------------------------------

