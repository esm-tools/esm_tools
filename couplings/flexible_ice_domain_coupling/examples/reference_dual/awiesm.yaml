echam:
    lresume: 0 #1
    ini_parent_dir: "${restart_dir}/echam/"
    ini_parent_date: "31391231"
    ini_parent_exp_id: "AWIESM26_spinup"
    restart_rate: 1
    restart_unit: "years"
    namelist_dir: "/home/a/a270124/namelists/production/echam"
    #scenario: 1990
    scenario_type: PI-CTRL
    ##################################
    # LA: setups for coupling
    multi_year_mean: 0
    oro_update_mod: 1                             # CHANGED (was 6; same code, renumbered)
    oro_update_var: "ormoea"
    albedo_on_glaciers: 0.7 
    glacial_threshold: 0.5
    ##################################
    add_namelist_changes:
        namelist.echam:
#            submodelctl:
#                lupdate_orog: False
            radctl:
                #CO2VMR: 353.86e-6
                #CH4VMR: 1.6936e-6
                #N2OVMR: 0.309e-6
                lrad_async: False
                yr_perp: remove_from_namelist
            runctl:
                l_orbvsop87: false
                default_output: false
            wisoctl:
                lwiso_rerun: false
    workflow:
        next_run_triggered_by: couple_out
        subjobs:
            couple_in:
                nproc: 1
                run_before: prepcompute
                script: coupling_ice2echam.functions          # CHANGED (no separate dual driver)
                script_dir: ${general.script_dir}/echam
                call_function: ice2echam
                env_preparation: ${general.script_dir}/envs/env_awiesm.py   # CHANGED
                run_only: first_run_in_chunk
                skip_chunk_number: 1

            couple_out:
                nproc: 1
                run_after: tidy
                script: coupling_echam2ice.functions
                script_dir: ${general.script_dir}/echam
                call_function: echam2ice
                env_preparation: ${general.script_dir}/envs/env_awiesm.py   # CHANGED
                run_only: last_run_in_chunk


jsbach:
