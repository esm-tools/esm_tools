# AWI-ESM3 CMIP7 piControl - TCO95-CORE3 - 11J: RAUPACH ROUGHNESS ON THE REPAIRED MAP
# =============================================================================
# 11J = 11I (repaired _v2 soil map) PLUS Raupach (1994) canopy roughness computed in
# LPJ-GUESS and sent to OpenIFS.  Its control is 11I, not 11G, so the pair isolates
# roughness on top of a soil map that is already corrected.
#
# THE THREE-ARM DESIGN.  11G / 11I / 11J differ by one thing each:
#   11G  old slt, no Raupach     the current adopted stack
#   11I  _v2 slt, no Raupach     the soil-map repair, priced on its own
#   11J  _v2 slt, Raupach on     roughness, priced on top of the repair
# So 11I-11G is the map and 11J-11I is the roughness, with no confounding.
#
# WHAT RAUPACH DOES, and what to score it on.  FracHVeg is the foliar projective cover
# of TODAY's LAI, so a summergreen boreal canopy is reported as nearly absent in winter
# -- measured in 11E, Siberian cvh falls 0.239 (Aug) to 0.091 (Jan) with the forest
# standing, handing ~91 % of the winter grid box the bare-soil 0.013 m in polar night.
# Raupach has the opposite behaviour: a leafless canopy is the roughest state.  Offline,
# the grid-box roughness goes DJF 0.058 -> 0.140 m and JJA 0.190 -> 0.120 m.
#
# So this is a WINTER lever.  Score it on DJF soil, not on tree cover:
#   DJF soil warms, JJA inside noise    -> adopt
#   DJF soil does not resolve           -> the roughness route is weaker than the
#                                          campaign regression (+0.4 cvh -> +1.2 K) implied
#   JJA cools beyond its threshold      -> the summer cost is real and must be priced
#
# IT IS NOT A FOREST FIX.  BNS clears every climate gate already (tcmax_est -2 C against
# a measured coldest month of -36.1 C) and is limited by C3 grass outcompeting it, which
# roughness does not touch.  Do not read tree cover as the verdict.
#
# BINARY: bin/guess.no46e_soilfix_raupachgated (md5 ff9b5507) -- see the lpj_guess
# section below.  put_2d(GUE_Z0HV) is gated on ifraupachz0.  The gate matters: an
# ungated build aborts against any namcouple without the field, which is what killed
# three legs of 11G on 2026-08-11.
# =============================================================================

general:
    # THE ONE CHANGE vs 11G.  Selects slt_TCO95_CORE3_v2.nc for LPJ-GUESS.  The ICMGG
    # already takes _v2 independently (general.icmgg_slt_suffix); this is the LPJ-GUESS
    # soil map only, which c0ecdf5aa had pinned back to the old name.
    lpjg_slt_suffix: "_v2"
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1400-01-01"  # 50 years -- matches 11A/11B
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    # md5 ff9b5507 -- the SAME binary as 11I (see that runscript for full provenance:
    # 168a98b + 0218bbb, deliberately excluding 46e7a84).  Raupach is gated on
    # ifraupachz0, which 11I leaves off and this arm turns on, so 11J - 11I isolates
    # Raupach alone with no binary difference at all.
    executable: guess.no46e_soilfix_raupachgated
    # Declares GUE_Z0HV on the SENDING side.  Without it esm_runscripts cannot
    # resolve the 'Z0HVeg <--loctrans_avg-- GUE_Z0HV' line in oasis3mct below and
    # logs "Coupling var not found: GUE_Z0HV" -- which is fatal, the experiment
    # directory is never created.  Must sit in lpj_guess, not in oasis3mct.
    add_veg_atm_fields: [GUE_Z0HV]
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        # ifraupachz0 1.  MUST be paired with ECE_CPL_LPJG_Z0 below.
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.raupach.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    # Declares Z0HVeg on the RECEIVING side; the counterpart of
    # lpj_guess.add_veg_atm_fields above.  Must sit in oifs, not in oasis3mct.
    add_atm_veg_fields: [Z0HVeg]
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            NAMECECFG:
                ECE_CPL_LPJG_Z0: True
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                RCL_INPPMIN: 50000.0   # 11G: S4 -- the ONLY change from 11E
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    # Full vegin.nc list restated because add_coupling_target_fields REPLACES it.
    # The first seven are verbatim from awiesm3.yaml and MUST keep this order: the
    # LOCTRANS accumulators in vegin.nc are keyed by namcouple ENTRY INDEX, so
    # inserting mid-list makes OASIS read them back against the wrong fields.
    # New entries go LAST.
    add_coupling_target_fields:
        vegin.nc:
            - 'LAILVeg:LAIHVeg:FracLVeg:FracHVeg:TypeLVeg:TypeHVeg <--loctrans_avg-- GUE_LLAI:GUE_HLAI:GUE_FRAL:GUE_FRAH:GUE_TYPL:GUE_TYPH'
            - 'T2M_LPJG:TPRE_LPJ:SNOC_LPJ:SNOD_LPJ <--loctrans_avg-- T2MVeg:TPVeg:SDVeg:SDensVeg'
            - 'ST1L_LPJ:ST2L_LPJ:ST3L_LPJ:ST4L_LPJ <--loctrans_avg-- SoilTVeg.L001:SoilTVeg.L002:SoilTVeg.L003:SoilTVeg.L004'
            - 'SM1L_LPJ:SM2L_LPJ:SM3L_LPJ:SM4L_LPJ <--loctrans_avg-- SoilMVeg.L001:SoilMVeg.L002:SoilMVeg.L003:SoilMVeg.L004'
            - 'SWNR_LPJ:LWNR_LPJ:SHUM_LPJ:SPRE_LPJ:WSPD_LPJ <--loctrans_avg-- SSRVeg:SLRVeg:SHUMVeg:PRESVeg:WSPDVeg'
            - 'TMIN_LPJ <--loctrans_min-- TMINVeg'
            - 'TMAX_LPJ <--loctrans_max-- TMAXVeg'
            - 'Z0HVeg <--loctrans_avg-- GUE_Z0HV'
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
