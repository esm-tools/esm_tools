# awiesm3 + interactive ice sheet (PISM) coupling: same component set as
# fesom-2.7+oifs-48r1+xios-2.5+lpj_guess-4.1.2, but additionally builds PISM and
# dEBM so the awiesm3<->PISM dynamic-ocean coupling can be built and reproduced
# from a single esm_master target (comp-awiesm3-develop-is). The runtime ice<->
# ocean coupling itself is driven by the couplings/fesom ice2fesom workflow.
components:
- xios-2.5-ece
- rnfmap-v1.1
- oifs-48r1
- fesom-2.7-main
- oasis3mct-5.0-smhi
- lpj_guess-4.1.2
- pism-github1.2.1
- debm-esm_tools
coupling_changes:
- sed -i 's/xios-2.5+/xios/g' oifs-48r1/bundle.yml
- sed -i 's/xios\/build_ecearth/xios/g' oifs-48r1/bundle.yml
- sed -i -E 's#xios-[0-9.+]+/build_ecearth#xios#g' oifs-48r1/bundle.yml
- sed -i 's/oasis3-mct-5.2/oasis/g' oifs-48r1/bundle.yml
