                        PATH: $IO_LIB_ROOT/bin:$PATH
                        LD_LIBRARY_PATH: $IO_LIB_ROOT/lib:$LD_LIBRARY_PATH:/sw/spack-levante/openblas-0.3.18-mzclcq/include:/sw/spack-levante/nvhpc-21.11-5dvdc4/Linux_x86_64/21.11/compilers/include

