general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "v3.5.2"
    account: "clidyn.clidyn"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1901-01-01"
    base_dir: "/albedo/work/user/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 0
    nmonth: 0
    nyear: 1
    use_venv: False

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/albedo/home/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    with_cavity: true
    nproc: 2688
    omp_num_threads: 1
    ranks_per_node: 96
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: true
    ini_parent_exp_id: "foo"
    ini_parent_date: "1900-01-01"
    ini_restart_dir: "/albedo/pool/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1902.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1902.ice.restart/*.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    mip: cmip7
    scenario: piControl
    time_step: 3600
    nproc: 192
    omp_num_threads: 4
    lresume: false

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600

xios:
    with_model: oifs
    nproc: 16
    omp_num_threads: 4
    interleave_into: [oifs]
    ranks_per_node: 3

rnfmap:
    omp_num_threads: 4
    interleave_into: [oifs]
