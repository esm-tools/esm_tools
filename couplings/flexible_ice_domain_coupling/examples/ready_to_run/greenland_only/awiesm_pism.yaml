# ---------------------------------------------------------------------------
# GREENLAND-ONLY  --  AWI-ESM 2.1-paleodyn-2.5 + PISM (Greenland, 5 km)
#
# Submit this file (the other two are pulled in by the "runscript:" keys):
#
#     cd <this directory>
#     esm_runscripts awiesm_pism.yaml -e <your_expid>
#
# All three yaml files must sit in the same directory, and that has to be the
# working directory when you submit -- ESM-Tools resolves "runscript:" against
# the current directory, not against this file.
#
# One ice sheet and NO "ice_domain: True" marker, so ICE_DOMAINS becomes "."
# and the experiment uses the flat couple-directory layout
# (${couple_dir}/latest_*.nc). That is what configs/components/pism expects.
# Every domain loop runs exactly once and every reduction is a pass-through,
# so this is the single-ice-sheet scheme, unchanged.
#
# Everything in "general:" here wins over the same key in awiesm.yaml and
# pism.yaml (the coupling runscript is the receiving config), so keep this
# section minimal -- in particular do not put dates here, the two components
# run on different calendars.
# ---------------------------------------------------------------------------
general:
        iterative_coupling: True
        use_venv: False
        base_dir: "/work/ba0989/a270124/PalModII/experiments"
        account: ba0989

model1:
        setup_name: awiesm
        runscript: awiesm.yaml
        chunk_size: 1
        chunk_unit: "years"

model2:
        setup_name: pism
        runscript: pism.yaml
        chunk_size: 1
        chunk_unit: "years"
