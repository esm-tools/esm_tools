# A general.workflow with a typo in the ordering: the compute plan declares
# preceded_by a plan that does not exist ("preprocess" instead of prepcompute).
# order_plans cannot resolve it as a plan or a (section-qualified) sub_plan, so it
# raises UnknownPlanError rather than killing the interpreter with sys.exit.
entry_point: compute
exit_point: compute
plans:
  compute:
    preceded_by: preprocess
    batch_or_shell: batch
    submit_to_batch_system: true
    next_submit: []
sub_plans: {}
