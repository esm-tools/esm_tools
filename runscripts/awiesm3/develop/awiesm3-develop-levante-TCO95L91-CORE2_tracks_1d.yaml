# Test runscript for the FESOM ship-track / mooring curtain feature
# (io_tracks.F90, feature/tracks branch).
#
# Requirements before submitting:
#   1. ${awiesm3.model_dir}/fesom-2.7 checked out at feature/tracks (the
#      branch that adds io_tracks.F90). esm_master recomp picks up the
#      local checkout; no extra clone needed.
#   2. fesom.x rebuilt against the feature/tracks code.
#
# What this run produces (in addition to the normal CORE2 output):
#   outdata/fesom/temp_track_track1.fesom.<yyyy>.nc
#     dims (time=1, nz=46, track=5)
#     monthly mean of `temp` packed at the nearest strictly-owned CORE2
#     node to each of the 5 waypoints in test_track_core2.csv.
#
# Activation path:
#   The XIOS-coupled FESOM bypasses namelist.io for runtime config and
#   reads ltracks / track_file / track_var from context_fesom.xml via
#   xios_getvar(). The custom context_fesom.xml lives at
#   namelists/fesom2/tracks/context_fesom.xml and is wired in below via
#   add_config_sources. The CSV fixture is wired in via add_input_*.

general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0995"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-3"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 128
    omp_num_threads: 1
    tar_binary_restarts: true

    # Copy the test CSV fixture into the FESOM work dir as `track.csv`
    # so the path matches what context_fesom.xml hands to io_tracks.
    # Swap test_track_core2_transect.csv for test_track_core2.csv to use
    # the simpler 5-point single-segment track.
    add_input_sources:
        track_csv: "${general.esm_namelist_dir}/fesom2/tracks/test_track_core2_transect.csv"
    add_input_files:
        track_csv: "track_csv"
    add_input_in_work:
        track_csv: "track.csv"

xios:
    with_model:
        - oifs
        - fesom
    nproc: 4
    omp_num_threads: 32

    # Substitute the tracks-enabled context_fesom.xml: adds the
    # <variable_group id="fesom_tracks"> block with ltracks=true plus
    # the track_files / track_vars / track_names / track_output_freq
    # overrides that io_xios_init reads via
    # xios_getvar(). Everything else inherits from the base XIOS XML.
    add_config_sources:
        context_fesom: "${general.esm_namelist_dir}/fesom2/tracks/context_fesom.xml"

lpj_guess:
    lresume: false
    nproc: 8
    omp_num_threads: 8

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 256
    omp_num_threads: 1
    mpi: cmip6
    scenario: piControl

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 7200
    norestart: false
