computer:
   pool_dir: "/mnt/lustre-mdc/projects/geomar/foci_input2/" 
   partition: "standard96:test"
general:
   use_venv: False
   verbose: True 
   setup_name: "foci"
   version: "agrif_oasismct4"
   homedir: !ENV ${HOME}

   # operational settings: yearly restarts
   #compute_time: "01:00:00"
   #initial_date: "1900-01-01T00:00:00"       # Initial exp. date
   #final_date: "1940-01-01T00:00:00"         # Final date of the experiment
   #nmonth: 12
   #postprocessing: 1
   #clean_runs: 2
   # test settings, daily restarts
   compute_time: "00:15:00"
   initial_date: "1900-01-01T00:00:00"       # Initial exp. date
   final_date: "1900-01-04T00:00:00"         # Final date of the experiment
   nday: 1 
   postprocessing: 0
   
   # machine specific setup 
   account: shk00060
   base_dir: ${homedir}/esm/esm-experiments-ssd/

   lresume: True
   # test data provided by Tronje Kemena 
   # restarting FOCI-AGRIF from FOCI-AGRIF-MOPS probably does not make sense
   # but hey, this is a test setup
   ini_parent_exp_id: "FOCI2.0-TK105_FAM_ESM_piControl_2129TK012"
   ini_parent_date: "18991231" 
   ini_nemo_restart_steps: 876576 
   #ini_parent_dir: "/scratch/usr/shktkeme/foci_input/FOCI-AGRIF-MOPS-OASISMCT4/${ini_parent_exp_id}/"
   ini_parent_dir: "${computer.pool_directories.focipool}/FOCI_RESTART/${ini_parent_exp_id}/"

foci:
   model_dir: ${general.homedir}/esm/models/foci-agrif_oasismct4/

# set input_dir for oasis grids, masks and areas
# only required as long as we generate the remapping files on the fly 
oasis3mct:
   input_dir: "${computer.pool_directories.focipool}/OASIS3_ECHAM6T63_ORCA05/input/T63_ORCA05_${nemo.nest1}/"
   # test settings, write out coupling files
   # export_mode_a2o: "EXPOUT"
   #export_mode_a2o: "EXPOUT"
   #export_mode: "EXPOUT"
   debug_level: 0

echam:
   scenario: "PI-CTRL"
   resolution: "T63"
   # operational settings: yearly restarts
   #restart_rate: ${general.nmonth}
   #restart_unit: "months"
   # test settings, daily restarts
   restart_rate: ${general.nday}
   restart_unit: "days"
   nproca: 8 
   nprocb: 12
   nprocio: 0
   namelist_changes:
      namelist.echam:
         run_ctl:
            nproma: 32
         parctl:
            iomode: 0
            nprocio: ${nprocio}
         radctl:
            iaero: 3
            io3: 4
            isolrad: 6
            ich4: 3
            in2o: 3
            co2vmr: 284.3169860840e-06
            ch4vmr: 808.2490234375e-09
            n2ovmr: 273.0210571289e-09
            yr_perp: 1850

nemo:
   # set your own agrif input directory
   agrif_dir: ${computer.pool_directories.focipool}/AGRIF/agrif_VIKING10/host_bathy_meter_nest_smoothed_for_TK011
   #smoothdir: "Bathymetry/BaseGridCoastlineSmoothed"
   nest1: VIKING10
   resolution: "ORCA05"
   # overwrite default time step of 1800s 
   time_step: 1800
   version: "ORCA05_LIM2_KCM_AGRIF_OASISMCT4"
   jpni: 36
   jpnj: 24
   nproc: 864 
   # jpni and jpnj are 0 by default, i.e. automatic distribution on CPUs
   #
   # if an initial run does not work, or if you experience instabilities in NEMO or the NEST
   # the following settings may help to get past those instabilities
   #namelist_changes:
   #  namelist_cfg:
   #    namtra_ldf:
   #      rn_aht_0: 599
   namelist_changes:
      namelist_cfg:
         namzgr:
            cn_batmeter: "bathy_meter.nc"

      1_namelist_cfg:
         namlbc:
            rn_shlat: 0.0
         namnc4:
            nn_nchunks_k: 46
   input_sources:
      # Use bathy_meter instead of bathy_updated for VIKING10
      # ask Tronje Kemena for details
      bathy_updated: ${agrif_dir}/bathy_meter.nc

xios:
   nproc: 48
