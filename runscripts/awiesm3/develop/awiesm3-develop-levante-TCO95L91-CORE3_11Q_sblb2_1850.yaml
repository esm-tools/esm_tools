# ---------------------------------------------------------------------------------
# 11Q = 11N + RSBLB 2.0.  Stable-boundary-layer mixing, coupled, at 1850 forcing.
#
# WHY.  djf_bias_vertical_structure.py resolved the coupled DJF land cold bias by height:
# at 60-90N the air-side inversion bias (T925-T2m) is +2.81 K while the skin-side one
# (T2m-Tskt) is only +0.11 K, and the profile decays to -0.42 K by 850 hPa.  The skin is
# already right; the error is in the layer between the screen and 925 hPa, which is mixed
# by the stable branch of VDFEXCU.  That retired the surface-side levers as a class and
# explains three measured nulls -- ECE_LAMSK_SN, Raupach z0 and F1 RVZ0H.
#
# RSBLB is coefficient b of the LTG stable stability functions,
# F_H = 1/(1 + 2b Ri sqrt(1 + d Ri)).  Lowering it lengthens the stable tail; the gain
# grows with Ri, so it acts hardest on the deepest inversions.  Exposed as &NAMVDFS by
# scripts/patches/expose_sbl_mixing.py; defaults reproduce the as-released literals, so a
# fort.4 without the group is bit-identical to the release.
#
# WHAT AMIP MEASURED (SB2 = LX4 + RSBLB 2.0, 44 yr paired, 2026-08-22):
#   DJF inversion   60-90N -0.713*  30-60N -0.371*  all land -0.282*
#   DJF T2m         60-90N +0.285   30-60N +0.492*  all land +0.233*
#   Siberia JJA T2m +0.000          global net TOA +0.175*
# The first lever in this campaign to move the winter land bias with NO Siberian summer
# cost.  It is dose-consistent (SB1 at b=3 gives -0.424 on the Arctic inversion).
#
# WHY COUPLED, GIVEN THE AMIP ARCTIC RESPONSE WAS NOT SIGNIFICANT.  AMIP prescribes sea
# ice, which suppresses exactly the feedback that could amplify an Arctic surface warming
# -- and 45 % of the coupled Arctic inversion bias has no AMIP counterpart at all
# (amip_vs_coupled_inversion.py: +1.54 K AMIP against +2.81 K coupled).  The AMIP +0.285 K
# is therefore plausibly a floor, not an estimate.  Campaign transfer ratios have ranged
# 0.19x to 1.01x, so this can only be settled coupled.
#
# CONTROL.  11N, unchanged.  This is legitimate without a re-run control: the coupled
# source has NO commits since the 08-12 20:44 build 11N used, all four pre-existing
# working-tree modifications predate it (08-11 15:58 to 08-12 20:38), and the &NAMVDFS
# patch is bit-identical with the group absent.  Contrast the AMIP series, where SB0 had
# to be re-run because 75a4e45 had changed the DMS ICMCL ingest after LX4's build.
#
# WHAT WOULD DISQUALIFY IT.  Net TOA beyond about +-0.3 -- AMIP already spends +0.175 of
# that budget, and this is the term that has killed levers before.  Siberian JJA going
# backwards.  The 60-90N inversion bias crossing zero (it has +2.81 K of headroom, and
# AMIP removed 0.713).  Sea ice and the Southern Ocean must be scored explicitly: Ri > 0
# does not know about land, and the stable regime is rare over open ocean but common over
# ice, so this is NOT a land-only lever by construction.
#
# VERIFY BEFORE SCORING.  SUVDFS echoes to NULOUT; confirm "SUVDFS: stable-BL mixing" in
# NODE.001_01 reads iostat=0 and RSBLB= 2.00000E+00.  NODE.001_01 is ~2 GB and contains
# NUL bytes -- grep it with -a or it reports nothing and looks like a failed gate.
# ---------------------------------------------------------------------------------

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1390-01-01"  # 40 yr -> 30 clean matched years vs 11G
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            # 11Q: stable-BL mixing.  New namelist group; see the header.
            NAMVDFS:
                RSBLB: 2.0
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                RCL_INPPMIN: 50000.0   # S4, retained from 11G
                RSNOWLIN2: 0.04        # 11N: LX4's lever
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
