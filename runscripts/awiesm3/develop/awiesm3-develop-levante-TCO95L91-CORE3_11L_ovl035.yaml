# AWI-ESM3 CMIP7 piControl - TCO95-CORE3 - Round 11L
# =============================================================================
# 11L = 11G with RCL_OVERLAPLIQICE 0.65 -> 0.35 (Y1 / A1b).  ONE namelist number.  Everything else --
# FESOM, LPJ-GUESS, S4's RCL_INPPMIN 50000, D2b's RCL_INPSEA 0.2, the initial states --
# is 11G unchanged, and 11G is COMPLETE at 50 years.  Strict one-variable coupled pair
# against a finished run; needs no new control.
#
# WHY THIS, AND WHY NOW.  Measured 2026-08-18 on ONE diagnostic across AMIP and coupled
# (scripts/analysis/amip_vs_coupled_so.py), SO 45-65S TOA SW CRE against CERES:
#
#   AMIP P5  control          -63.097   +4.739 vs CERES   tcc 0.8356
#   AMIP LY2 ovl 0.10 (30 yr) -68.983   -1.147            tcc 0.8474
#   AMIP Y1  ovl 0.35 (1 yr)  -65.845   +1.992            tcc 0.8428
#   CPL  11E base             -62.186   +5.651            tcc 0.8365
#   CPL  11G +S4              -63.673   +4.163            tcc 0.8359
#
# Two things that reframed the Southern Ocean problem:
#
#   1. 84 % of the coupled SO CRE error is ALREADY THERE IN AMIP with a prescribed,
#      correct ocean, and the cloud field transfers (tcc 0.8356 -> 0.8365).  So the SO
#      bias is mostly an unclosed AMIP problem, not a coupling problem.  11G coupled
#      (+4.163) is in fact closer to CERES than the AMIP control (+4.739).
#
#   2. RCL_OVERLAPLIQICE closes it in AMIP where nothing else did.  0.10 closes it
#      outright at 30 years and slightly overshoots; 0.35 reaches +1.992, i.e. ~58 % of
#      the gap, at an AMIP global net of -0.005 -- essentially free.  Neither has ever
#      been run coupled at TCO95.
#
# AND A REGRESSION THIS EXPOSES.  Neither 11E nor 11G sets RCL_OVERLAPLIQICE at all, so
# every TCO95 coupled arm runs at the model default 0.65 (sucldp.F90:307).  The older
# TL255-CORE2 coupled configuration set 0.1.  The value was lost in the TL255 -> TCO95
# transition, silently, and 0.1 is exactly what closes the SO gap in AMIP.
#
# WHAT THIS IS NOT.  It is NOT a direct port of Y1/Y2.  Their AMIP base (X1) includes
# RSNOWLIN2 0.04, which the coupled stack does not carry, and the Y-series header warns
# that RSNOWLIN2 and the overlap act on the same phase so the overlap response on the new
# cloud state cannot be read off its effect on the old one.  This tests the overlap on the
# ADOPTED COUPLED STACK, which is the decision-relevant question, but the AMIP magnitudes
# above should be treated as indicative rather than predictive.
#
# WHAT WOULD DISQUALIFY IT.  The AMIP global-net cost was -1.184 at 0.10 and -0.005 at
# 0.35.  DMS's AMIP global cost DID transfer coupled (11F: net TOA +0.218 -> -0.713), so
# expect the 0.10 arm to cost real energy.  11G sits at net TOA ~+0.2, so an arm that
# lands below about -0.3 has overshot the piControl target and is not adoptable however
# good its Southern Ocean looks.  Watch Siberia JJA too: DMS bought its SO gain partly by
# cooling Siberian summer -0.522 K, the wrong direction for the cold bias.
#
# 40 years, not 50: 11G's 1370-79 decade carries the repaired soil map and must be
# excluded from any pair with it, so 1350-89 yields the same 30 clean matched years the
# S4 comparison used (1350-69 plus 1380-89).

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1390-01-01"  # 40 yr -> 30 clean matched years vs 11G
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                RCL_INPPMIN: 50000.0   # S4, retained from 11G
                RCL_OVERLAPLIQICE: 0.35   # 11L: the ONLY change from 11G
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
