debm:
    model: debm
    type: surface mass balance

    available_versions:
    - "1.0"
    - "fortran"
    - "update"
    - "esm_tools"
    - "1.0-awi.1"

    version: "esm_tools"
    choose_version:
        "1.0":
            branch: "1.0"
        "fortran":
            branch: "fortran"
        "update":
            branch: "update"
        "esm_tools":
            branch: "esm_tools"
            # The esm_tools branch holds the Fortran sources under Fortran-v1.0/
            # (the other branches use Fortran/), so override the build paths here.
            clean_command: cd Fortran-v1.0; rm -rf build CMakeCache.txt
            comp_command: cd Fortran-v1.0; mkdir -p build; cd build; cmake ..; make -j `nproc --all`
            install_bins: Fortran-v1.0/bin/debm
        # Release tag of the esm_tools branch (1889719e), in a fork that will not merge
        # back: upstream v1.0 plus 25 commits. Used by awiesm3 v3.5.0-is. It keeps the
        # build directory debm-esm_tools.
        "1.0-awi.1":
            branch: "1.0-awi.1"
            git-repository: https://github.com/JanStreffing/dEBM
            destination: debm-esm_tools
            clean_command: cd Fortran-v1.0; rm -rf build CMakeCache.txt
            comp_command: cd Fortran-v1.0; mkdir -p build; cd build; cmake ..; make -j `nproc --all`
            install_bins: Fortran-v1.0/bin/debm

    clean_command: cd Fortran; rm -rf build CMakeCache.txt
    comp_command: cd Fortran; mkdir -p build; cd build; cmake ..; make -j `nproc --all`
    git-repository: https://github.com/ukrebska/dEBM
    contact: ukrebska(at)awi.de
    install_bins: Fortran/bin/debm

    metadata:
        Institute: AWI
        Description:
            dEBM is a surface melt scheme to couple ice and climate models in paleo applications.
        Publications:
            "Krebs-Kanzow, U., Gierz, P., and Lohmann, G., Brief communication: An Ice surface melt scheme including the diurnal cycle of solar radiation, The Cryosphere Discuss., accepted for publication <https://doi.org/10.5194/tc-2018-130>"
        License:
            MIT
