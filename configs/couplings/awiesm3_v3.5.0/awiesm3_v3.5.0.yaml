# AWI-ESM3 v3.5.0 and v3.5.0-cc: every component pinned to a release tag.
# The moving line is fesom-2.8+oifs-48r1+xios-2.5+lpj_guess-4.1.2 (v3.5, develop*).
components:
- xios-2.5.4
- rnfmap-v1.4
- oifs-48r1v6
- fesom-2.8.2
- oasis3mct-5.3
- lpj_guess-4.1.13
coupling_changes:
- sed -i.bak 's/xios-2.5+/xios/g' oifs-48r1/bundle.yml
- sed -i.bak 's/xios-3.0/xios/g' oifs-48r1/bundle.yml
- sed -i.bak 's/xios\/build_ecearth/xios/g' oifs-48r1/bundle.yml
- sed -i.bak 's/oasis3-mct-5.2/oasis/g' oifs-48r1/bundle.yml
- sed -i.bak '/^ *ENABLE_CUDA=OFF$/d' oifs-48r1/bundle.yml
- sed -i.bak 's/ATLAS_ENABLE_CUDA=OFF$/ATLAS_ENABLE_CUDA=OFF ENABLE_CUDA=OFF/' oifs-48r1/bundle.yml
- rm -f oifs-48r1/bundle.yml.bak
