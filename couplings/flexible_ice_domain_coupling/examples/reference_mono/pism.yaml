# Adapted from /work/ba0989/a270124/PalModII/experiments/pi_ctl_1x1_icb/scripts/
# for couplings/flexible_ice_domain_coupling. Only the marked lines differ from
# the original; see MIGRATION.md for the full list.
#
# One ice sheet, so no "ice_domain: True" marker: the experiment keeps the flat
# couple-directory layout (${couple_dir}/latest_*.nc) that configs/components/
# pism expects, and every domain loop runs exactly once.
# NOTE: script_dir must point at this coupling tree. ${general.esm_couplings_dir}
#       resolves to the *installed* esm_tools (/home/a/a270124/esm_tools/couplings),
#       so the absolute path to the _develop checkout is used here. Alternatively
#       symlink it once and go back to ${general.esm_couplings_dir}/...:
#         ln -s /home/a/a270124/_develop/esm_tools/couplings/flexible_ice_domain_coupling \
#               /home/a/a270124/esm_tools/couplings/flexible_ice_domain_coupling
general:
        setup_name: pism
        compute_time: "00:40:00"
        initial_date: "42575-01-01"
        final_date: "60000-12-31"
        base_dir: "/work/ba0989/a270124/PalModII/experiments"
        script_dir: "/home/a/a270124/_develop/esm_tools/couplings/flexible_ice_domain_coupling"                     # CHANGED
        nyear: 1
        files_to_wait_for: 
            - "latest_atmo_forcing_file.nc"
            - "latest_ocean_forcing_file.nc"
        use_venv: False

pism:
        version: "github1.2.1"
        resolution: "5km"
        domain: "greenland"
        model_dir: "/home/a/a270124/model_codes/pism/pism-v1.2.1/"
        lresume: 1
        
        nx: 301
        ny: 561
        #nx: 337 
        #ny: 577 

        ###################
        # Settings for AWIES - PISM coupling
        # DEBM
        debm_path: "/home/a/a270124/model_codes/dEBM/Fortran/dEBMmain"
        debm_beta: "WIND"
        # lapse rate
        lapse_rate: -0.005
        ablation_method: "DEBM"
        thk_threshold: 5.0
        select_min_glacial_depth: 1
        downscale_precip: 0
        multi_year_mean_smb: 1
        orog_reference_pism: 4
        iceberg_coupling: 1
        #reduce_temp: False
        #reduce_temp_by: "anom"
        #temp2_bias_file: "/work/ba0989/a270124/PalModII/experiments/hist_awiesm-2.1/temp2.bias.bilT63.1948-2010.no_greenland.nc"
        #prec_anom: False
        #prec_bias_file: "/work/ba0989/a270124/PalModII/experiments/hist_awiesm-2.1/prec.bias.conT63.1948-2010.no_greenland.nc"
        ###################
        
        ini_parent_exp_id: "bla"
        ini_parent_date: "1-1-1"
        ini_restart_dir: "bla"
#        spinup_file: "/work/ba0989/a270124/PalModII/experiments/piGrSIA5_for_bootstrap_30y_corrObl_corrOF/restart/pism/piGrSIA5_for_bootstrap_30y_corrObl_corrOF_pismr_restart_100500101-100591231.nc"
        spinup_file: "/work/ba0989/a270124/PalModII/experiments/pi_spinup_3rd_cont_mid/restart/pism/pi_spinup_3rd_cont_mid_pismr_restart_425700101-425741231.nc"
        pool_dir: "/work/ba1066/a270124/pool_pism/"
        ts_interval: "1"
        ex_interval: "monthly"
        force_bootstrap_first_run: False

        kv_pairs:
            stress_balance.model: "ssa+sia"
            stress_balance.sia.max_diffusivity: 800
            sia_e: 3.5
            ssa_e: 1.0
            basal_resistance.pseudo_plastic.q: 0.5
            basal_resistance.pseudo_plastic.u_threshold: 100
            basal_yield_stress.mohr_coulomb.till_effective_fraction_overburden: 0.01
            basal_yield_stress.mohr_coulomb.till_phi_default: 30
            basal_yield_stress.mohr_coulomb.till_cohesion: 0
            basal_yield_stress.mohr_coulomb.till_compressibility_coefficient: 0.12
            hydrology.tillwat_max: 1
            bed_deformation.model: "lc"
            calving.methods: 'eigen_calving,thickness_calving'
            calving.thickness_calving.threshold: 200
#            geometry.front_retreat.prescribed.file: "/work/ba1066/a270124/pool_pism/masks/nhem/pismr_nhem_10km_no-tibet_mask.nc"
            ocean.pik_melt_factor: "1e-2"
            atmosphere.elevation_change.precip_lapse_rate: 0.0
            atmosphere.elevation_change.smb_lapse_rate: 0.0
            max_dt: 0.025

        flags:
            - "pik"
            - "basal_resistance.pseudo_plastic.enabled"
            - "basal_yield_stress.slippery_grounding_lines"

        couplers:
            surface: 
                given:
                    files:
                        surface_given_file: "latest_atmo_forcing_file.nc"
                    kv_pairs: 
                        surface_given_period: 1
            ocean:
                th:
                    files:
                        ocean_th_file: "latest_ocean_forcing_file.nc"

        workflow:
            next_run_triggered_by: couple_out
            subjobs:
                couple_in:
                        nproc: 1
                        run_before: prepcompute
                        script: coupling_awiesm2pism.functions
                        script_dir: ${general.script_dir}/pism
                        call_function: awiesm2pism
                        env_preparation: ${general.script_dir}/envs/env_ice.py         # CHANGED
                        run_only: first_run_in_chunk

                couple_out:
                        nproc: 1
                        run_after: tidy
                        script: coupling_pism2awiesm.functions
                        script_dir: ${general.script_dir}/pism
                        call_function: pism2awiesm
                        env_preparation: ${general.script_dir}/envs/env_ice2awiesm.py  # CHANGED
                        run_only: last_run_in_chunk

              #  postprocessing:
              #          nproc: 1
              #          #batch_or_shell: batch
              #          order_in_cluster: concurrent
              #          run_on_queue: ${computer.partitions.pp.name}
              #          run_after: couple_out
              #          script_dir: /home/a/a270124/scripts/
              #          submit_to_batch_system: True
              #          script: post_pism_archive.sh ${general.expid} ${general.chunk_start_date!syear} ${general.chunk_end_date!syear} ${general.nyear}
              #          run_only: last_run_in_chunk
