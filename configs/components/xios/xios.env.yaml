computer:
    choose_general.execution_mode:
        compile:
            choose_computer.name:
                levante:
                    add_module_actions:
                        - "load perl"
                    add_export_vars:
                        # HDF5 + c-blosc roots used by the xios comp_command's
                        # hdf5-blosc plugin build step. Must match the HDF5 ABI
                        # that XIOS / netCDF4 was built against (Levante:
                        # hdf5-1.12.1-tvymb5). For other HPCs add a similar
                        # entry with the spack/module-resolved paths.
                        HDF5_ROOT: /sw/spack-levante/hdf5-1.12.1-tvymb5
                        C_BLOSC_ROOT: /sw/spack-levante/c-blosc-1.21.6-k4kqv3
        run:
            add_export_vars:
                # Where HDF5 looks for filter plugins at runtime. The plugin
                # libh5blosc.so is built into ${xios.model_dir}/hdf5-blosc/plugin
                # by the xios comp_command (see xios.yaml). XIOS's patched
                # netCdfInterface.cpp calls nc_def_var_filter(id=32001) for
                # blosc+zstd compression of NetCDF4 output.
                HDF5_PLUGIN_PATH: ${xios.model_dir}/hdf5-blosc/plugin
