# Standalone ICON (2025.10-public) AMIP runscript, R02B05 (grid 0030), nesh,
# 1979-01-01 to 2021-12-31, with HadISST 2.4 SST and sea ice (icon.sstice: hadisst2p4:
# HadISST 2.4.0.0 SST member 001 + HadISST 2.2.1.0 sea ice, GEOMAR mid-month adjustment,
# r0003, see ceresmip/src/sst_seaice/r0003/README.md). CERESMIP uses HadISST 2.4 for the
# first simulations, which therefore end in 2021 (end of the dataset).
# R2B5 counterpart of icon-2025.10-amip-r2b4-hadisst2p4-nesh_1979-2021.yaml.
#
# Model setup: as icon-amip-01 (icon-2025.10-amip-r2b5-nesh_1979-2024.yaml): forcing
# cmip7hist (prescribed GHG concentrations), namelists/icon/2025.10-public/R02B05/amip
# (tuning = ICON-FESOM GEOMAR R2B5 templates = Trang's values), except
#   - SST/sea ice: hadisst2p4 (icon-amip-01: hadisst1p1)
#   - land: amip_surface xpp-r0007 = extpar + JSBACH files of 0030-0062/land/r0007 and
#     ic_land_soil.nc of r0008, as Trang's mkexp AMIP scripts of 2026-11; consistent
#     land-sea mask (icon-amip-01: mixed, inconsistent mask). For Trang's older setup
#     (land r0003) use amip_surface: xpp.
# Not taken from Trang's 2026-11 scripts (see ceresmip CLAUDE.md): emission-driven CO2
#   tracer, VSOP87 orbit fixed at 1850 (izenith 7, not in 2025.10-public), QUINCY.
#
# Before the first run:
#   - input data: 0030_geomar/sst_and_seaice/r0003 in the pool (ceresmip/nesh/copy_r0003_to_pool.sh)
#   - a 10-day test with this setup is recommended (copy of icon-2025.10-amip-r2b5-nesh.yaml
#     with sstice: hadisst2p4, amip_surface: xpp-r0007)
#
# Run length: 3 runs of 14 years (1979-1992, 1993-2006, 2007-2020; ~2.27 h per model year
#   on 24 nodes = ~32 h, 48 h limit), final_date 2021-01-01. Then 2021 as one run, started
#   by hand (ESM-Tools does not shorten the last run, and the SST/sea ice data end on
#   2022-01-16): set runlength: 1, nyear: 1 (choose_unit), checkpoint_interval: P01Y and
#   final_date: "2022-01-01", and resubmit; the experiment continues from the 2021-01-01 restart.
# Restart files: every 2 years (checkpoint_interval, ~4.9 GB each, they stay in run_*/work),
#   the restart at the end of each run is copied to restart/icon. Check that the final
#   restart exists before trusting "Experiment over" (node loss, see CLAUDE.md).
# Disk: ~140 GB per year of daily 3d model-level output (~2 TB per 14-year run) before the
#   interpolation job deletes it (interp_to_plev_ml_files: remove).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
        # nodes that were thermally throttled on 2026-11-09 (half speed)
        - "--exclude=nesh-srp[224-227]"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "48:00:00"

   initial_date: "1979-01-01T00:00:00"       # Initial exp. date
   final_date: "2021-01-01T00:00:00"         # Final date of the experiment, see above for 2021
   # set length and unit of each run, both are used to set the ESM-Tools run
   # length and the ICON restart_interval (end of the run)
   runlength: 14
   unit: 'y' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 14
         unitUpper: 'D'
      'm':
         nmonth: 14
         unitUpper: 'M'
      'y':
         nyear: 14
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B05
   grid_id: '0030'

   amip: True
   # extpar, JSBACH land files and sea-ice snow albedo (see amip_surface in icon.yaml):
   # xpp-r0007 = 0030-0062/land/r0007 extpar + JSBACH files, r0008 ic_land_soil (as Trang 2026-11)
   amip_surface: xpp-r0007
   # HadISST 2.4.0.0 SST (member 001) + HadISST 2.2.1.0 sea ice, 1949-2021 (r0003, see icon.yaml)
   sstice: hadisst2p4
   scenario: 'cmip7hist'
   cmip7_scenario: m

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job). The daily
   # model-level files are deleted (140 GB per year) once the pressure-level file
   # passed its check, the monthly ones are moved to outdata/icon/3d_ml (needed for aec)
   interp_to_plev: True
   interp_to_plev_ml_files: remove

   # 24 nodes, as icon-amip-01 (scaling test 2026-11-05: 96 % efficiency 12 -> 24 nodes)
   nproc: 768
   omp_num_threads: 1
   dtime: 450

   # restart files every 2 years (checkpoint_interval), the run stops after runlength
   # (restart_interval). Output intervals are set per stream in the amip NAMELIST_atm
   checkpoint_interval: P02Y
   restart_interval: P${general.runlength}${general.unitUpper}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 2
         output_nml:
            # yearly files, as in icon-fesom-pictl-r2b5-core2-levante_multiyear_geomar.yaml
            # (f90nml applies this to all output_nml groups)
            file_interval: "P01YT1S"
