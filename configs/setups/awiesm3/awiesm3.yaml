#########################################################################################
######################### AWIESM3 YAML CONFIGURATION FILE  ###############################
#########################################################################################
general:

    model: awiesm3

    model_dir: ${esm_master_dir}/awiesm3-${general.version}

    lresume: false
    coupled_setup: true

    # Default off; set true in a runscript to enable the concentration-driven
    # CO2 spinup mode (see choose_general.with_co2_concdriven in the oifs section).
    with_co2_concdriven: false

    # PISM<->FESOM dynamic-mesh (ice2fesom) runtime coupling. A feature switch,
    # NOT tied to the model version: any awiesm3 version can enable it by setting
    # `interactive_mesh: true` in the runscript, without needing a dedicated -is
    # version variant. Gates the coupling workflow/config in the fesom, oifs and
    # oasis3mct sections (choose_general.interactive_mesh). The -is *build* target
    # (couplings list + meshpart_flag) stays under choose_general.version because
    # esm_master needs a named compile target; all runtime wiring lives behind
    # this flag.
    interactive_mesh: false

    include_models:
        - fesom
        - oifs
        - rnfmap
        - lpj_guess
        - oasis3mct

    available_versions:
        - 'v3.4.0'
        - 'v3.4.1'
        - 'v3.4.2'
        - 'develop'
        - 'develop-cc'
        - 'develop-is'

    choose_version:
        v3.4.0:
            major_version: v3.4
            couplings:
                - awiesm3_v3.4.0
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: false
            with_co2_oce_coupling: false
            with_co2_veg_coupling: false
        v3.4.1:
            major_version: v3.4
            couplings:
                - awiesm3_v3.4.1
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: false
            with_co2_oce_coupling: false
            with_co2_veg_coupling: false
        v3.4.2:
            major_version: v3.4
            couplings:
                - awiesm3_v3.4.2
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: false
            with_co2_oce_coupling: false
            with_co2_veg_coupling: false
        develop:
            major_version: v3.4
            couplings:
                - fesom-2.7+oifs-48r1+xios-2.5+lpj_guess-4.1.2
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: false
            with_co2_oce_coupling: false
            with_co2_veg_coupling: false
            
        develop-cc:
            major_version: v3.4
            couplings:
                - fesom-2.7+oifs-48r1+xios-2.5+lpj_guess-4.1.2
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: true
            with_co2_oce_coupling: true
            with_co2_veg_coupling: true

        # Ice-sheet coupled variant: same as develop, but additionally builds
        # PISM and dEBM so the awiesm3<->PISM dynamic-ocean coupling can be run
        # (and reproduced by any user) from a single esm_master target:
        #   esm_master comp-awiesm3-develop-is
        develop-is:
            major_version: v3.4
            couplings:
                - fesom-2.7+oifs-48r1+xios-2.5+lpj_guess-4.1.2+pism-github1.2.1+debm
            # NB: pism + debm are built via the coupling above, but must NOT be
            # added as awiesm3 runtime models. add_include_models launches them in
            # the awiesm3 OASIS/MPMD job, where pismr would join MPI_COMM_WORLD
            # without being one of OASIS's components ($NBMODEL: fesom OpenIFS
            # guess rnfma xios.x) -> OASIS deadlocks at init. PISM runs as model2
            # of the iterative coupling; dEBM is invoked from PISM's coupler.
            add_include_models:
                - xios
            oasis_with_yac: false
            xios_interp_order: 1
            with_co2_tracer: false
            with_co2_oce_coupling: false
            with_co2_veg_coupling: false

    version: "v3.4"
    resolution: ${oifs.resolution}_${fesom.resolution}
    postprocessing: false
    post_time: "00:05:00"
    compute_time: "00:30:00"
    parallel_file_movements: 'threads'

    reusable_filetypes: [input, bin, src]

    with_co2_coupling: false

    force_overwrite_in_file_movements: True

    choose_computer.name:
        levante:
            pool_dir: "/work/ab0246/a270092/input/"
        juwels:
            pool_dir: "/p/project/chhb19/jstreffi/input"
        aleph:
            pool_dir: "/proj/awi/input"
        albedo:
            pool_dir: "/albedo/pool/"
        "*":
            pool_dir: "TO-BE-DEFINED-BY-THE-USER"

        # Load compute recipe from oifs.yaml
    prepcompute_recipe: ${oifs.prepcompute_recipe}
    tidy_recipe: ${fesom.tidy_recipe}

    # Load general environment for the whole coupled setup
    dr_hook_ignore_signals: -1
    required_plugins:
        - "git+https://github.com/JanStreffing/ocp-tool"

#########################################################################################
########### necessary changes to submodels compared to standalone setups ################
#########################################################################################

oifs:
    version: "48r1"

    # oasis_rmp_rst_to_input copies a run's freshly generated OASIS rmp/rst
    # weights back into the shared canonical pool (${pool}/<nproc>/). That is
    # fine for a fixed-mesh run, but a moving-cavity run (with_cavity: true)
    # regenerates mesh-specific weights every leg (feom node count changes with
    # the coastline) and keeps them in its own couple/ + restart dirs. Writing
    # those back would overwrite the canonical fixed-mesh pool and break other
    # runs that read it. So only enable the pool write-back for non-cavity runs.
    choose_fesom.with_cavity:
        false:
            add_prepcompute_recipe: ["oasis_rmp_rst_to_input"]
        true: {}

    pool_dir: ${general.pool_dir}
    model_dir: ${general.model_dir}/oifs-${oifs.version}
    setup_dir: ${general.model_dir}
    restart_firstlast: "last"
    restart_rate: 12
    ocean_resolution: "${fesom.resolution}"

    scenario: "historical"
    mip: "cmip7"
    cmip7_cmor_output: ""

    input_expid: awi3 # This cannot be longer than 4 characters
    input_dir: ${pool_dir}/oifs-${version}
    rtables_dir: ${input_dir}/rtables/
    forcing_dir: ${input_dir}/${version}/ifsdata/
    ifsdata_dir: ${input_dir}/${version}/ifsdata/

    choose_general.major_version:
        "v3.4":
            with_xios: true
            build_type: 'release'
            comp_command: "./openifs-bundle create; ./openifs-bundle build --threads=32
                --openifs-only --without-double-precision --with-cplng2 --with-oifs-xios
                --build-type=${build_type} --install;
                git config core.fileMode false; mv install/bin/ifsMASTER.SP install/bin/OpenIFS;
                nohup chmod -R ${source_code_permissions} . >/dev/null 2>&1 & disown"
            namelist_dir: ${general.esm_namelist_dir}/oifs/${version}/awicm3/v3.4
            wam: true
            add_add_namelist_changes:
                fort.4:
                    NAMCT0:
                        LXIOS: true
                    NAEPHY:
                        LECURR: true

    choose_general.version:
        v3.4.2:
            add_add_namelist_changes:
                fort.4:
                    NAMCLDP:
                        RVICE: 0.16
                    NAEPHY:
                        LRDALB: false
        develop:
            add_add_namelist_changes:
                fort.4:
                    NAMCLDP:
                        RVICE: 0.16
                    NAEPHY:
                        LRDALB: false
        develop-cc:
            add_add_namelist_changes:
                fort.4:
                    NAMCLDP:
                        RVICE: 0.16
                    NAEPHY:
                        LRDALB: false

    cmip6_data_dir_nml: ${input_dir}/cmip6-data
    cmip5_data_dir_nml: ${input_dir}/cmip5-data

    # nproc must be not a prime number for OpenIFS parallelisation to work
    # (This is just one of the many mysteries of the IFS...)
    #
    # We want to use 1 CPU for runoff mapper
    # 287 fulfills this requirement and 288 divides well with 36 and 48
    # (287 = 41 * 7)
    # so that the configuration fills up the compute nodes
    # 575 would also be ok (575 = 23 * 25)
    # Note: If we don't use MPI/OMP we don't need full nodes for oifs.
    nproc: 36
    omp_num_threads: 2

    perturb: 0
    ensemble_id: 1

    restart_type: "ifs_default"

    resolution: TCO95
    levels: L91

    add_namelist_changes:
        fort.4:
            NAMECECFG:
                ECE_CPL_NEMO_LIM: .false.
                ECE_CPL_AMIP: .false.
                ECE_CPL_FESOM_FESIM: .true.
                ECE_CPL_LPJG: .true.

    # PISM<->FESOM dynamic-mesh coupling (general.interactive_mesh): copy the OIFS
    # output the ice-sheet coupler consumes. Version-independent, like the fesom
    # side. NB: the -is land-ice / ICMGG namelist changes stay in the runscript --
    # they interleave with the NAMECECFG add_ escalation chain below.
    choose_general.interactive_mesh:
        true:
            workflow:
                subjobs:
                    just_copy:
                        nproc: 1
                        run_after: tidy
                        script_dir: ${general.esm_couplings_dir}/oifs
                        script: just_copy_stuff.functions
                        call_function: just_copy
                        env_preparation: env_oifs2ice.py

    res_level: ${resolution}${levels}
    atm_oce_fields: [A_Qns_oce, A_Qs_all, A_Precip_liquid, A_Precip_solid, A_Evap,
        A_Subl, A_Q_ice, A_TauX_oce, A_TauY_oce, A_TauX_ice, A_TauY_ice, A_SST, A_Ice_frac,
        A_Snow_thickness, A_Ice_temp, A_Ice_albedo, A_CurX, A_CurY, A_WindX, A_WindY, 
        A_FCO2_oce, A_XCO2_oce]
    atm_veg_fields: [LAILVeg, LAIHVeg, FracLVeg, FracHVeg, TypeHVeg, TypeLVeg, T2MVeg,
        TPVeg, SDVeg, SDensVeg, SoilTVeg.L001, SoilTVeg.L002, SoilTVeg.L003, SoilTVeg.L004,
        SoilMVeg.L001, SoilMVeg.L002, SoilMVeg.L003, SoilMVeg.L004, SSRVeg, SLRVeg,
        SHUMVeg, PRESVeg, WSPDVeg, TMINVeg, TMAXVeg, XCO2Veg, FCO2NAT, FCO2ANT, FCO2NPP]
    coupling_fields:
        "[[atm_oce_fields-->FIELD]]":
            grid: atma
        "[[atm_veg_fields-->FIELD]]":
            grid: atma
        A_Runoff:
            grid: atmr
        A_Calving:
            grid: atmr

    input_files:
        ICMGG_INIT: ICMGG_INIT
        ICMGG_INIUA: ICMGG_INIUA
        ICMSH_INIT: ICMSH_INIT

    prepifs_dir: ${input_dir}/${res_level}/
    tl_o3_data_dir: ${input_dir}/${version}/climate/
    ICMGG_INIT_name: "_${fesom.resolution}"

    # CO2 tracer is turned on, if at least one of the couplings for co2 is active    

    choose_general.with_co2_oce_coupling:
        true:
            add_add_add_add_add_namelist_changes:
                fort.4:
                    NAMECECFG:
                        ECE_CPL_FESOM_RECOM: true

    choose_general.with_co2_veg_coupling:
        true:
            add_add_add_add_add_add_namelist_changes:
                fort.4:
                    NAMECECFG:
                        ECE_CPL_LPJG_CO2: true

    # Concentration-driven CO2 spinup mode. Feeds the ocean BGC the spatially-
    # homogeneous CMIP CO2 (RCARDI from ECE_CMIP_GHG) instead of the prognostic
    # CO2 tracer (ECE_CPL_FESOM_RECOM_CONCDRIVEN), and keeps the tracer out of
    # radiation (LECO2TRA=.false.). Needs with_co2_oce_coupling (RECOM) and
    # with_co2_tracer (NGHG=1), both on for develop-cc.
    choose_general.with_co2_concdriven:
        true:
            add_add_add_add_add_add_add_namelist_changes:
                fort.4:
                    NAMECECFG:
                        ECE_CPL_FESOM_RECOM_CONCDRIVEN: true
                    NAERAD:
                        LECO2TRA: false

    choose_general.with_co2_tracer:
        true:
            branch: 'lpj_guess_implementation+co2'
            namelist_changes:
                fort.4:
                    NAMGFL:
                        NGHG: 1
                        YGHG_NL(1)%CNAME: "CO2_GHG"
                        YGHG_NL(1)%IGRBCODE: 210061
                        YGHG_NL(1)%LADV: TRUE
                        YGHG_NL(1)%LADV5: TRUE
                        YGHG_NL(1)%LREQOUT: TRUE
                        YGHG_NL(1)%LMASSFIX: TRUE
                        YGHG_NL(1)%LQM: FALSE
                        YGHG_NL(1)%LQM3D: TRUE
                        YGHG_NL(1)%LNEGFIX: FALSE
                        YGHG_NL(1)%BETAMFBC: 2
                        YGHG_NL(1)%LASSIM: TRUE
                        NMFDIAGLEV: 2
                        NOPTVFE: 1

                    NAMCOMPO:
                        LCHEM_DIA: .false.
                        LCHEM_DDFLX: .false.
                        LCOMPO_DDFLX_DIR: .false.
                        LCHEM_TROPO: .false.
                        LCOMPO_DCDD: .false.
                    NAEPHY:
                        LNEEONLINE: False
                        LWETONLINE: False
                        LBFASCO2: False


fesom:
    version: "2.7"
    time_step: 1800
    resolution: CORE2
    lresume: false
    nproc: 72
    omp_num_threads: 1
    choose_general.with_co2_oce_coupling:
        true:
            branch: fesom2.6_recom_awiesm3_co2_coupling
            recom_setting: 2p3z2d
            recom_comp_flag: -DRECOM_COUPLED=ON
            # Derive the REcoM &parecomsetup gates from recom_setting so the BGC
            # XIOS file_def only enables the tracers/diagnostics that exist for
            # this configuration (see namelists/fesom2/xios_xml/file_def_fesom.xml.j2).
            choose_recom_setting:
                2p1z1d:
                    recom_enable_3zoo2det: true
                    recom_enable_coccos: false
                2p3z2d:
                    recom_enable_3zoo2det: true
                    recom_enable_coccos: false
                3p3z2d:
                    recom_enable_3zoo2det: true
                    recom_enable_coccos: false
                4p3z2d:
                    recom_enable_3zoo2det: true
                    recom_enable_coccos: true
            add_namelists:
                - namelist.recom
            add_config_files:
                recom:     recom
            add_config_sources:
                recom:     "${namelist_dir}/bin_${recom_setting}/namelist.recom"
                tra:       "${namelist_dir}/bin_${recom_setting}/namelist.tra"
                io:        "${namelist_dir}/bin_${recom_setting}/namelist.io"
            add_config_in_work:
                recom:     "namelist.recom"
            recom_input_path: '/work/ab0246/a270092/input/fesom2/recom/'
            add_add_namelist_changes:
                namelist.recom:
                    nam_rsbc:
                        nm_fe_data_file: '${recom_input_path}/${resolution}/DustClimMonthlyAlbani.nc'
                        nm_aen_data_file: '${recom_input_path}/${resolution}/AeolianNitrogenDep.nc'
                        nm_river_data_file: '${recom_input_path}/${resolution}/RiverineInput.nc'
                        nm_erosion_data_file: '${recom_input_path}/${resolution}/ErosionInput.nc'
                        nm_co2_data_file: '${recom_input_path}/MonthlyAtmCO2_gcb2023.nc' # not used but searched for by bin. TODO: test removing.
                    pavariables:
                        REcoMDataPath: '${recom_input_path}/${resolution}' 
        false:
            recom_comp_flag: ""

    build_type: Release #Available options: Debug Release RelWithDebInfo MinSizeRel
    with_xios: true
    choose_with_xios:
        true:
            comp_command: export XIOS_ROOT=${model_dir}/../xios; mkdir -p build; cd build; cmake -DOIFS_COUPLED=ON -DFESOM_COUPLED=ON
                         -DENABLE_OPENMP=ON -DOPENMP_REPRODUCIBLE=OFF -DDISABLE_MULTITHREADING=OFF -DDISABLE_PARALLEL_RESTART_READ=ON ${recom_comp_flag} -DFESOM_WITH_XIOS=ON -DCMAKE_BUILD_TYPE=${build_type} -DDISABLE_MULTITHREADING=OFF
                        ${yac_flag} ${meshpart_flag} -DCMAKE_INSTALL_PREFIX=../  ..;   make install
                        -j `nproc --all`
        false:
            comp_command: mkdir -p build; cd build; cmake -DOIFS_COUPLED=ON -DFESOM_COUPLED=ON
                         -DENABLE_OPENMP=ON -DOPENMP_REPRODUCIBLE=OFF -DDISABLE_MULTITHREADING=OFF -DDISABLE_PARALLEL_RESTART_READ=ON ${recom_comp_flag} -DCMAKE_BUILD_TYPE=${build_type} -DDISABLE_MULTITHREADING=OFF
                        ${yac_flag} ${meshpart_flag} -DCMAKE_INSTALL_PREFIX=../  ..;   make install
                        -j `nproc --all`
    choose_general.oasis_with_yac:
        true:
            yac_flag: "-DOASIS_WITH_YAC=ON"
        false:
            yac_flag: ""

    missing_owy: "$(( 'oasis_with_yac' not in config['general'] ))" # TODO: move this to the block above when the missing option is included in choose_ blocks
    choose_missing_owy:
        true:
            error:
                "Missing variable":
                    message: "Please define ``general.oasis_with_yac`` boolean in
                        ``awicm3.yaml``"
                    ask_user_to_continue: false

    tide_forcing_dir: ""
    forcing_data_dir: ""
    # Default: do not build the native mesh partitioner. The -is (ice-sheet)
    # variant overrides this in choose_general.version below so build_submesh
    # can partition submeshes natively (no Singularity/user-namespaces needed).
    meshpart_flag: ""
    model_dir: ${general.model_dir}/${fesom.destination}
    setup_dir: ${general.model_dir}

    pool_dir: "${general.pool_dir}/fesom2/"
    climate_data_dir: "${pool_dir}/hydrography/"

    restart_unit: "d"
    leapyear: true
    tar_binary_restarts: false

    mesh_dir: "${pool_dir}/$(( '${resolution}'.lower() ))/"

    namelist_changes:
        namelist.config:
            restart_log:
                restart_length_unit: "${restart_unit}"
                restart_length: "${restart_rate}"
        namelist.io:
            diag_list:
                ldiag_dMOC: true
                dmoc_call_freq: 3
                dmoc_call_freq_unit: "h"

    choose_general.major_version:
        "v3.4":
            with_xios: true
            add_namelist_changes:
                namelist.config:
                    geometry:
                        metric_factor_zero: True
                    ale_def:
                        which_ale: 'linfs'
                    restart_log:
                        raw_restart_length_unit: "off"
                        bin_restart_length_unit: "off"
                namelist.tra:
                    tracer_phys:
                        surf_relax_s: "0.0"
                namelist.ice:
                    ice_therm:
                        use_meltponds: true

    # aEVP only on the high-resolution DARS2 mesh on v3.4.2 + develop
    # branches — reverses HR sithick drift (Koldunov 2019 JAMES). aEVP is
    # unstable on coarse meshes (e.g. CORE2), so other resolutions keep
    # their per-mesh whichEVP default from fesom-2.7.yaml.
    choose_general.version:
        v3.4.2:
            choose_resolution:
                DARS2: {add_namelist_changes: {namelist.ice: {ice_dyn: {whichevp: 2}}}}
        develop:
            choose_resolution:
                DARS2: {add_namelist_changes: {namelist.ice: {ice_dyn: {whichevp: 2}}}}
        develop-cc:
            choose_resolution:
                DARS2: {add_namelist_changes: {namelist.ice: {ice_dyn: {whichevp: 2}}}}
        # -is (ice-sheet coupled) variant additionally builds the native FESOM
        # mesh partitioner (fesom_meshpart, via -DBUILD_MESHPARTITIONER=ON) so
        # ice2fesom/build_submesh can partition each per-leg submesh WITHOUT the
        # meshtools Singularity container (user namespaces are disabled
        # cluster-wide on levante, which breaks the container).
        develop-is:
            meshpart_flag: "-DBUILD_MESHPARTITIONER=ON"

    # --- PISM<->FESOM dynamic-mesh runtime coupling (version-independent) ------
    # Enabled by general.interactive_mesh (see general section), so it is shared by
    # every awiesm3 version instead of requiring a -is variant. On each leg
    # ice2fesom (couple_in) builds the new submesh + regenerates the OASIS
    # grids/masks/areas/rmp and OIFS ICMGG (via ocp-tool, auto-discovered in
    # couplings/fesom/env_fesom.py); couple_namcouple retags the feom dim;
    # couple_out (fesom2ice) hands FESOM's cavity fluxes back to PISM.
    choose_general.interactive_mesh:
        true:
            regen_oasis_weights: 1
            workflow:
                subjobs:
                    couple_in:
                        nproc: 1
                        run_before: prepcompute
                        script: coupling_ice2fesom_interactive_mesh.functions
                        script_dir: ${general.esm_couplings_dir}/fesom
                        call_function: ice2fesom
                        env_preparation: env_fesom.py
                        run_only: first_run_in_chunk
                        # chunk-1 artifacts derive from PISM's initial geometry and
                        # are pre-staged from the pool; skipping chunk 1 keeps the
                        # heavy regen off the launch path (login-node friendly).
                        skip_chunk_number: 1
                    couple_namcouple:
                        # MUST run every leg incl. chunk 1: prepcompute writes the
                        # namcouple with the static full-mesh feom dim, but FESOM
                        # runs on the submesh -> OASIS aborts writing the feom
                        # restart ("av gsize nx ny mismatch") unless retagged here.
                        nproc: 1
                        run_after: prepcompute
                        script: coupling_ice2fesom_interactive_mesh.functions
                        script_dir: ${general.esm_couplings_dir}/fesom
                        call_function: fix_namcouple_feom_dim
                        env_preparation: env_fesom.py
                        run_only: first_run_in_chunk
                    couple_out:
                        nproc: 1
                        run_after: Rename_XIOS_FESOM
                        script: coupling_fesom2ice.functions
                        script_dir: ${general.esm_couplings_dir}/fesom
                        call_function: fesom2ice
                        env_preparation: env_fesom.py
                        run_only: last_run_in_chunk
                        trigger_next_run: True

        # Remove ICMCL_INIT forcing, which is only required for standalone simulations (form v3.2 onwards contains seasonal leaf area index, veg albedo etc.)
    remove_forcing_files:
        - ICMCL_INIT
    remove_namelist_changes.namelist.config.inout: # Not present in the fesom-bounded namelist but in the fesom-2.0.yaml
        - restart_length
        - restart_length_unit
    remove_namelist_changes.namelist.config.paths:
        - ForcingDataPath
        - OpbndPath
        - TideForcingPath
        # Remove all namelist changes for namelist.forcing defined in fesom-2.0.yaml
    remove_namelist_changes:
        - namelist.forcing


    coupling_freq_in_steps: $((${oasis3mct.coupling_time_step} / ${fesom.time_step}))

    remove_config_files:
        - diag

    atm_oce_fields: [ist_feom, sia_feom]

    coupling_fields:
        "[[atm_oce_fields-->FIELD]]":
            grid: feom


# It is possible for the esm_tools to modify the fesom io namelist, in case you don't want to make your own copy and edit that.
# By default this option is turned off, and thus the follwing two lines are commented out.
# further_reading:
#       - fesom/fesom.io.yaml

lpj_guess:
    version: "4.1.2"
    build_type: Release # Available options: Debug, Release
    #comp_command: "mkdir -p build; cd build; cmake .. -DOASIS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_FLAGS='-g -ggdb -fcheck=all -fbacktrace -fbounds-check -finit-real=snan -ffpe-trap=invalid,zero,overflow' -DCMAKE_C_FLAGS='-g -O0 -fsanitize=address'; make -j8; cd .."
    comp_command: "mkdir -p build; cd build; cmake .. -DOASIS=ON -DCMAKE_BUILD_TYPE=${build_type}; make -j8; cd .."
    execution_command: ${executable} -parallel ${runscript_name}

    daily_output: true

    # Automatically set mygrid to match OIFS resolution
    mygrid: ${oifs.resolution}

    veg_atm_fields: [GUE_LLAI, GUE_HLAI, GUE_FRAL, GUE_FRAH, GUE_TYPH, GUE_TYPL, T2M_LPJG,
        TPRE_LPJ, SNOC_LPJ, SNOD_LPJ, ST1L_LPJ, ST2L_LPJ, ST3L_LPJ, ST4L_LPJ, SM1L_LPJ,
        SM2L_LPJ, SM3L_LPJ, SM4L_LPJ, SWNR_LPJ, LWNR_LPJ, SHUM_LPJ, SPRE_LPJ, WSPD_LPJ,
        TMIN_LPJ, TMAX_LPJ, GUE_CNPP, GUE_CANT, GUE_CNAT, CO2_LPJG]

    coupling_fields:
        "[[veg_atm_fields-->FIELD]]":
            grid: ${lpj_guess.mygrid}-land

    resolution: ${oifs.resolution}
    grids:
        ${resolution}-land:
            name: ${resolution}-land
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4
        lpjg:
            name: lpjg
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4
        TL159-land:
            name: TL159-land
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4
        TL255-land:
            name: TL255-land
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4
        TCO95-land:
            name: TCO95-land
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4
        TCO319-land:
            name: TCO319-land
            nx: "${nx}"
            ny: "${ny}"
            oasis_grid_type: "D"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4


    nproc: 128
    proc_list_entry: '[str(x) for x in range(1,${nproc}+1)]'
    proc_list: $(( ${proc_list_entry} ))

    # run_year: Chunk start year - used for restart file naming
    run_year: ${start_date!syear}
    # initial_year: Experiment start year - for continuous output years in spinup
    initial_year: ${initial_date!syear}
    run_month: 1
    run_day: 1
    runtime_seconds: "$(( ${next_date} - ${start_date} ))"
    ndays_per_run: "$(( ${runtime_seconds} / 86400 ))"
    co2_coupling: 0
    fixed_CO2: -1
    fixed_ndep: -1
    fixed_LU: -1
    nyear_spinup: 1
    freenyears: 0



    config_sources:
        tmp_yaml_file: ${namelist_dir}/lpjg_steps.yaml.j2
        ins_files: ${namelist_dir}/*.ins
        lpjg_output_ins: ${namelist_dir}/lpjg_default_cmip7_output.ins.j2
        "all_ins_[[proc_list-->PROC_NUM]]": ${namelist_dir}/*.ins
        "guess_ins_[[proc_list-->PROC_NUM]]": ${namelist_dir}/guess.ins.j2
        "ecearth_ins_[[proc_list-->PROC_NUM]]": ${namelist_dir}/ecearth.ins.j2
        "globsoil_ins_[[proc_list-->PROC_NUM]]": ${namelist_dir}/global_soiln.ins
        "lpjg_output_ins_[[proc_list-->PROC_NUM]]": ${namelist_dir}/lpjg_default_cmip7_output.ins.j2
        "tmp_yaml_file_[[proc_list-->PROC_NUM]]": ${namelist_dir}/lpjg_steps.yaml.j2

        "mock_[[proc_list-->PROC_NUM]]": ${lpj_guess.input_dir}/dirmaker

    config_in_work:
        tmp_yaml_file: lpjg_steps.yaml
        ins_files: /*.ins
        lpjg_output_ins: lpjg_output.ins
        "all_ins_[[proc_list-->PROC_NUM]]": runPROC_NUM/*.ins
        "guess_ins_[[proc_list-->PROC_NUM]]": runPROC_NUM/guess.ins
        "ecearth_ins_[[proc_list-->PROC_NUM]]": runPROC_NUM/ecearth.ins
        "globsoil_ins_[[proc_list-->PROC_NUM]]": runPROC_NUM/global_soiln.ins
        "lpjg_output_ins_[[proc_list-->PROC_NUM]]": runPROC_NUM/lpjg_output.ins
        "tmp_yaml_file_[[proc_list-->PROC_NUM]]": runPROC_NUM/lpjg_steps.yaml

        "mock_[[proc_list-->PROC_NUM]]": runPROC_NUM/output/stdo_stde.log


    forcing_files:
        soil_layer_type: soil_layer_type
        CO2: CO2

    forcing_sources:
        soil_layer_type: ${lpj_guess.slt_dir}/slt_${lpj_guess.resolution}_${fesom.resolution}.nc
        CO2: ${lpj_guess.co2_source_file}
        "soil_layer_type_[[proc_list-->PROC_NUM]]": ${lpj_guess.slt_dir}/slt_${lpj_guess.resolution}_${fesom.resolution}.nc
        "CO2_[[proc_list-->PROC_NUM]]": ${lpj_guess.co2_source_file}

    forcing_in_work:
        # Work directory files use old naming (slt_ATMO.nc) that LPJ-GUESS binary expects
        soil_layer_type: slt_${mygrid}.nc
        CO2: ${lpj_guess.co2_work_file}
        "soil_layer_type_[[proc_list-->PROC_NUM]]": runPROC_NUM/slt_${mygrid}.nc
        "CO2_[[proc_list-->PROC_NUM]]": runPROC_NUM/${lpj_guess.co2_work_file}

    # Create empty folders for landuse and fire in work
    create_folders:
        - ${work_dir}/landuse
        - ${work_dir}/fire

    choose_general.run_number:
        1:
            input_sources:
                vegin: ${oasis3mct.input_dir}/vegin.nc
                "VegInit_[[proc_list-->PROC_NUM]]": ${oasis3mct.input_dir}/vegin.nc
            input_in_work:
                vegin: vegin.nc
                "VegInit_[[proc_list-->PROC_NUM]]": runPROC_NUM/vegin.nc
            choose_general.with_co2_veg_coupling:
                true:
                    add_input_sources:
                        rst_co2_av: ${oasis3mct.input_dir}/rst_co2_av.nc
                        "rst_co2_avInit_[[proc_list-->PROC_NUM]]": ${oasis3mct.input_dir}/rst_co2_av.nc
                    add_in_work:
                        rst_co2_av: rst_co2_av.nc
                        "rst_co2_avInit_[[proc_list-->PROC_NUM]]": runPROC_NUM/rst_co2_av.nc

    choose_general.with_co2_veg_coupling:
        true:
            co2_coupling: 1


xios:
    xml_dir: "${general.esm_namelist_dir}/oifs/${oifs.version}/xios/"
    interpolation_order: 1
    compression_level: 1
    # 0.5deg default for FESOM regridded surface + 3D output. Validated in
    # HR Test_21 vs 1deg Test_20: +0.4% wall time, +8 GB/year disk for the
    # full 2D+3D set. Override per-experiment if a coarser grid is wanted.
    fesom_regular_res_lon: 720
    fesom_regular_res_lat: 360
    read_weight: false
    truncation: "${oifs.truncation}"
    choose_truncation:
        TCO:
            regular_res_lat: "$(( (${oifs.res_number}+1)*2 ))"     #For TCO95->192
            regular_res_lon: "$(( (${oifs.res_number})*4+20 ))"    #For TCO95->400
        TL:
            regular_res_lat: "$(( (${oifs.res_number}+1)*2 ))"
            regular_res_lon: "$(( (${oifs.res_number}+1)*4 ))"
    cmip7_cmor_output: "${oifs.cmip7_cmor_output}"
    choose_cmip7_cmor_output:
        True:
            config_sources:
                context_ifs: ${xml_dir}/context_ifs.xml.j2
                domain_def: ${xml_dir}/domain_def.xml.j2
                file_def: ${xml_dir}/cmip7/file_def_oifs_cmip7_spinup.xml.j2
                field_def: ${xml_dir}/cmip7/field_def_cmip7.xml.j2
                axis_def: ${xml_dir}/cmip7/axis_def.xml
                grid_def: ${xml_dir}/cmip7/grid_def.xml
        "*":
            config_sources:
                context_ifs: ${xml_dir}/context_ifs.xml.j2
                domain_def: ${xml_dir}/domain_def.xml.j2
                file_def: ${xml_dir}/file_def.xml.j2
    add_config_files:
        context_ifs: context_ifs
        ifs_xml: ifs_xml
        domain_def: domain_def
        field_def: field_def
        file_def: file_def
        axis_def: axis_def
        grid_def: grid_def

    nproc: 1
    omp_num_threads: ${computer.partitions.compute.cores_per_node}
    choose_fesom.with_xios:
        true:
            nproc: "$(( ${computer.partitions.compute.cores_per_node} / 8 ))"
            omp_num_threads: 8
        false:
            nproc: 1

rnfmap:
    pool_dir: ${general.pool_dir}
    runoff_maps_name: _${fesom.resolution}
    version: v1.1

    nproc: 1
    omp_num_threads: ${computer.partitions.compute.cores_per_node}
    time_step: ${oasis3mct.coupling_time_step}

    runoff_method: awicm3-default

    coupling_fields:
        "[[runoff_fields_send-->FIELD]]":
            grid: rnfo

    grids:
        rnfa:
            name: RnfA
            nx: 512
            ny: 256
            oasis_grid_type: "LR"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4

        rnfo:
            name: RnfO
            nx: 512
            ny: 256
            oasis_grid_type: "LR"
            oyac_grid_type: "LL"
            oyac_io_per_node: 4

    input_files:
        runoff_maps: runoff_maps


#########################################################################################

# Settings for OASIS
oasis3mct:
    model_dir: ${general.model_dir}/oasis
    pool_dir: ${general.pool_dir}/oasis/
    norestart: "T"

    process_ordering: #look into it.....
        - fesom
        - oifs
        - lpj_guess
        - rnfmap

    required_plugins:
        - "git+https://github.com/esm-tools-plugins/oasis_rmp_rst_to_input"

        # lresume needs to be true to allow usage of flxatmos and sstocean
        # "restart" files in initial coupling time step
        # but only if the general model setup is a cold start (i.e. general.lresume = false)
    lresume: true
    ini_parent_date: "20590101"     # not used, but needs to be present
    ini_parent_exp_id: "khw0030"     # not used, but needs to be present
    ini_restart_dir: "${input_dir}"

    output_exchanged_vars: false

    time_step: 7200     #separate timestep needed for atmosphere-ocean in the future LASZLO

    a2o_lag: "${lag}"
    a2v_lag: "${oifs.time_step}"
    a2r_lag: "${lag}"
    o2a_lag: "${lag}"
    o2r_lag: 0
    r2a_lag: "${lag}"
    v2a_lag: "${lpj_guess.time_step}"
    a2o_seq: 2
    o2a_seq: 2
    o2r_seq: 1
    r2a_seq: 2
    a2v_seq: 2
    v2a_seq: 2

    coupling_time_step: "${oasis3mct.time_step}"
    choose_general.major_version:
        'v3.4':
            add_process_ordering:
                - xios
            coupling_target_fields:
                rstas.nc:
                    - 'heat_oce:heat_swo <--gauswgt_c-- A_Qns_oce:A_Qs_all'
                    - 'prec_oce:snow_oce:evap_oce:subl_oce <--gauswgt_c-- A_Precip_liquid:A_Precip_solid:A_Evap:A_Subl'
                    - 'heat_ico <--gauswgt_gsmart-- A_Q_ice'
                    - 'taux_oce:tauy_oce:taux_ico:tauy_ico <--bicubic-- A_TauX_oce:A_TauY_oce:A_TauX_ice:A_TauY_ice'
                    - 'u10w_oce:v10w_oce <--bicubic-- A_WindX:A_WindY'
                    - 'R_Runoff_atm:R_Calving_atm <--gauswgt_c-- A_Runoff:A_Calving'
                    - 'hydr_oce:calv_oce <--gauswgt_c-- R_Runoff_oce:R_Calving_oce'
                rstos.nc:
                    - 'A_SST:A_Ice_frac:A_Snow_thickness:A_Ice_temp:A_Ice_albedo <--gauswgt_i--
                      sst_feom:sie_feom:snt_feom:ist_feom:sia_feom'
                    - 'A_CurX:A_CurY <--gauswgt_i-- u_feom:v_feom'
                vegin.nc:
                    # BUG FIX (2025-03-16): GUE_TYPH and GUE_FRAL were swapped, causing IFS to receive? Investigate further and check if this has any impact on the results. The old (wrong) configuration is included here for reference.
                    # TypeHigh (int, e.g. 6) as FracLow (CVL), clamped to 1.0 → wrong albedo over deserts? 
                    # Old: GUE_LLAI:GUE_HLAI:GUE_TYPH:GUE_FRAH:GUE_TYPL:GUE_FRAL
                    - 'LAILVeg:LAIHVeg:FracLVeg:FracHVeg:TypeLVeg:TypeHVeg <--loctrans_avg--
                      GUE_LLAI:GUE_HLAI:GUE_FRAL:GUE_FRAH:GUE_TYPL:GUE_TYPH'
                    - 'T2M_LPJG:TPRE_LPJ:SNOC_LPJ:SNOD_LPJ <--loctrans_avg-- T2MVeg:TPVeg:SDVeg:SDensVeg'
                    - 'ST1L_LPJ:ST2L_LPJ:ST3L_LPJ:ST4L_LPJ <--loctrans_avg-- SoilTVeg.L001:SoilTVeg.L002:SoilTVeg.L003:SoilTVeg.L004'
                    - 'SM1L_LPJ:SM2L_LPJ:SM3L_LPJ:SM4L_LPJ <--loctrans_avg-- SoilMVeg.L001:SoilMVeg.L002:SoilMVeg.L003:SoilMVeg.L004'
                    - 'SWNR_LPJ:LWNR_LPJ:SHUM_LPJ:SPRE_LPJ:WSPD_LPJ <--loctrans_avg--
                      SSRVeg:SLRVeg:SHUMVeg:PRESVeg:WSPDVeg'
                    - 'TMIN_LPJ <--loctrans_min-- TMINVeg'
                    - 'TMAX_LPJ <--loctrans_max-- TMAXVeg'
            choose_general.with_co2_veg_coupling:
                true:
                    add_coupling_target_fields:
                        rst_co2_av.nc:
                            - 'CO2_LPJG <--loctrans_avg-- XCO2Veg'
                            - 'FCO2NAT:FCO2ANT:FCO2NPP <--loctrans_avg-- GUE_CNAT:GUE_CANT:GUE_CNPP'
                    add_merge_recv_restarts:
                        - rst_co2_av.nc    # CO2 vegetation coupling (bidirectional LOCTRANS)
            choose_general.with_co2_oce_coupling:
                true:
                    add_coupling_target_fields:
                        rst_co2_ao.nc:
                            - 'XCO2_oce <--gauswgt_i-- A_XCO2_oce'
                            - 'A_FCO2_oce <--gauswgt_gss-- FCO2_feom'

            # Specify which restart files need bidirectional merging
            # Use this for restart files with LOCTRANS+EXPOUT in both directions
            # where both send and receive use the same restart file name in namcouple
            merge_recv_restarts:
                - vegin.nc         # OpenIFS <-> lpjg bidirectional LOCTRANS

            mct_version: "5.0"
            input_dir: ${oasis3mct.pool_dir}/cy${oifs.version}/${oifs.resolution}-${fesom.resolution}/
            rstos_file_name: 'rstos'
            rstas_file_name: 'rstas'
            vegin_file_name: 'vegin'
            rst_co2_ao_name: 'rst_co2_ao'
            rst_co2_av_name: 'rst_co2_av'

    land_atmo_coupling_time_step: 86400
    coupling_directions:
        'atma->feom':
            lag: ${a2o_lag}
            seq: ${a2o_seq}
        'atmr->rnfa':
            lag: ${r2a_lag}
            seq: ${r2a_seq}
        'rnfo->feom':
            lag: ${o2r_lag}
            seq: ${o2r_seq}
        'feom->atma':
            lag: ${o2a_lag}
            seq: ${o2a_seq}
        '${lpj_guess.mygrid}-land->atma':
            lag: ${v2a_lag}
            seq: ${v2a_seq}
            coupling_time_step: ${land_atmo_coupling_time_step}
            lag_overwrite: true
        'atma->${lpj_guess.mygrid}-land':
            lag: ${a2v_lag}
            seq: ${a2v_seq}
            coupling_time_step: ${land_atmo_coupling_time_step}
            lag_overwrite: true


    coupling_methods:
        bicubic:
            time_transformation: average
            remapping:
                bicubic:
                    search_bin: latitude
                    nb_of_search_bins: 15

        bicubic_glb:
            time_transformation: average
            remapping:
                bicubic:
                    search_bin: latitude
                    nb_of_search_bins: 15
            postprocessing:
                conserv:
                    method: glbpos
                    algorithm: opt
        bicubic_gss:
            time_transformation: average
            remapping:
                bicubic:
                    search_bin: latitude
                    nb_of_search_bins: 15
            postprocessing:
                conserv:
                    method: gsspos
                    algorithm: opt
        gauswgt_c:
            time_transformation: conserv
            remapping:
                gauswgt:
                    search_bin: latitude
                    nb_of_search_bins: 1
                    nb_of_neighbours: 25
                    weight: "0.1"
            postprocessing:
                conserv:
                    method: glbpos
                    algorithm: opt
        gauswgt_gss:
            time_transformation: conserv
            remapping:
                gauswgt:
                    search_bin: latitude
                    nb_of_search_bins: 1
                    nb_of_neighbours: 25
                    weight: "0.1"
            postprocessing:
                conserv:
                    method: gsspos
                    algorithm: opt
        # GSSPOS blows up when the summed target residual is ~0 while the source
        # residual is small but non-zero (OASIS aborts: "gsspos sumdst is zero but
        # sumsrc is not"). GSMART is robust to that degenerate sum.
        gauswgt_gsmart:
            time_transformation: conserv
            remapping:
                gauswgt:
                    search_bin: latitude
                    nb_of_search_bins: 1
                    nb_of_neighbours: 25
                    weight: "0.1"
            postprocessing:
                conserv:
                    method: gsmart
                    algorithm: opt
        gauswgt_i:
            time_transformation: instant
            remapping:
                gauswgt:
                    search_bin: latitude
                    nb_of_search_bins: 1
                    nb_of_neighbours: 25
                    weight: "0.1"
        gauswgt_glo:
            time_transformation: conserv
            remapping:
                gauswgt:
                    search_bin: latitude
                    nb_of_search_bins: 1
                    nb_of_neighbours: 25
                    weight: "0.1"
            postprocessing:
                conserv:
                    method: global
        loctrans_avg:
            time_transformation: average
            remapping:
                loctrans:
        loctrans_min:
            time_transformation: t_min
            remapping:
                loctrans:
        loctrans_max:
            time_transformation: t_max
            remapping:
                loctrans:
        oyac_1stcon_nnn_stocha:
            oyac: true
            time_transformation: stocha
            remapping:
                conserv:
                    order: first
                    intersect_norm: fracarea
                nnn:
                    weighting: avg
                    nb_of_neighbours: 1
        oyac_1stcon_nnn_i:
            oyac: true
            time_transformation: instant
            remapping:
                conserv:
                    order: first
                    intersect_norm: fracarea
                nnn:
                    weighting: avg
                    nb_of_neighbours: 1
        oyac_gauswgt_c:
            oyac: true
            time_transformation: conserv
            remapping:
                nnn:
                    weighting: gauss
                    nb_of_neighbours: 9
        oyac_avg_c:
            oyac: true
            time_transformation: conserv
            remapping:
                nnn:
                    weighting: avg
                    nb_of_neighbours: 9
        oyac_gauswgt_i:
            oyac: true
            time_transformation: instant
            remapping:
                nnn:
                    weighting: gauss
                    nb_of_neighbours: 9
        oyac_hcsbb_nnn_i:
            oyac: true
            time_transformation: instant
            remapping:
                hcsbb:
                    lorem: ipsum
                nnn:
                    weighting: avg
                    nb_of_neighbours: 1
        oyac_spmap_nnn_i:
            oyac: true
            time_transformation: instant
            remapping:
                spmap:
                    weighting: dist
                    spread_dist: 3
                nnn:
                    weighting: avg
                    nb_of_neighbours: 1


    input_files: {}

    input_sources:
        rmp: ${input_dir}/${fesom.nproc}/rmp_*.nc
        areas: ${input_dir}/areas.nc
        masks: ${input_dir}/masks.nc
        grids: ${input_dir}/grids.nc

    input_in_work:
        rmp: rmp_*.nc
        areas: areas.nc
        masks: masks.nc
        grids: grids.nc

    restart_in_files:
        rmp: rmp
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    restart_in_in_work:
        rmp: rmp_*.nc
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    restart_in_sources:
        rmp: rmp_*.nc
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    restart_out_files:
        rmp: rmp
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    restart_out_in_work:
        rmp: rmp_*.nc
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    restart_out_sources:
        rmp: rmp_*.nc
        rstas.nc: rstas.nc
        rstos.nc: rstos.nc
        vegin.nc: vegin.nc

    choose_general.with_co2_veg_coupling:
        true:
            add_restart_in_files:
                rst_co2_av.nc: rst_co2_av.nc
            add_restart_in_in_work:
                rst_co2_av.nc: rst_co2_av.nc
            add_restart_out_files:
                rst_co2_av.nc: rst_co2_av.nc
            add_restart_out_in_work:
                rst_co2_av.nc: rst_co2_av.nc
            add_restart_out_sources:
                rst_co2_av.nc: rst_co2_av.nc
    choose_general.with_co2_oce_coupling:
        true:
            add_restart_in_files:
                rst_co2_ao.nc: rst_co2_ao.nc
            add_restart_in_in_work:
                rst_co2_ao.nc: rst_co2_ao.nc
            add_restart_out_files:
                rst_co2_ao.nc: rst_co2_ao.nc
            add_restart_out_in_work:
                rst_co2_ao.nc: rst_co2_ao.nc
            add_restart_out_sources:
                rst_co2_ao.nc: rst_co2_ao.nc

    remove_config_files:
        - cf

    choose_lresume:
        false:
            lag: 0
            choose_general.run_number:
                1:
                    add_input_files:
                        rmp: rmp
                        areas: areas
                        masks: masks
                        grids: grids
        true:
            lag: "${time_step}"
            # If ini_restart_dir is not specified in the runscript and, therefore,
            # it is not a branched off experiment adds the /fesom.nproc/ to the
            # sources when the run_number is 1
            load_restart_from_pool: "$(( os.path.realpath('${input_dir}') == os.path.realpath('${ini_restart_dir}')
                and ${general.run_number} == 1 ))"
            choose_load_restart_from_pool:
                true:
                    add_restart_in_sources:
                        rmp: ${input_dir}/${fesom.nproc}/rmp_*.nc
                        rstas.nc: ${input_dir}/${fesom.nproc}/${rstas_file_name}.nc
                        rstos.nc: ${input_dir}/${fesom.nproc}/${rstos_file_name}.nc
                    choose_general.with_co2_oce_coupling:
                        true:
                            add_restart_in_sources:
                                rst_co2_ao.nc: ${input_dir}/${rst_co2_ao_name}.nc

computer:
    # Activates the taskset approach for heterogeneous parallelization, by default
    # since hetjob approach doesn't seem to work (second run showing mpi/pmix
    # problems)
    taskset: true
    merge_component_envs:
        compile: true

    choose_general.major_version:
        v3.4:
            choose_name:
                juwels:
                    iolibraries: system_libs
                    compiler_mpi: gnu2023_ompi2023
                levante:
                    iolibraries: system_intel_libs
                    compiler_mpi: intel2022_openmpi
        '*':
            foo: bar
