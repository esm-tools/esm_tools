general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: "clidyn.clidyn"
    # Spinup, chained (esm_tools re-reads this file each leg):
    #   phase 1: 1900-01 at 300 s (coldstart, run 1, 1-month leg -- already launched)
    #   phase 2: 1900-02 .. 1901-01 at 1200 s, 3-month legs  <-- ACTIVE
    #   phase 3: 1901-01 .. 1902-01 at 1800 s (bump time_step 1800 + final_date 1902-01-01)
    # Spinup, one phase at a time (edit + resubmit this experiment between phases).
    # oasis lresume=false is very slow (re-does the coupling restart/weights every leg),
    # so do it once for a SHORT bootstrap, then oasis lresume=true for the rest:
    #   phase 0: 1900-01-01..02   @ 300 s,  oasis lresume=false (coldstart)   DONE (job 47087657)
    #   phase 1: ..1900-02-01      @ 300 s,  oasis lresume=true  (1 month)    DONE (job 47087708)
    #   phase 2: ..1901-01-01      @ 1200 s, oasis lresume=true  (11 months)  DONE (job 47088745)
    #   phase 3: ..1902-01-01      @ 1800 s, oasis lresume=true  (1 year)     <-- ACTIVE
    compute_time: "08:00:00"
    initial_date: "1900-01-01"
    final_date: "1902-01-01"
    base_dir: "/albedo/work/user/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 0
    nmonth: 0
    nyear: 1
    use_venv: False

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/albedo/work/user/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE3"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    # Cold start: the pooled CORE3 restart (fesom.2000.*) is for the old 211567-node
    # mesh and is dimension-incompatible with the new 220509-node mesh, so start from
    # hydrography instead of a restart. Cold start needs a short step (300 s) for
    # stability; run a month on the 1792 partition so it doesn't take forever.
    lresume: false          # coldstart (only applies to run 1; continuations force true)
    time_step: 1800
    nproc: 1792
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.config:
            ale_def:
                which_ale: 'linfs'
            run_config:
                use_cavity: true
            restart_log:
                raw_restart_length_unit: "off"
                bin_restart_length_unit: "off"

rnfmap:
    # The rnfmap checkout is the ismm-freshwater branch (EC-Earth4 runoff mapper),
    # which reads a second namelist group &NAMRNFMAPARRAYS and NumCoupledRegions.
    # The coupling pins rnfmap-v1.1, whose template has only &NAMRNFMAP -> the
    # binary hits end-of-file (forrtl severe 24) reading NAMRNFMAPARRAYS. Use the
    # 1.4-ismm template (both groups, NumCoupledRegions=0) to match the binary.
    config_sources:
        namelist.runoffmapper: "${namelist_dir}/1.4-ismm/namelist.runoffmapper"

lpj_guess:
    nproc: 64
    omp_num_threads: 4
    lresume: false
    mip: "cmip7"
    fixed_landuse_year: 1850
    firemodel: NOFIRE
    output_mode: collect_txt
    # Temporary (new-mesh land inputs not regenerated yet): every mesh-specific land
    # input (peat map, LUH3 states, text land-use lu_luh2.txt) is keyed to the old
    # CORE3 LSM and fails on the new-mesh land cells. For the smoke test, run natural
    # vegetation only: run_landcover=0 needs no land-use data at all (and moots LUH3).
    # run_peatland=0 skips the peat lookup.
    run_peatland: 0
    run_landcover: 0
    use_luh3_input: 0

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 256
    omp_num_threads: 1
    mpi: cmip7 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                LCMIP6: False
                LCMIP7: True
                CMIP7DATADIR: '${input_dir}/cmip7-data/'
                NCMIPFIXYR: 1850
                SCENARIONAME: 'SSP2-4.5'
                LMACV2SP: True
                LMACV2SP_CCNF: True
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
                NO3CMIP: 7
                CO3DATADIR: '${input_dir}/cmip7-data/'
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8

oasis3mct:
    use_lucia: false # ~5-10% faster
    lresume: true # phases 1-3: read the OASIS rst/weights laid down by the bootstrap (phase 0)
    time_step: 3600
    norestart: T #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
