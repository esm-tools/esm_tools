# Setup up compile and run environment i.e. what needs
# to be changed w.r.t the default config/machines/<computer>.yaml

computer:
    choose_computer.name:
        levante:
            compiler_mpi: gnu11_ompi4
            iolibraries: system_gnu_libs
            add_export_vars:
                DATA: "${general.work_dir}"
                LD_LIBRARY_PATH[(3)]: '$LD_LIBRARY_PATH:${thisrun_work_dir}/lib/oifs/'
                GRIB_SAMPLES_PATH: '${oifs.model_dir}/build/share/eccodes/ifs_samples/grib1_mlgrib2'
                OIFS_LOGFILE: '${oifs.model_dir}/build/oifs_test_log.txt'
                DR_HOOK_IGNORE_SIGNALS: '-1'
                OIFS_DATA_DIR: "/p/project/chhb19/streffing1/input/oifs-48r1/"
                MKL_CBWR: AUTO,STRICT

        juwels:
            compiler_mpi: intel2025_psmpi
            iolibraries: system_libs
            add_export_vars:
                MKL_CBWR: AUTO,STRICT
                DATA: "${general.work_dir}"
                LD_LIBRARY_PATH[(3)]: '$LD_LIBRARY_PATH:${thisrun_work_dir}/lib/oifs/'
                GRIB_SAMPLES_PATH: '${oifs.model_dir}/build/share/eccodes/ifs_samples/grib1_mlgrib2'
                OIFS_LOGFILE: '${oifs.model_dir}/build/oifs_test_log.txt'
                DR_HOOK_IGNORE_SIGNALS: '-1'

        '*':
            add_export_vars:
                MKL_CBWR: AUTO,STRICT
                DATA: "${general.work_dir}"
                LD_LIBRARY_PATH[(3)]: '$LD_LIBRARY_PATH:${thisrun_work_dir}/lib/oifs/'
                GRIB_SAMPLES_PATH: '${oifs.model_dir}/build/share/eccodes/ifs_samples/grib1_mlgrib2'
                OIFS_LOGFILE: '${oifs.model_dir}/build/oifs_test_log.txt'
                DR_HOOK_IGNORE_SIGNALS: '-1'


