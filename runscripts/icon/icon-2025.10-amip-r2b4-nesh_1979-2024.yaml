# Standalone ICON (2025.10-public) AMIP runscript, R02B04 (grid 0012), nesh,
# 1979-01-01 to 2024-12-31, experiment icon-r2b4-amip-01: the R2B4 counterpart of
# icon-amip-01 (icon-2025.10-amip-r2b5-nesh_1979-2024.yaml): same forcing (cmip7hist,
# CMIP7 ScenarioMIP m after the historical period) and the same SST/sea ice (HadISST1.1
# with the GEOMAR mid-month adjustment, r0002, remapped to R2B4 from the 1x1 data),
# but amip_surface core2 (CORE2 extpar + JSBACH files of 0012-CORE2/land/r00xx, as the
# R2B4 ICON-FESOM runs) and the physics of the R2B4 ICON-FESOM configuration:
# namelists/icon/2025.10-public/R02B04/amip = ../R02B04 (90 levels, VDIFF and
# JSBACH settings of the R2B4 templates) + the CERESMIP output streams of
# R02B05/amip + isolrad = 2 (transient solar irradiance; not set in the R2B4 templates)
# + npft = 12 in NAMELIST_lnd (the r00xx land-use files have 12 PFTs; the R2B4 templates
# have 11). Tuning (below): tune_entrorg 0.0021, tune_box_liq_asy 3.35 as the R2B4
# ICON-FESOM production runs (icon-amip-01: 1.95e-3 / 3.0).
#
# Before the first run:
#   - input data (0012, see ceresmip/CLAUDE.md): SST/sea ice in 0012_geomar/sst_and_seaice/r0002,
#     IFS initial state for 1979-01-01, ScenarioMIP m ozone for 2023-2025
#   - run icon-2025.10-amip-r2b4-nesh.yaml (2 x 5 days) first: setup check and time per model day
#
# Run length: 2 runs of 23 years (1979-2001, 2002-2024), final_date 2025-01-01. Untested
#   estimate: ~1.2 h per model year on 8 nodes (R2B5: 2.27 h on 24 nodes; R2B4 has 1/4 of
#   the cells and 90 instead of 130 levels), i.e. ~28 h per run (48 h limit). Check the
#   time per model day of the 10-day test and of the first hour of the first run.
# Restart files: every year (checkpoint_interval, ~1 GB each), the run stops after
#   runlength (restart_interval). Only the restart at the end of a run is copied to restart/icon.
# Disk: ~25 GB per year of daily 3d model-level output before the interpolation job
#   deletes it (interp_to_plev_ml_files: remove).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "48:00:00"

   initial_date: "1979-01-01T00:00:00"       # Initial exp. date
   final_date: "2025-01-01T00:00:00"         # Final date of the experiment
   # set length and unit of each run, both are used to set the ESM-Tools run
   # length and the ICON restart_interval (end of the run)
   runlength: 23
   unit: 'y' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 23
         unitUpper: 'D'
      'm':
         nmonth: 23
         unitUpper: 'M'
      'y':
         nyear: 23
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B04
   grid_id: '0012'

   amip: True
   # extpar, JSBACH land files and sea-ice snow albedo (see amip_surface in icon.yaml):
   # core2 = CORE2 extpar + 0012-CORE2/land/r00xx JSBACH files (as the R2B4 ICON-FESOM runs)
   amip_surface: core2
   sstice: hadisst1p1
   scenario: 'cmip7hist'
   cmip7_scenario: m
   # ScenarioMIP ozone (2023-2025) for grid 0012, made by GEOMAR (not in the ICON-XPP pool)
   ozone_scenario_dir: ${input_dir}/0012_geomar/ozone/CMIP7/ScenarioMIP/${cmip7_scenario}/${cmip7_scenario}-1-0

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job). The daily
   # model-level files are deleted (140 GB per year) once the pressure-level file
   # passed its check, the monthly ones are moved to outdata/icon/3d_ml (needed for aec)
   interp_to_plev: True
   interp_to_plev_ml_files: remove

   # 8 nodes, as the atmosphere of the R2B4 ICON-FESOM runs on nesh
   nproc: 256
   omp_num_threads: 1
   dtime: 450

   # restart files every year (checkpoint_interval), the run stops after runlength
   # (restart_interval). Output intervals are set per stream in the amip NAMELIST_atm
   checkpoint_interval: P01Y
   restart_interval: P${general.runlength}${general.unitUpper}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 2
         output_nml:
            # yearly files, as in icon-fesom-pictl-r2b5-core2-levante_multiyear_geomar.yaml
            # (f90nml applies this to all output_nml groups)
            file_interval: "P01YT1S"
         # tuning of the R2B4 ICON-FESOM production runs (icon-2025.10-fesom-pictl-r2b4-core2_nesh_multiyear.yaml;
         # the R02B04 templates and icon-amip-01 use 1.95e-3 / 3.0, IF-SW028 0.003 / 3.6)
         nwp_tuning_nml:
            tune_entrorg: 0.0021
            tune_box_liq_asy: 3.35
