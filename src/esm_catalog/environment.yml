# Conda environment for ESM-Catalog STAC API
name: api
channels:
  - conda-forge
dependencies:
  - python=3.11
  - duckdb>=1.0
  - pydantic>=2.0
  - fastapi>=0.110
  - uvicorn>=0.29
  - httpx>=0.27
  - loguru>=0.7
  - f90nml>=1.5
  - netcdf4>=1.6
  - h5netcdf>=1.3
  - xarray>=2024.1
  - fsspec>=2024.1
  - universal_pathlib>=0.2
  - pyarrow>=15.0
  - curl  # for healthcheck
  - pip
  - pip:
    - stac-fastapi-api>=3.0
    - stac-fastapi-types>=3.0
