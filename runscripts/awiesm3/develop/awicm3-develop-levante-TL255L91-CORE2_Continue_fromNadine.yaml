general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: bb1469
    compute_time: "02:00:00"
    #initial_date: "1900-01-01"
    #branch off from previous Spinup run
    initial_date: "2026-01-01"
    final_date: "2400-01-31"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/" 
    nday: 0
    nmonth: 1
    nyear: 0
    ini_parent_exp_id: "AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test"
    ini_restart_dir: "/work/bb1469/a270270/runtime/awiesm3-v3.4/AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test/restart"
    parallel_file_movements: 'threads'

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: true
    tar_binary_restarts: true
    time_step: 1800
    nproc: 1152
    omp_num_threads: 1

    # branchoff
    ini_parent_exp_id: "${general.ini_parent_exp_id}"
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "${general.ini_restart_dir}/fesom"
    
    choose_general.run_number:
        1:
            #lasttime: # only need if fesom timestep changed to previous run
                #85950
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2025.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2025.ice.restart/*.nc

lpj_guess:
    ini_pseudo_initial_date: "${prev_run.general.start_date}"
    ini_parent_exp_id: "${general.ini_parent_exp_id}"
    ini_restart_dir: "${general.ini_restart_dir}/lpj_guess/"
    ini_parent_date: "${prev_date}"
    prev_run_config_file: "/work/bb1469/a270270/runtime/awiesm3-v3.4/AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test/config/AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test_finished_config.yaml_20250101-20251231"
    lresume: true
    nproc: 8 # originally 16
    omp_num_threads: 8


oifs:
    resolution: "TL255"
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: true
    prev_run_config_file: "/work/bb1469/a270270/runtime/awiesm3-v3.4/AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test/config/AWIESM3_NTest289_Spinup_AND_ECO_Incosistency_Test_finished_config.yaml"
    ini_pseudo_initial_date: "${prev_run.general.start_date}"
    ini_parent_exp_id: "${general.ini_parent_exp_id}"
    ini_restart_dir: "${general.ini_restart_dir}/oifs/"
    ini_parent_date: "${prev_date}"
    time_step: 2400
    nproc: 512
    omp_num_threads: 8
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850

oasis3mct:
    lresume: true # Set to false to generate the rst files for first leg
    use_lucia: False
    time_step: 7200
    norestart: false #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32

