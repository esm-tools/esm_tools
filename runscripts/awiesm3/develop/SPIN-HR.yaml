computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "DARS2"
    restart_rate: 2
    restart_unit: 'y'
    restart_first: 2
    lresume: true
    time_step: 400
    nproc: 5120 #originally 512 but worked with 1152
    omp_num_threads: 2 # originally 4 but worked with 1
    tar_binary_restarts: false
    namelist_dir: "/work/bb1469/a270089/input/newfesom1/"
    branchoff: true

    # branchoff
    ini_parent_date: "${prev_date}"
    ini_restart_dir: "${general.ini_restart_dir}/fesom"

    choose_general.run_number:
        0:
            lasttime:
                86100                            #86340,86310,86280,86160,86100,86220,86000
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1862.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1862.ice.restart/*.nc
        1:
            lasttime:
                86100                            #86340,86310,86280,86160,86100,86220,86000
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1862.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1862.ice.restart/*.nc
    add_namelist_changes:
        namelist.config:
            restart_log:
                raw_restart_length_unit: "off"
                bin_restart_length_unit: "off"

lpj_guess:
    # Branchoff:
    lresume: true
    ini_parent_exp_id: "lpj_spinup_HR_2000y"
    ini_parent_date: "1349-12-31"
    ini_restart_dir: "/work/bb1469/a270092/runtime/lpjg-spinup-develop/lpj_spinup_HR_2000y/restart/lpj_guess/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3350/*
            restart_out_in_work:
                state: /${work_dir}/lpjg_state_$(date -u -d "${initial_date}" +%Y)/*

    #Config:
    nproc: 64 # originally 16
    omp_num_threads: 4
    resolution: "TCO319"
    mygrid: ${resolution}
    mip: cmip7
    use_luh3_input: 1  # Explicitly enable LUH3 NetCDF input
    luh3_input_dir: /work/ab0246/a270092/input/lpj-guess/land_use/regridded/
    fixed_landuse_year: 1850 
    run_landcover: 1
    run_natural: 1
    run_crop: 1
    run_pasture: 1
    run_barren: 0  # Disabled for LUH3 - calculated as residual internally
    run_urban: 1
    run_peatland: 1  # Disabled for LUH3

oifs:
    ifsdata_dir: "/work/bb1469/a270089/ifsdata/"
    resolution: "TCO319"
    levels: "L137"
    prepifs_expid: abns
    input_expid: awi3
    wam: true
    lresume: false
    #prepifs_dir: "/work/bb1469/a270089/input/oifs-48r1/TCO319L137/"
    time_step: 1200
    nproc: 768
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                LCMIP6: False
                LCMIP7: True
                #CMIP6DATADIR: '/work/bb1469/a270089/input/oifs-48r1/cmip-data/'
                CMIP7DATADIR: '/work/pd1284/AWIESM/oifs-48r1/cmip7-data/'
                NCMIPFIXYR: 1850
                SCENARIONAME: 'SSP2-4.5'
                LMACV2SP: True
                LMACV2SP_CCNF: True
            NAERAD:
                LAER3D: False
                NRADFR: -3
                NDECOLAT: 0
                NO3CMIP: 7
                CO3DATADIR: '/work/pd1284/AWIESM/oifs-48r1/cmip7-data/'
            NAMCLDP:
                RVICE: 0.16
            NAMGWWMS:
                GGAUSSB: -0.5

oasis3mct:
    use_lucia: true #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600
    norestart: true #Should lpj-guess restart from vegin or not?

