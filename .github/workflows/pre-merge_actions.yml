# ESM-Tools pre-merge automation
# ==============================
# In a pull-request, if a comment contains #bump, the following steps are triggered:
#   1. merges `release` into the PR-branch (updates bumpversion values and makes sure whatever we tag in the next step has everything until that version number)
#   2. bumps the version according to `#patch`, `#minor` or `#major` in the comment or, if
#      none is given, to the PR-branch name (`hotfix/`, `fix/` , `feature/` and `feat/` are understood)
#   3. merges PR-branch into `develop`
# Only comments from users with write (or admin) permission in the repository trigger
# these steps.

name: pre-merge automation

# Triggers the workflow on an issue comment
on:
  issue_comment:
    types: [created]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  # To push the merge, the version bump and the tag to the PR-branch
  contents: write
  # To find the PR-branch (``hub pr checkout``)
  pull-requests: read

jobs:
  # This workflow contains a single job called "bump_and_merge2dev"
  bump_and_merge2dev:

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Run this workflow ONLY if the `issue_comment` is in a pull-request and the comment text contains `#bump`
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '#bump') }}

    # Sequence of tasks that will be executed as part of the job
    steps:

      # Stop if the commenter does not have write permission in the repository
      - name: check permission
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          # ``maintain`` is reported as ``write``, ``triage`` as ``read``
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          echo "'$ACTOR' has '$permission' permission";
          case "$permission" in
            admin|write) ;;
            *) echo "::error::Only users with write permission can #bump ('$ACTOR' has '$permission')"; exit 1;;
          esac

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it (`release` branch)
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Installs Hub
      - name: Install hub
        run: |
          git clone --config transfer.fsckobjects=false --config receive.fsckobjects=false --config fetch.fsckobjects=false https://github.com/github/hub.git;
          cd hub;
          make install prefix=~/.local;
          alias hub=$( realpath ./bin/hub );
          cd ..;
          hub --version

      # Set the user to author the git actions of the runner    
      - name: set user
        run: |
          git config --global user.name "${GITHUB_ACTOR}";
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # Checkout PR-branch (I could not find an easier way to do this and it seems
      # many people are struggling with the same problem when your event is triggered
      # by `issue_comment`)
      - name: checkout PR origin branch
        run: |
          PR_URL="${{ github.event.issue.pull_request.url }}";
          PR_NUM=${PR_URL##*/}; echo "$PR_URL and $PR_NUM}"; 
          hub pr checkout $PR_NUM;
          git status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Store the branch name under `steps.vars.output.current_branch` variable,
      # for later use
      - name: Set current_branch var
        id: vars
        run: echo ::set-output name=current_branch::$(git rev-parse --abbrev-ref HEAD)
          
      # Merge release into PR-branch    
      - name: merge release into PR-branch
        run: |
          git status
          git merge release;

      # Install bumpversion (reads the ``[bumpversion]`` section of ``setup.cfg``).
      # Python is pinned because ``bumpversion`` imports ``sre_constants``, which
      # was removed in Python 3.15
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install bumpversion
        run: pip install bump2version

      # Bump the version. The part to bump is, in order of priority:
      #   1. ``#patch``, ``#minor`` or ``#major`` in the ``#bump`` comment (in that
      #      order of priority if more than one is given)
      #   2. the PR-branch name: ``feat/`` or ``feature/`` (minor), anything else,
      #      e.g. ``fix/`` or ``hotfix/`` (patch)
      # Skip if ``HEAD`` is already a version tag (no new commits since the last bump)
      - name: bump
        env:
          COMMENT: ${{ github.event.comment.body }}
          BRANCH: ${{ steps.vars.outputs.current_branch }}
        run: |
          case "$COMMENT" in
            *#patch*) part=patch;;
            *#minor*) part=minor;;
            *#major*) part=major;;
            *)
              case "$BRANCH" in
                *feat/*|*feature/*) part=minor;;
                *) part=patch;;
              esac;;
          esac
          if [ -n "$(git tag --list --points-at HEAD 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "HEAD is already a version tag, skipping"
            exit 0
          fi
          echo "Bumping $part (branch '$BRANCH')"
          bumpversion "$part" --verbose

      # Push
      - name: push changes
        run: |
          git push;
          git push --tags
      - name: Call Publish
        run: |
          # FIXME: Once this works, we need to change the @ to release, or a
          # specific commit
          uses: "esm-tools/esm_tools/.github/workflows/esm_tools_publish@fix/pypi_publish"  
          secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      # Merge PR-branch into `develop`
      # - name: merge into develop
      #   run: |
      #     echo ${{ steps.vars.outputs.current_branch }};
      #     git checkout develop;
      #     git merge ${{ steps.vars.outputs.current_branch }};
      #     git push
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
