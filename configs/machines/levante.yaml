                - "load netcdf-fortran/4.5.3-intel-oneapi-mpi-2021.5.0-intel-2021.5.0"
                - "load git/2.31.1-gcc-11.2.0"
            add_export_vars:
                LD_RUN_PATH: $LD_LIBRARY_PATH
                HDF5ROOT: /sw/spack-levante/hdf5-1.12.1-jmeuy3
                HDF5_C_INCLUDE_DIRECTORIES: $HDF5ROOT/include
                HDF5_ROOT: $HDF5ROOT
                NetCDF_C_ROOT: /sw/spack-levante/netcdf-c-4.8.1-7dq6g2
                NetCDF_Fortran_ROOT: /sw/spack-levante/netcdf-fortran-4.5.3-r5r3ev
                NETCDF_PATH: $NetCDF_C_ROOT
                NETCDF_ROOT: $NetCDF_Fortran_ROOT
                NETCDFROOT: $NetCDF_C_ROOT
                NETCDFFROOT: $NetCDF_Fortran_ROOT
                NETCDF_Fortran_INCLUDE_DIRECTORIES: $NETCDFFROOT/include
                NETCDF_C_INCLUDE_DIRECTORIES: $NETCDFROOT/include
                NETCDF_CXX_INCLUDE_DIRECTORIES: $NETCDFROOT/include
                NETCDF_CXX_LIBRARIES: $NETCDFROOT/lib
                MPI_HOME: /sw/spack-levante/openmpi-4.1.2-yfwe6t
                MPI_ROOT: /sw/spack-levante/openmpi-4.1.2-yfwe6t
                mpi_ROOT: /sw/spack-levante/openmpi-4.1.2-yfwe6t
                MPI_DIR: /sw/spack-levante/openmpi-4.1.2-yfwe6t
                mpi_DIR: /sw/spack-levante/openmpi-4.1.2-yfwe6t
                LD_LIBRARY_PATH: $MPI_HOME/lib:$NetCDF_C_ROOT/lib:$NetCDF_Fortran_ROOT/lib:$HDF5ROOT/lib:${lib_aec}${lib_tbbmalloc}$LD_LIBRARY_PATH
                LD_LIBRARY_PATH[(0)]: /sw/spack-levante/intel-oneapi-mkl-2022.0.1-ttdktf/mkl/2022.0.1/lib/intel64:$LD_LIBRARY_PATH

        # Work done on self-compiled libraries by Jan Streffing, currently in progress and untested.
        awi_paleodyn_libs:
