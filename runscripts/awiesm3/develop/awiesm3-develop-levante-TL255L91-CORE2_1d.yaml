general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    #account: "ab0995"
    account: "ba0989" #new account if it works
    compute_time: "03:00:00"
    initial_date: "1850-01-01"
    final_date: "1852-01-01"
    #base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true
    # Wait indefinitely for all tasks to complete (needed for slow LPJ-GUESS cold start)
    launcher_flags: "-l --wait=0"

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 256 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.ice:
            ice_therm:
                use_meltponds: true

lpj_guess:
    lresume: false 
    nproc: 8 # originally 16
    omp_num_threads: 8
    co_coupling: 0
    resolution: "TL255"
    mygrid: ${resolution}
    # Use CMIP7 forcing (CO2 and N deposition)
    mip: "cmip7"
    use_luh3_input: 1
    run_landcover: 1
    run_natural: 1
    run_crop: 1
    run_pasture: 1
    run_barren: 0  # Disabled for LUH3 - calculated as residual internally
    run_urban: 1
    run_peatland: 0  # Disabled for LUH3 - no peatland data in LUH3
    fixed_CO2: 1850 # For piControl - freeze CO2 at 1850 levels
    fixed_ndep: 1850 # For piControl - freeze ndep at 1850 levels
    fixed_LU: 1850  # For piControl - freeze land use at 1850

oifs:
    resolution: TL255
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    nproc: 128 
    omp_num_threads: 1
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850
            NAERAD:
                #NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
                RCL_OVERLAPLIQICE: 0.1
            NAMGWWMS:
                GGAUSSB: -0.6

oasis3mct:
    use_lucia: false #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    #lresume: false # Set to false to generate the rst files for first leg 
    time_step: 7200
    norestart: false #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32