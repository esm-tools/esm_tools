name: esm-tools main test

on: [push, pull_request]

jobs:
  basic_tests:
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    # Same image as esm_tests (.github/containers/ubuntu-miniforge-esm_tests), with
    # Python 3.12 in its ``esm_tools`` conda environment
    container:
      image: mandresm/ubuntu-miniforge-esm_tests:v2.0
      options: --hostname levante

    steps:
    - uses: actions/checkout@v2

    - name: Install esm-tools
      run: |
        source /opt/conda/etc/profile.d/conda.sh;
        conda activate esm_tools;
        ./install.sh;
        echo "/opt/conda/envs/esm_tools/bin" >> $GITHUB_PATH;
      shell: bash

    - name: Run Pytest
      run: |
        pip install pytest
        pytest -v .
        pytest -v --doctest-modules src --ignore src/esm_runscripts/coupling --ignore-glob "*backup*"

    - name: Run esm_master first time
      run: |
        yes Y | esm_master

    - name: Run esm_master second time
      run: |
        esm_master

    - name: Run esm_plugins
      run: |
        esm_plugins

    - name: Run get-fesom-2.0
      run: |
        esm_master get-fesom-2.0

    - name: Run status-fesom-2.0
      run: |
        esm_master status-fesom-2.0

    - name: Run clean-fesom-2.0
      run: |
        esm_master clean-fesom-2.0
