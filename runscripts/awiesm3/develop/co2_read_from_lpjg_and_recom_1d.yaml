general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop-cc"
    account: "ab0246"
    compute_time: "00:10:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-03"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 256 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true

lpj_guess:
    nproc: 8 # originally 16
    omp_num_threads: 8
    lresume: false

oifs:
    resolution: TL255
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    nproc: 128
    omp_num_threads: 1
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1990
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8

oasis3mct:
    use_lucia: true #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 7200
    norestart: T #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
