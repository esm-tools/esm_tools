# Standalone ICON (2025.10-public) AMIP production runscript, R02B05 (grid 0030),
# nesh, 1979-01-01 to 2024-12-31. Same model setup as
# icon-2025.10-amip-r2b5-levante_1979-2024.yaml (see there and icon.yaml for the
# details), machine settings as in
# ../icon-fesom/icon-fesom-pictl-r2b5-core2-nesh_multiyear_geomar.yaml.
#
# Before the first run:
#   - input data: the files listed in ceresmip/nesh/amip_input_files.txt must be in
#     ${computer.pool_directories.focipool}/ICON-FESOM/icon-xpp (see ceresmip/nesh/README.md)
#   - compile: cd ~/esm/models && esm_master install-icon-2025.10-public, then
#     check out the commit used on levante (69ef5cda9, tag icon-2025.10-2), see ceresmip/nesh/README.md
#   - run icon-2025.10-amip-r2b5-nesh.yaml (2 days) first: it checks the setup and
#     gives the time per model day, needed to choose runlength below
#
# Run length: 5 year slabs, 1979-2023 (9 runs), then 2024 as one run:
#   ESM-Tools does not shorten the last run to final_date and the SST/sea ice
#   data end on 2025-01-16, so a 2024-2028 run would fail. After the 9th run
#   set runlength: 1, nyear: 1 (choose_unit) and final_date: "2025-01-01"
#   and resubmit, the experiment continues from the 2024-01-01 restart.
# The time per model year on nesh is not known yet (levante: 1.44 h on 2560 cores).
# A 5 year run must fit into the 48 h limit (incl. ~10 % margin), i.e. one model
# year must take < 8.5 h. Check with the 2-day test and reduce runlength if needed.
# Disk: a 5 year run writes ~700 GB of daily 3d model-level output before the
# interpolation job deletes it (interp_to_plev_ml_files: remove).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "48:00:00"

   initial_date: "1979-01-01T00:00:00"       # Initial exp. date
   final_date: "2024-01-01T00:00:00"         # Final date of the experiment, see above for 2024
   # set length and unit of each run (= restart interval), both are used
   # to set the ESM-Tools run length and the ICON restart intervals
   runlength: 5
   unit: 'y' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 5
         unitUpper: 'D'
      'm':
         nmonth: 5
         unitUpper: 'M'
      'y':
         nyear: 5
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B05
   grid_id: '0030'

   amip: True
   amip_sst: hadisst1p1
   scenario: 'cmip7hist'
   cmip7_scenario: m

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job). The daily
   # model-level files are deleted (140 GB per year) once the pressure-level file
   # passed its check, the monthly ones are moved to outdata/icon/3d_ml (needed for aec)
   interp_to_plev: True
   interp_to_plev_ml_files: remove

   # as in ICON-FESOM on nesh (24 nodes)
   nproc: 768
   omp_num_threads: 1
   dtime: 450

   # restart after each run, output intervals are set per stream in the
   # amip NAMELIST_atm
   checkpoint_interval: P${general.runlength}${general.unitUpper}
   restart_interval: ${checkpoint_interval}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 10
         output_nml:
            # yearly files, as in icon-fesom-pictl-r2b5-core2-levante_multiyear_geomar.yaml
            # (f90nml applies this to all output_nml groups)
            file_interval: "P01YT1S"
