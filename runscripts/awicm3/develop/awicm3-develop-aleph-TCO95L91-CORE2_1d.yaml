general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "awiiccp"
    compute_time: "00:10:00"
    initial_date: "2000-01-01"
    final_date: "2000-02-01"
    base_dir: "/scratch/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 1
    nmonth: 0
    nyear: 0
    pool_dir: "/proj/awi/input/"

awicm3:
    postprocessing: false
    model_dir: "/home/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    mesh_dir: "${pool_dir}/core2/"
    climate_data_dir: "${pool_dir}/hydrography/phc3.0/"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 320

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 1800
    nproc: 360
    omp_num_threads: 1

oasis3mct:
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 1800

xios:
    with_model: oifs
    nproc: 2

