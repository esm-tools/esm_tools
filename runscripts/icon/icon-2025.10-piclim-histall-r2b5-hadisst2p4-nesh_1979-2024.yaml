# Standalone ICON (2025.10-public) runscript, R02B05 (grid 0030), nesh, 1979-2024:
# CERESMIP piclim-histall, member 1 (suggested expid icon-piclim-histall-01): SST and sea ice
# fixed at pre-industrial (Schmidt et al. 2023: "all historical forcings, SST/SIC fixed at
# PI ~1850"), all forcings historical as in the amip runs (scenario cmip7hist, CMIP7 forcing,
# ScenarioMIP m after the historical period, GEOMAR extensions to 2024, see icon.yaml).
#
# Same setup as icon-2025.10-amip-r2b5-hadisst2p4-nesh_1979-2021.yaml (member 1: physics,
# tuning, forcing, amip_surface xpp-r0007, 24 nodes, output, interpolation), except
#   sstice: hadisst2p4-clim1850-1879 = monthly climatology 1850-1879 of the member-1 SST
#     and sea-ice products (HadISST 2.4.0.0 SST member 001 + HadISST 2.2.1.0 sea ice), the
#     same annual cycle every year, mid-month adjusted, daily, read as in the amip runs
#     (sstice_mode 6), r0005, see ceresmip/src/sst_seaice/r0005/README.md.
#     RFMIP (Pincus et al. 2016) uses the model's own piControl climatology instead; we have
#     no R2B5 piControl with this AMIP atmosphere, so the observed pre-industrial climatology
#     of the same SST product is used (switch sstice to change it).
#   period 1979-2024 (the climatological SST has no end date; amip member 1 ends in 2021)
# The effective radiative forcing is piclim-histall minus a piClim-control run (same SST,
# PI-CTRL forcing as in icon-2025.10-amip-sst-r2b5-hadisst2p4-nesh_1979-2021.yaml), which
# CERESMIP does not list and which is not set up yet.
#
# Run length: 3 runs of 15 years (1979-1993, 1994-2008, 2009-2023; ~2.28 h per model year
#   on 24 nodes = ~34 h, 48 h limit), final_date 2024-01-01. Then 2024 as one run, started
#   by hand: AFTER run 3, its tidy and its interp job have finished (never edit the
#   experiment's runscript copy while a run is still running), set runlength: 1, nyear: 1
#   (choose_unit), checkpoint_interval: P01Y and final_date: "2025-01-01", and resubmit;
#   the experiment continues from the 2024-01-01 restart.
# Restart files: every 3 years (checkpoint_interval, ~4.9 GB each, they stay in run_*/work),
#   the restart at the end of each run is copied to restart/icon. Check that the final
#   restart exists before trusting "Experiment over" (node loss, see CLAUDE.md), and check
#   the speed in the first hour (defective nodes, see the exclude list).
# Disk: ~140 GB per year of daily 3d model-level output (~2.1 TB per 15-year run) before the
#   interpolation job deletes it (interp_to_plev_ml_files: remove).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
        # defective nodes (ceresmip/nesh/check_nesh_srp_nodes.sh, scan 2026-11-19): srp224-227
        # thermally throttled (2026-11-09, half speed), srp110 and srp283 hyperthreading on
        # (32 ranks on 16 cores, job ~1.6x slower), the others down/unreachable
        - "--exclude=nesh-srp[104,110,112,128,205,224-227,242,278,283,299]"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "48:00:00"

   initial_date: "1979-01-01T00:00:00"       # Initial exp. date
   final_date: "2024-01-01T00:00:00"         # Final date of the experiment, see above for 2024
   # set length and unit of each run, both are used to set the ESM-Tools run
   # length and the ICON restart_interval (end of the run)
   runlength: 15
   unit: 'y' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 15
         unitUpper: 'D'
      'm':
         nmonth: 15
         unitUpper: 'M'
      'y':
         nyear: 15
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B05
   grid_id: '0030'

   amip: True
   # extpar, JSBACH land files and sea-ice snow albedo (see amip_surface in icon.yaml):
   # xpp-r0007 = 0030-0062/land/r0007 extpar + JSBACH files, r0008 ic_land_soil (as Trang 2026-11)
   amip_surface: xpp-r0007
   # pre-industrial SST/sea-ice climatology 1850-1879 of the hadisst2p4 products (r0005, see header)
   sstice: hadisst2p4-clim1850-1879
   scenario: 'cmip7hist'
   cmip7_scenario: m

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job). The daily
   # model-level files are deleted (140 GB per year) once the pressure-level file
   # passed its check, the monthly ones are moved to outdata/icon/3d_ml (needed for aec)
   interp_to_plev: True
   interp_to_plev_ml_files: remove

   # 24 nodes, as icon-amip-01 (scaling test 2026-11-05: 96 % efficiency 12 -> 24 nodes)
   nproc: 768
   omp_num_threads: 1
   dtime: 450

   # restart files every 3 years (checkpoint_interval), the run stops after runlength
   # (restart_interval). Output intervals are set per stream in the amip NAMELIST_atm
   checkpoint_interval: P03Y
   restart_interval: P${general.runlength}${general.unitUpper}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 2
         output_nml:
            # yearly files, as in icon-fesom-pictl-r2b5-core2-levante_multiyear_geomar.yaml
            # (f90nml applies this to all output_nml groups)
            file_interval: "P01YT1S"
