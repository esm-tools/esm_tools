general:
        setup_name: pism
        # This leg's walltime must cover BOTH PISM AND the next awiesm3 chunk's
        # couple_in mesh regen (build_submesh + griddes + OASIS weight-gen +
        # restart remap), which runs as a step in this same SLURM allocation.
        # 40min was too thin: movcav7's PISM + couple_in overran and was killed
        # mid-regen (job 26077001, 2026-07-06).
        # CHECK THIS after the 10yr -> 50yr change. The measured 17-20min was a
        # decade on 2 nodes; a 50yr leg is ~5x the timesteps, and 02:00:00 has
        # not been tested against it.
        compute_time: "04:00:00"
        initial_date: "62370-01-01"
        # One PISM leg per coupling cycle, so this must end on the same cycle as
        # fast_ocean. Keep the two chains in step: 63000-12-31 left PISM running
        # past awiesm3's last cycle, so on 2026-08-14 it began a spurious leg
        # with no atmosphere counterpart and had to be cancelled by hand. The
        # converse also works: 62569-12-31 stopped PISM cleanly after leg 20 on
        # 2026-08-16.
        #
        # 2026-09-08: legs went 10yr -> 50yr (general.nyear below, and
        # model2.chunk_size in fast_couple.yaml, which must be a multiple of it).
        # The ice sheet now advances 50 years per ocean year instead of 10, so
        # the same 50 cycles span 2500 PISM years rather than 500.
        # 2026-09-09: the 2-cycle ism40 cap is LIFTED, tracking fast_ocean's
        # restored 50 cycles. Both test legs (62370-62419, 62420-62469) COMPLETED.
        final_date: "62389-12-31"   # 2 legs of 10 yr, matching orogtest_ocean. Was 64869 (50x50yr) in ism40.
        # cycles (1900-1949). Leg N is 62370+50*(N-1) .. +49, so leg 50 is
        # 64820-64869, hence this end date; stops without an orphan leg 51.
        # Was 62869-12-31 when legs were decades.
        user: !ENV ${USER}
        # Shared with awiesm3 for iterative coupling -- LITERAL awiesm3-develop-is
        # so BOTH models resolve to the SAME experiment_dir runtime/awiesm3-develop-is/<expid>
        # (pism's own setup_name-version would put it elsewhere and break the handoff).
        base_dir: "/work/ab0246/${user}/runtime/awiesm3-develop-is/"
        # The couplings tree of whichever esm_tools is running, not a fixed home.
        script_dir: "${general.esm_configs_dir}/../couplings/"
        nyear: 10
        change_ocean: 1
        files_to_wait_for:
            - "latest_atmo_forcing_file.nc"
            - "latest_ocean_forcing_file.nc"
        use_venv: False

pism:
        version: "github1.2.1"
        resolution: "08km"          # 08km == 761x761; matches antarct_cr pool naming (basins/masks/initial are *_08km)
        domain: "antarct_cr"        # 8km pool files exist under antarct_cr (grid identical to antarctica-8km); domain added to pism.domains.yaml
        model_dir: "/work/ab0246/${general.user}/model_codes/awiesm3-develop-is/pism-github1.2.1/"
        lresume: 1
        # concurrent coupling_mode only: chunk-1 forcing set; auto = newest
        # matching harvest under <pism.pool_dir>/coupled_bootstrap
        bootstrap_forcing_dir: "auto"

        nx: 761
        ny: 761

        # Run PISM on 4 nodes (512 MPI tasks) instead of 1. No -Nx/-Ny is passed,
        # so PETSc auto-decomposes the 761x761 grid; ~1.5-1.8x faster, which also
        # keeps the PISM+coupling leg within its compute_time walltime. The 512
        # here is the rank count the spinup_file note below refers to.
        choose_computer.partitions.compute.cores_per_node:
                128:
                        nnodes: 4
                        nproca: 512
                        nprocb: 1

        downscale_precip: 0
        ###################
        # Settings for AWIES - PISM coupling
        # DEBM
        debm_path: "/work/ab0246/${general.user}/model_codes/awiesm3-develop-is/bin/debm"
        debm_beta: 10
        lapse_rate: -0.005
        # DIRECT consumes the ISM-mapper's P-E-R, which already arrives on the
        # PISM grid, so there is nothing to regrid and no melt model to run.
        ablation_method: "DIRECT"
        regrid_method: "NONE"
        # PISM's discharge leaves as icebergs, so pism2ocean writes
        # latest_discharge.nc for the berg generator on the atmosphere side.
        iceberg_coupling: 1
        thk_threshold: 5.0
        select_min_glacial_depth: 1
        account_all_fw_input: 1
        change_emiss: 0
        change_emiss_by: 0
        multi_year_mean: 0
        change_ocean: 1
        oce2ice_method: "DIRECT"   # consume FESOM's melt via -ocean given (see awiesm3 runscript)
        ###################
        ini_parent_exp_id: "bla"
        ini_parent_date: "1-1-1"
        ini_restart_dir: "bla"
        # End state of a270234's repro_movcav45, 570 yr of coupled PISM on this
        # same 8 km antarct_cr grid. The old 1percCO2_b_2640 spinup was still
        # deep in its own transient here: discharge -14253 Gt/yr at the start of
        # movcav45 against -4141 at the end, and the ice sheet shedding
        # ~9800 Gt/yr against ~1700. Starting relaxed keeps the iceberg forcing
        # in a range the ocean can be judged on.
        # Old spinup, for reference:
        # /work/ab0246/a270193/esm-experiments/1percCO2_b_2640/restart/pism_sh/1percCO2_b_2640_pismr_restart_627500101-627501231.nc
        # Copied into the pool. It used to be read straight out of a270234's live
        # experiment tree, which nobody else should depend on staying there.
        # Uncompressed copy. The pool file is netCDF-4 with deflate 9 + shuffle on 58 of
        # its 61 variables. HDF5 cannot do collective parallel I/O on filtered datasets
        # and a rank must inflate a whole chunk to touch any of it, so with 724x724
        # chunks, a 761x761 grid and 512 ranks (~34x34 each) nearly every rank inflates
        # nearly every chunk. Measured on chunk 1: ~30-33 min of a 43 min decade spent
        # in init, and 2071 MB/task instead of 386 MB. Per-step cost is unaffected
        # (~0.9 s/step either way), so this is purely a one-time bootstrap tax -- but it
        # is paid again by every new experiment that starts from this spinup.
        # Made with: nccopy -6 <pool file> <this file>   (12 s; 281 MB -> 1129 MB;
        # verified bit-for-bit identical across all 62 variables).
        spinup_file: "/work/ab0246/a270234/input/pism/PISM_ANT08km_1850_spinup16_nc3.nc" #"/work/ab0246/a270234/runtime/awiesm3-develop-is/repro_movcav48/restart/pism/repro_movcav48_pismr_restart_623600101-623691231.nc"

        # Still a literal. The group pool lives in awiesm3.yaml as general.pool_dir,
        # but this chain's setup_name is pism and there is no setups/pism, so it
        # never loads awiesm3.yaml: both ${general.pool_dir} and ${model1.pool_dir}
        # fail to resolve here. See the note in fast_ocean.yaml.
        pool_dir: "/work/ab0246/a270092/input/pism/"
        ts_interval: "1"
        ex_interval: "monthly"
        force_bootstrap_first_run: False
        orog_reference_pism: "1"
        # Antarctic ice-sheet physics (after a270193 pism_sh; ocean coupling is
        # '-ocean given' consuming FESOM's own melt, not 3eqn/PICO).
        kv_pairs:
            stress_balance.model: "ssa+sia"
            stress_balance.sia.max_diffusivity: 64000
            sia_e: 2.5
            ssa_e: 0.512
            sia_n: 3.0
            ssa_n: 3.0
            hydrology.tillwat_max: 1
            # Basal sliding, changed for ism39 (2026-08-27; ism38 and every run
            # before it used q=0.25, delta=0.01). The two pull in OPPOSITE
            # directions, which is the point of changing them together:
            #
            #   q 0.25 -> 0.75  pseudo-plastic exponent, tau_b = tau_c*(u/u_0)^q.
            #                   Larger q is closer to linear-viscous, so drag
            #                   grows more with speed instead of saturating near
            #                   tau_c -- this SLOWS fast ice.
            #   delta 0.01 -> 0.04  effective-pressure fraction. At saturated till
            #                   N = delta*P_o exactly (MohrCoulombPointwise.cc:41),
            #                   so this is a 4x rise in N and hence in tau_c
            #                   wherever the bed is wet -- a STRONGER bed.
            #
            # PISM 1.2.1 defaults for reference: delta 0.02, tillwat_max 2.0 m,
            # tillwat_decay_rate 1.0 mm/yr. We run tillwat_max 1.0 m and leave the
            # decay rate at its default -- see the note on hydrology.tillwat_max.
            basal_resistance.pseudo_plastic.q: 0.75
            basal_resistance.pseudo_plastic.u_threshold: 100
            basal_yield_stress.mohr_coulomb.till_effective_fraction_overburden: 0.04
            basal_yield_stress.mohr_coulomb.till_phi_default: 30
            # Fixed bed, stated explicitly. 'lc' was set here before but never
            # ran: every seed in /work/ab0246/a270096/share/pism/ANT.08km/
            # carries time_lingle_clark = -9460800000000 s (year -300000) from
            # the original paleo spinup, and PISM 1.2.1's update_impl only fires
            # when the model time is within m_t_eps = 1 s of m_t_last + one
            # interval. With a 362-kyr gap that test can never pass, so step()
            # never ran and m_t_last was written back unchanged each segment.
            # topg/dbdt/viscous_/elastic_bed_displacement are bit-identical from
            # year 60013 (spinup16) through 62649 (ism37) -- 2636 years frozen.
            # 'none' is the same physics, minus the silent lie in the config and
            # the dt clipping LC imposed while doing nothing.
            # NOTE: restarts written under 'none' drop viscous_/elastic_bed_-
            # displacement (BedDef::write_model_state_impl writes only topg and
            # dbdt), and LingleClark::init_impl reads both unconditionally on
            # restart -- so going back to 'lc' needs a restart saved from BEFORE
            # this switch, else the paleo deformation (-1032 m) is lost.
            bed_deformation.model: "none"
            calving.methods: 'eigen_calving,thickness_calving'
            calving.eigen_calving.K: "5.0e17"
            calving.thickness_calving.threshold: 75
            ocean.pik_melt_factor: "1e-2"
            atmosphere.elevation_change.precip_lapse_rate: 0.0
            atmosphere.elevation_change.smb_lapse_rate: 0.0
            dt_max: 0.02
        flags:
            - "pik"
            - "basal_resistance.pseudo_plastic.enabled"
            - "basal_yield_stress.slippery_grounding_lines"
            - "no_subgl_basal_melt"
            - "label_floating_holes"

        couplers:
            surface:
                given:
                    files:
                        surface_given_file: "latest_atmo_forcing_file.nc"
                    kv_pairs:
                        surface_given_period: 1
            ocean:
                # given = PISM consumes FESOM's own cavity melt directly
                # (shelfbtemp [degC] + shelfbmassflux [kg m-2 s-1] from the
                # DIRECT synthesis; Bug-I design). th would re-derive melt
                # from T/S with the 3eqn model AND rejects the decreasing
                # FESOM depth axis on the 3D companion fields in this file.
                given:
                    files:
                        ocean_given_file: "latest_ocean_forcing_file.nc"

        workflow:
            next_run_triggered_by: couple_out
            subjobs:
                couple_in:
                        nproc: 1
                        run_before: prepcompute
                        script: real_esm2pism.functions
                        script_dir: ${general.script_dir}/pism
                        call_function: esm2pism
                        env_preparation: env_pism.py
                        run_only: first_run_in_chunk

                couple_out:
                        nproc: 1
                        run_after: tidy
                        script: coupling_pism2esm.functions
                        script_dir: ${general.script_dir}/pism
                        call_function: pism2esm
                        env_preparation: env_pism2awiesm.py
                        run_only: last_run_in_chunk
