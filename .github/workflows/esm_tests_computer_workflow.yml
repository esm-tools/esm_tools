# ESM-Tests generalized workflow for computers
# ============================================

name: esm_tests_computer_workflow

# Called from other workflows
on:
  workflow_call:
    inputs:
      # Name as in configs/machines/<name>.yaml (passed to ``esm_tests --computer``)
      computer:
        required: true
        type: string
      ref:
        type: string
        default: ""
      # If given, only this model/runscript is tested (``--model``/``--runscript``)
      model:
        type: string
        default: ""
      runscript:
        type: string
        default: ""
      test_flags:
        type: string
        default: "-cngeu -s False"
      # Upload the ``last_tested/<computer>`` files changed by the run (``-s True``) as
      # artifact ``last_tested-<computer>-<model>-<runscript>``, pushed to
      # esm_tests_info by ``approve_esm_tests_changes.yml``. No secrets here: this job
      # runs the code of the pull-request
      upload_last_tested:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  computer:
    name: ${{ inputs.model != '' && format('{0} / {1} / {2}', inputs.computer, inputs.model, inputs.runscript) || inputs.computer }}
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    # Docker Hub image that `container-job` executes in
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    container:
      # TODO (PG): Change to ghcr hosting at some point in the future.
      image: mandresm/ubuntu-miniforge-esm_tests:v2.0
      # The machine is selected with ``--computer``, but the node type is still
      # detected from the hostname (``configs/machines/all_machines.yaml``). Fake a
      # login node, as in a check run on the HPC (e.g. no dask cluster is started).
      # A computer missing here makes the container fail to start.
      options: >-
        --hostname ${{ fromJSON('{"ollie": "ollie1", "levante": "levante1",
        "juwels": "jwlogin01.juwels", "aleph": "elogin1", "blogin": "blogin1",
        "albedo": "albedo1"}')[inputs.computer] }}
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.ref }}
    - name: install esm-tools
      run: |
        source /opt/conda/etc/profile.d/conda.sh;
        conda activate esm_tools;
        ./install.sh;
        echo "/opt/conda/envs/esm_tools/bin" >> $GITHUB_PATH;
      shell: bash

    - name: run esm_tests
      env:
        COMPUTER: ${{ inputs.computer }}
        MODEL: ${{ inputs.model }}
        RUNSCRIPT: ${{ inputs.runscript }}
      run: |
        git config --global --add safe.directory /__w/esm_tools/esm_tools;
        git config --global --add safe.directory /__w/esm_tools/esm_tools/src/esm_tests/resources;
        git status;
        selection="--computer $COMPUTER";
        if [ -n "$MODEL" ]; then selection="$selection --model $MODEL"; fi
        if [ -n "$RUNSCRIPT" ]; then selection="$selection --runscript $RUNSCRIPT"; fi
        yes Y | esm_tests ${{ inputs.test_flags }} $selection --results-file esm_tests_results.json

    # Collected by ``esm_tests_summary.yml``
    - name: upload results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ inputs.computer }}-${{ inputs.model }}-${{ inputs.runscript }}
        path: esm_tests_results.json
        if-no-files-found: ignore
        retention-days: 7

    # New and modified files under ``last_tested/<computer>`` of the resources
    # (``esm_tests -s True`` only writes there, and never deletes), copied with their
    # path relative to the resources
    - name: collect last_tested
      if: ${{ inputs.upload_last_tested }}
      env:
        COMPUTER: ${{ inputs.computer }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/last_tested_upload";
        cd src/esm_tests/resources;
        git status --short -- "last_tested/$COMPUTER";
        git ls-files -z --modified --others --exclude-standard -- "last_tested/$COMPUTER" |
          while IFS= read -r -d '' f; do
            if [ -f "$f" ]; then cp --parents "$f" "$GITHUB_WORKSPACE/last_tested_upload/"; fi
          done
      shell: bash

    - name: upload last_tested
      if: ${{ inputs.upload_last_tested }}
      uses: actions/upload-artifact@v4
      with:
        name: last_tested-${{ inputs.computer }}-${{ inputs.model }}-${{ inputs.runscript }}
        path: last_tested_upload/
        if-no-files-found: ignore
        retention-days: 7
