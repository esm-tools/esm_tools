[workspace]
authors = ["Paul Gierz <pgierz@awi.de>"]
channels = ["conda-forge", "bioconda"]
name = "esm_tools"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
esm-catalog = "python -m esm_catalog.cli"
esm-viz = "python -m esm_viz.cli"
test-catalog = "pytest src/esm_catalog/tests/ -v"

[dependencies]
python = "3.11.*"
snakemake = ">=8"
loguru = ">=0.7.3,<0.8"
typer = ">=0.9"
f90nml = ">=1.5,<2"
"ruamel.yaml" = ">=0.19.1,<0.20"
colorama = ">=0.4.6,<0.5"
setuptools = ">=80.10.2,<81"
pip = ">=25.3,<26"

# esm_catalog dependencies
duckdb = ">=1.0"
pydantic = ">=2.0"
fastapi = ">=0.110"
uvicorn = ">=0.29"
attrs = ">=23.0"
netcdf4 = ">=1.6"
h5py = ">=3.10"
h5netcdf = ">=1.3"
xarray = ">=2024.1"
httpx = ">=0.27"
pytest = ">=8.0"
starlette = ">=0.36"
eccodes = ">=2.34"
cfgrib = ">=0.9"
pyarrow = ">=15.0"
rich-click = ">=1.9.7,<2"
fsspec = ">=2024.1"
universal_pathlib = ">=0.2"
paramiko = ">=3.0"
distributed = ">=2024.1"  # dask.distributed for parallel scanning

# esm_viz dependencies
matplotlib = ">=3.8"
cartopy = ">=0.22"
scipy = ">=1.12"
panel = ">=1.5"
hvplot = ">=0.9"
holoviews = ">=1.18"
bokeh = ">=3.3"
geoviews = ">=1.11"
cmocean = ">=4.0"
pydantic-settings = ">=2.1"
numpy = ">=1.26"

[pypi-dependencies]
stac-fastapi-api = ">=3.0"
stac-fastapi-types = ">=3.0"
bokeh-fastapi = ">=0.1"
