general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "develop"
    account: "ab0246"
    compute_time: "01:00:00"
    initial_date: "1990-01-01"
    final_date: "2000-01-01"
    use_venv: true
    install_esm_tools_branch: "feat/awiesm3-v3.4"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    #base_dir: "/work/ab0995/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 1
    parallel_file_movements: 'threads'

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"
    #model_dir: "/work/ab0995/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 1152
    omp_num_threads: 1
    tar_binary_restarts: true

oifs:
    resolution: "TL255"
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    nproc: 512
    omp_num_threads: 2
    mpi: 'cmip6'
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1990
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8
            NAMCUMF:
                ENTSTPC3: 1

oasis3mct:
    use_lucia: True
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 7200

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    config_sources:
        field_def: ${xml_dir}/field_def_cmip6.xml
        file_def:  ${xml_dir}/file_def_lpjg_spinup.xml.j2

