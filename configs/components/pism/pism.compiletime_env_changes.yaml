# Build-time dependency paths for PISM (PETSc, udunits, fftw, proj, gsl).
#
# These MUST live here rather than in pism.yaml's comp_command: esm_master
# strips any component key that is not in its relevant_entries whitelist
# (src/esm_master/compile_info.py) and blacklists computer.* in reduce(), so a
# helper variable or a choose block inside comp_command never resolves.
#
# The nesting below is what makes the values reach the generated build script:
# computer -> choose_general.execution_mode: compile -> choose_computer.name.
# add_export_vars must be a MAPPING, not a list of "KEY=value" strings; the
# list form is silently ignored, which is why PISM used to fail configure with
# "PETSc could not be found. Be sure to set PETSC_DIR and PETSC_ARCH."
# Compare configs/components/xios/xios.env.yaml, which uses the same shape.
#
# HDF5_ROOT is deliberately not set here. In a coupled build another component
# (xios) already exports it, and defining it twice just races; PISM picks up
# the loaded hdf5 module.

computer:
    choose_general.execution_mode:
        compile:
            choose_computer.name:
                albedo:
                    add_export_vars:
                        PETSC_DIR: /albedo/home/lackerma/.spack/sw/petsc/3.17.1-s5b6i2f
                        UDUNITS2_ROOT: /albedo/soft/sw/spack-sw/udunits/2.2.28-nzwb4bf/
                        FFTW_ROOT: /albedo/soft/sw/spack-sw/fftw/3.3.10-pj3kzd2/
                        PROJ_ROOT: /albedo/soft/sw/spack-sw/proj/8.2.1-pq74r7k/
                        GSL_ROOT: /albedo/soft/sw/spack-sw/gsl/2.7.1-r4x7ty2/
                levante:
                    add_export_vars:
                        PETSC_DIR: /sw/spack-levante/petsc-3.16.2-oorrxp/
                        UDUNITS2_ROOT: /sw/spack-levante/udunits-2.2.28-da6pla/
                        FFTW_ROOT: /sw/spack-levante/fftw-3.3.10-lnogal/
                        PROJ_ROOT: /sw/spack-levante/proj-5.2.0-w7auht/
                        LD_LIBRARY_PATH: /sw/spack-levante/gsl-2.7-5ou4yk/lib:$LD_LIBRARY_PATH
