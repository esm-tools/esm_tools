# Smoke test of awicm3 v3.5.0 (pinned tags) on Levante: three 1-day legs from a cold start.
# oasis lresume false is fine for a day; do not copy it for a long run (every coupling field becomes EXPOUT).
general:
    user: !ENV ${USER}
    use_venv: False
    setup_name: "awicm3"
    version: "v3.5.0"
    account: "ab0246"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-04"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    # CORE3 carries ice-shelf cavities (cavity_elvls.out); FESOM aborts without this.
    add_namelist_changes:
        namelist.config:
            run_config:
                use_cavity: true
    resolution: "CORE3"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 600
    nproc: 1792
    omp_num_threads: 1
    tar_binary_restarts: true

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 128
    omp_num_threads: 1
    mip: cmip7
    scenario: piControl

oasis3mct:
    use_lucia: true
    lresume: false
    time_step: 7200
    norestart: T

xios:
    with_model:
        - oifs
        - fesom
    nproc: 4
    omp_num_threads: 32
