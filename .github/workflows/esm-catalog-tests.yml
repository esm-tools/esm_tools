name: esm_catalog tests

on:
  push:
    paths:
      - "src/esm_catalog/**"
      - "tests/test_esm_catalog/**"
      - "configs/stac-extensions/**"
      - ".github/workflows/esm-catalog-tests.yml"
      - "setup.py"
  pull_request:
    paths:
      - "src/esm_catalog/**"
      - "tests/test_esm_catalog/**"
      - "configs/stac-extensions/**"
      - ".github/workflows/esm-catalog-tests.yml"
      - "setup.py"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[catalog,catalog-test]"
          # setuptools<81 still bundles pkg_resources (removed in 81), which esm_tools imports.
          pip install -U "setuptools<81"
      - name: Run esm_catalog tests
        run: pytest tests/test_esm_catalog -v
