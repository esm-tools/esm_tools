# Example configuration; resolve TODOs before submitting. See README-examples.md.
# Based on check/ and the foci-mops-* templates in this directory.
computer:
   pool_dir: "/mnt/lustre-grete/projects/geomar/foci_input2/"
   partition: "standard96"
   # test setting: use together with the daily restart settings below
   # partition: "standard96:test"
   launcher: "mpirun"
   launcher_flags: ""
   # One MPI rank per core, including ECHAM I/O ranks; round up to whole nodes.
   # standard96 has 96 cores/node: MOPS = 10 nodes, provisional AGRIF = 11.
   nnodes: "$(( (${echam.nproca} * ${echam.nprocb} + ${echam.nprocio} + ${nemo.nproc} + ${xios.nproc} + ${computer.partition_cpn} - 1) // ${computer.partition_cpn} ))"
   # Explicit nodes workaround from the templates after the June 2026 SLURM update.
   additional_flags:
      - "--nodes=${computer.nnodes}"

general:
   # False: use the current ESM-Tools Python environment (no experiment-specific venv).
   use_venv: False
   verbose: True
   setup_name: "foci"
   # No agrif_mops_oasismct5 setup exists here. This legacy name already
   # selects OASIS 5.0-geomar in configs/setups/foci/foci.yaml. Verify the binaries.
   version: "agrif_mops_oasismct4"
   homedir: !ENV ${HOME}

   # operational settings: yearly restarts
   # TODO 12h reasonable?
   compute_time: "12:00:00"
   initial_date: "2015-01-01T00:00:00"       # Initial exp. date
   final_date: "2100-01-01T00:00:00"
   nmonth: 12
   clean_runs: 2
   # test settings, daily restarts
   # compute_time: "00:30:00"
   # initial_date: "2015-01-01T00:00:00"
   # final_date: "2015-01-03T00:00:00"
   # nday: 1
   # Also switch echam.restart_rate/restart_unit below and use standard96:test.

   postprocessing: True
   # machine specific setup
   account: shk00066
   base_dir: ${homedir}/esm/esm-experiments/

   lresume: True
   # TODO right restart?
   ini_parent_exp_id: "FOCI2.0-TK105_FAM_ESM_piControl_2129TK012"
   ini_parent_date: "18991231"
   ini_nemo_restart_steps: 00876576
   ini_parent_dir: "${computer.pool_dir}/FOCI_RESTART/${ini_parent_exp_id}"
   # PI-CTRL keeps preindustrial forcing; 2015 is only the simulation calendar.
   check_error:
      "check_exit_codes":
         method: "kill"
         message: "MPI Init error glogin"
         file: stdout
         frequency: 15
      "lookup table overflow":
         method: "kill"
         message: "lookup table overflow"
         file: stdout
         frequency: 15
      "SIGTERM":
         method: "kill"
         message: "SIGTERM found in stdout"
         file: stdout
         frequency: 15
      "FINISH called":
         method: "kill"
         message: "FINISH called found in stdout; inspect model logs"
         file: stdout
         frequency: 15
      "netcdf error":
         method: "kill"
         message: "netcdf error found in stdout"
         file: stdout
         frequency: 15
      "BAD TERMINATION":
         method: "kill"
         message: "BAD TERMINATION found in stdout"
         file: stdout
         frequency: 15
      "Usage: ./mpiexec":
         method: "kill"
         message: "mpirun failed, check for empty hostfile"
         file: stdout
         frequency: 15

foci:
   model_dir: ${general.homedir}/esm/models/foci-mops_oasismct4/

oasis3mct:
   # EXPORTED exchanges fields; EXPOUT additionally writes coupling fields to NetCDF.
   # Set both options to inspect atmosphere-to-ocean AND ocean-to-atmosphere fields.
   # export_mode_a2o: "EXPOUT"
   # export_mode: "EXPOUT"
   # 0: minimal coupler logging; increase for diagnosis
   debug_level: 0
   # interpolation conserv needs oasismct5
   #interpolation: conserv
   interpolation: gauswgt
   # set input_dir for oasis grids, masks and areas
   input_dir: "${computer.pool_directories.focipool}/OASIS3_ECHAM6T63_ORCA05/input/T63_ORCA05_${nemo.nest1}/"
   # The existing conserv branch still uses gauswgt_agr1 for the nest and
   # bicubic interpolation for base-grid stresses

echam:
   postprocessingscript: "echam_postprocessing.sh"
   # all ssp* scenarios use historical forcing before 2015
   # scenario: "cmip6hist" and scenario: "ssp???" produce the same results
   # until year 2014
   # available scenarios: PI-CTRL, 1percCO2, ssp126, ssp245, ssp370, ssp585, ssp585os
   # technically tested in the original templates: PI-CTRL, cmip6hist, ssp370, ssp585
   # seb-wahl, 2021-08-11
   scenario: "PI-CTRL"
   allow_hist2ssp_transition: True
   resolution: "T63"
   # operational settings: yearly restarts
   restart_rate: ${general.nmonth}
   restart_unit: "months"
   # test settings, daily restarts
   # restart_rate: ${general.nday}
   # restart_unit: "days"
   # TODO verify!
   nproca: 8
   nprocb: 12
   nprocio: 0
   # Sets namelist parameters and links the correct carbon_emission.nc file.
   with_lco2_emis: False
   namelist_changes:
      namelist.echam:
         runctl:
            lcouple_co2: True
            default_output: False
            ltdiag: True
            nproma: 32
         radctl:
            iaero: 3
            io3: 4
            ighg: 0
            icfc: 2
            isolrad: 6
            ico2: 1
            ich4: 3
            in2o: 3
            co2vmr: 0.000284316986084
            ch4vmr: 8.082490234375e-07
            n2ovmr: 2.730210571289e-07
            yr_perp: 1850
         submodelctl:
            lco2: True
            lmethox: True
         parctl:
            iomode: 0
            nprocio: ${nprocio}
         co2ctl:
            lco2_emis: False
            lco2_2perc: True

nemo:
   # the brute-force approach to the hostfile_srun missing / empty file
   pre_run_commands: "cp runscripts/foci/srun_hostfile/hostfile_srun_foci_agrif_mops ~/srun_hostfile_template"
   # NEMO postprocessing is wired by the setup to nemo_postprocessing.sh -m;
   agrif_dir: ${computer.pool_directories.focipool}/AGRIF/agrif_VIKING10/host_bathy_meter_nest_smoothed_for_TK011
   nest1: VIKING10
   resolution: "ORCA05"
   # TODO 1800s right?
   time_step: 1800
   version: "ORCA05_LIM2_FOCI_AGRIF_MOPS_OASISMCT4"
   # jpni and jpnj are 0 by default, i.e. automatic distribution on CPUs
   jpni: 36
   jpnj: 24
   nproc: 864
   namelist_changes:
      namelist_top_cfg:
         namtrc_rad:
            ln_trcrad: False
         namtrc:
            ln_trcdta: False
      1_namelist_top_cfg:
         namtrc_rad:
            ln_trcrad: False
         namtrc:
            ln_trcdta: False
      namelist_cfg:
         namzgr:
            cn_batmeter: "bathy_meter.nc"
            # cn_batmeter: "bathy_updated.nc"
      1_namelist_cfg:
         namsbc_cpl:
            sn_snd_co2: "coupled"
            sn_rcv_co2: "coupled"
         namlbc:
            rn_shlat: 0.0
         namnc4:
            nn_nchunks_k: 46
   # nn_rstctl does not work in 1_namelist_cfg
   input_sources:
      # Use bathy_meter instead of bathy_updated for VIKING10
      bathy_updated: ${agrif_dir}/bathy_meter.nc

xios:
   nproc: 48
   # Optional alternative output definition, relative to the setup's xml_dir:
   # config_sources:
   #    file_def: ${xml_dir}/project_name/file_def.xml
   #    file_def_agrif: ${xml_dir}/project_name/file_def_agrif.xml
   # Also supply a compatible nest output definition when changing AGRIF output.
