general:
    user: !ENV ${USER}
    setup_name: "lpjg-spinup"
    version: "develop"
    account: "bb1469"
    compute_time: "08:00:00"
    initial_date: "1900-01-01"
    final_date: "2900-01-01"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 1000

computer:
    taskset: true

lpjg-spinup:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"
    resolution: TCO95
    fesom_resolution: CORE2

lpj_guess:
    lresume: false 
    nproc: 1280 # originally 16
    omp_num_threads: 4
    resolution: TCO95
    fesom_resolution: CORE2
    mygrid: TCO95
    execution_command: ${executable} -parallel -islpjgspinup ${runscript_name}
    mip: cmip7
    add_forcing_files:
        co2_file: co2_file
    add_forcing_sources:
        co2_file: ${lpj_guess.co2_source_file}
        oifs_forcing: ${lpj_guess.input_dir}/oifs_forcing/AM04_atm_cmip6_1d_1900-1909_TCO95_CORE2.nc
    add_forcing_in_work:
        co2_file: ${lpj_guess.co2_work_file}
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
