# FESOM2 YAML CONFIGURATION FILE
#
fesom:
    model: fesom
    branch: "2.7.0"
    version: "2.7"
    type: ocean

    comp_command: mkdir -p build; cd build; cmake -DENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=../ ..;   make install -j `nproc --all`
    clean_command: ${defaults.clean_command}

    # MA This variable needs to be set true in every version of fesom-2.1 (choose_ block
    # below) whose source code contains the icebergs implementation
    with_icb: false
    use_icebergs: false
    use_icesheet_coupling: false

    wiso_code: false
    with_wiso: false
    with_recom: false

    required_plugins:
    - "git+https://github.com/esm-tools-plugins/tar_binary_restarts"

    # NOTE: Starting with FESOM 2.7.4, recom is bundled as a git submodule of
    # the fesom2 repository. Versions >= 2.7.4 (and the main branch) therefore
    # must be cloned with ``--recurse-submodules`` so that recom is pulled in.
    # Earlier versions (2.7, 2.7.2, 2.7.3) do not carry the submodule.
    choose_version:
      "2.7":
        branch: "2.7.0"
      "2.7.2":
        branch: "2.7.2"
      "2.7.3":
        branch: "2.7.3"
      "2.7.4":
        branch: "2.7.4"
        repo_options: "--recurse-submodules"
      "2.7.5":
        branch: "2.7.5"
        repo_options: "--recurse-submodules"
      "2.7.6":
        branch: "2.7.6"
        repo_options: "--recurse-submodules"
      "2.7.7":
        branch: "2.7.7"
        repo_options: "--recurse-submodules"
      "2.7-main":
        # INTERIM (until FESOM PR #957 merges to fesom2 main): the awiesm3 develop*
        # variants build the coupled-slab ice-surftemp branch that provides the
        # sit_feom send (so the namcouple's sit_feom is filled -- fixes the -cc
        # "namcouple variable not used" abort). Only awiesm3 develop* use 2.7-main;
        # revert branch to "main" once #957 is merged.
        branch: "awiesm3-implicit-ice-surftemp"
        repo_options: "--recurse-submodules"
        #namelist_dir: "${model_dir}/config/"

    destination: "fesom-2.7"
    install_bins: bin/fesom.x
    git-repository:
    - https://github.com/FESOM/fesom2.git
    contact: "jan.streffing(at)awi.de, patrick.scholz(at)awi.de miguel.andres-martinez(at)awi.de, paul.gierz(at)awi.de"

    restart_rate: "12"
    restart_unit: "m"
    restart_first: 12
    restart_flag: "last"

    tar_binary_restarts: True

    time_step: 1800
    resolution: CORE2

    comp_executable: fesom.x
    executable: fesom

    mesh_rotated: false
    old_mesh_format: false
    with_part_format: false
    time_dimension: "time"

    pool_dir: "${computer.pool_directories.pool}"

    choose_computer.name:
        levante:
            pool_dir: "${computer.pool_directories.pool}/AWICM/"
            climate_data_dir: "${pool_dir}/FESOM2/INITIAL/phc3.0/"
            forcing_data_dir: "${pool_dir}/FESOM2/FORCING/"
            mesh_base_dir: "${pool_dir}/FESOM2/MESHES_FESOM2.1/"
        albedo:
            climate_data_dir: "${pool_dir}/FESOM/hydrography/"
            mesh_base_dir: "${pool_dir}/FESOM/meshes_default/"

    setup_dir: "${model_dir}"
    bin_dir: "${setup_dir}/bin"
    climate_data_dir: "${pool_dir}/FESOM2/hydrography/phc3.0/"
    forcing_data_dir: "${pool_dir}/forcing/"
    mesh_base_dir: "${pool_dir}/FESOM2/meshes/"
    ini_data_dir: "${pool_dir}/pool-data/"
    namelist_dir: "${esm_namelist_dir}/fesom2/${version}/"

    opbnd_dir: "somepath"
    tide_forcing_dir: "somepath"

    steps_per_day: "$(( 86400 / ${time_step} ))"

    asforcing: JRA55

    namelists:
            - namelist.config
            - namelist.cvmix
            - namelist.dyn
            - namelist.forcing
            - namelist.ice
            - namelist.icepack
            - namelist.io
            - namelist.oce
            - namelist.tra
            - namelist.transit

    whichEVP: 0 # 0=EVP, 1=mEVP, 2=aEVP
                # See: Kimmritz et. al 2015 & 2016: https://doi.org/10.1016/j.jcp.2015.04.051, https://doi.org/10.1016/j.ocemod.2016.03.004
    choose_resolution:
            CORE2:
                    nx: 126858
                    mesh_dir: "${fesom.mesh_base_dir}/core2/"
                    nproc: 288
                    whichEVP: 0
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            CORE3:
                    nx: 211567
                    mesh_dir: "${fesom.mesh_base_dir}/core3/"
                    nproc: 128
                    whichEVP: 1
                    alpha_evp: 300          # constant that control numerical stability of mEVP.
                    beta_evp: 300           # constant that control numerical stability of mEVP.
            pi:
                    nx: 3140
                    mesh_dir: "${fesom.mesh_base_dir}/pi/"
                    nproc: 4
                    whichEVP: 0
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            LGM:
                    nx: 95239
                    mesh_dir: "/home/a/a270064/bb1029/inputs/mesh_glac1d_m1_512/"
                    nproc: 1024
                    whichEVP: 0
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            GLOB:
                    nx: 830305
                    whichEVP: 1
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            CAVCORE2:
                    nx: 72411
                    mesh_dir: "/work/ollie/pscholz/mesh_fesom2.0/cavity_72k/"
                    nproc: 288
                    whichEVP: 0
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            PI_ICEv2:
                    nx: 132273
                    whichEVP: 0
                    alpha_evp: 250          # constant that control numerical stability of mEVP.
                    beta_evp: 250           # constant that control numerical stability of mEVP.
            D3:
                    nx: 3160340
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            orca25:
                    nx: 912469
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            DART:
                    nx: 3160340
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            DARS:
                    nx: 3160340
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            DARS2:
                    nx: 3146761
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            ROS2:
                    nx: 26306560
                    whichEVP: 1
                    alpha_evp: 900          # constant that control numerical stability of mEVP.
                    beta_evp: 900           # constant that control numerical stability of mEVP.
            HR:
                    nx: 1306775
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            jane:
                    nx: 33348172
                    whichEVP: 1
                    alpha_evp: 900          # constant that control numerical stability of mEVP.
                    beta_evp: 900           # constant that control numerical stability of mEVP.
            jack:
                    nx: 30041537
                    whichEVP: 1
                    alpha_evp: 900          # constant that control numerical stability of mEVP.
                    beta_evp: 900           # constant that control numerical stability of mEVP.
            palk:
                    nx: 1724005
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.
            next:
                    nx: 12952215
                    whichEVP: 1
                    alpha_evp: 800          # constant that control numerical stability of mEVP.
                    beta_evp: 800           # constant that control numerical stability of mEVP.

            SO3:
                    nx: 11087062
                    whichEVP: 1
                    alpha_evp: 800          # constant that control numerical stability of mEVP.
                    beta_evp: 800           # constant that control numerical stability of mEVP.
            Arc01_fesom2:
                    nx: 753179
                    whichEVP: 1
                    alpha_evp: 500          # constant that control numerical stability of mEVP.
                    beta_evp: 500           # constant that control numerical stability of mEVP.


    restart_in_files:
            par_oce_restart: par_oce_restart
            par_ice_restart: par_ice_restart

    restart_in_in_work:
            par_oce_restart: fesom.${parent_date!syear}.oce.restart/*.nc
            par_ice_restart: fesom.${parent_date!syear}.ice.restart/*.nc
            fesom_raw_restart_info: fesom_raw_restart/*.info
            fesom_raw_restart: fesom_raw_restart/np${nproc}/*.dump
            fesom_bin_restart_info: fesom_bin_restart/*.info
            fesom_bin_restart: fesom_bin_restart/np${nproc}/*
            wiso_restart: fesom.${parent_date!syear}.wiso.restart.nc
            icb_restart: iceberg.restart #.${parent_date!syear!month}
            icb_restart_ISM: iceberg.restart.ISM
    restart_in_sources:
            par_oce_restart: fesom.${parent_date!syear}.oce.restart/*.nc
            par_ice_restart: fesom.${parent_date!syear}.ice.restart/*.nc
            fesom_raw_restart_info: fesom_raw_restart/*.info
            fesom_raw_restart: fesom_raw_restart/np${nproc}/*.dump
            fesom_bin_restart_info: fesom_bin_restart/*.info
            fesom_bin_restart: fesom_bin_restart/np${nproc}/*
            wiso_restart: fesom.${parent_date!syear}.wiso.restart.nc
            icb_restart: iceberg.restart #.${parent_date!syear!month}
            icb_restart_ISM: iceberg.restart.ISM

    restart_out_files:
            par_oce_restart: par_oce_restart
            par_ice_restart: par_ice_restart
            fesom_raw_restart_info: fesom_raw_restart_info
            fesom_raw_restart: fesom_raw_restart
            fesom_bin_restart_info: fesom_bin_restart_info
            fesom_bin_restart: fesom_bin_restart

    restart_out_in_work:
            par_oce_restart: fesom.${end_date!syear}.oce.restart/*.nc
            par_ice_restart: fesom.${end_date!syear}.ice.restart/*.nc
            fesom_raw_restart_info: fesom_raw_restart/*.info
            fesom_raw_restart: fesom_raw_restart/np${nproc}/*.dump
            fesom_raw_restart_tar: fesom_raw_restart.tar.*
            fesom_bin_restart_info: fesom_bin_restart/*.info
            fesom_bin_restart: fesom_bin_restart/np${nproc}/*
            fesom_bin_restart_tar: fesom_bin_restart.tar.*
            wiso_restart: fesom.${end_date!syear}.wiso.restart.nc
            icb_restart: iceberg.restart #.${parent_date!syear}
            icb_restart_ISM: iceberg.restart.ISM
    restart_out_sources:
            par_oce_restart: fesom.${end_date!syear}.oce.restart/*.nc
            par_ice_restart: fesom.${end_date!syear}.ice.restart/*.nc
            fesom_raw_restart_info: fesom_raw_restart/*.info
            fesom_raw_restart: fesom_raw_restart/np${nproc}/*.dump
            fesom_raw_restart_tar: fesom_raw_restart.tar.*
            fesom_bin_restart_info: fesom_bin_restart/*.info
            fesom_bin_restart: fesom_bin_restart/np${nproc}/*
            fesom_bin_restart_tar: fesom_bin_restart.tar.*
            wiso_restart: fesom.${end_date!syear}.wiso.restart.nc
            icb_restart: iceberg.restart #.${parent_date!syear}
            icb_restart_ISM: iceberg.restart.ISM

    outdata_sources:
            fesom: "*.fesom.*.nc"
            fesom_xios: "*.fesom_${start_date!syear}-${end_date!syear}.nc"
            fesom_reg_xios: "*.fesom.reg_${start_date!syear}-${end_date!syear}.nc"
    outdata_targets:
            fesom: "*.fesom.*.nc"
            fesom_xios: "*.fesom.${start_date!syear}.nc"
            fesom_reg_xios: "*.fesom.gr.${start_date!syear}.nc"

    choose_with_icb:
            True:
                required_plugins:
                    - "git+https://github.com/esm-tools-plugins/fesom_icb_pism"

                prepcompute_recipe:
                - "compile_model"
                - "_show_simulation_info"
                - "create_new_files"
                - "create_empty_folders"
                - "prepare_coupler_files"
                - "assemble"
                - "log_used_files"
                - "wait_for_iterative_coupling"
                - "prep_icebergs"                       # Plugin
                - "copy_files_to_thisrun"
                - "modify_namelists"
                - "apply_iceberg_calving_to_namelists"  # Plugin
                - "modify_files"
                - "copy_files_to_work"
                - "report_missing_files"
                - "compute_and_log_file_checksums"
                - "_write_finalized_config"
                - "database_entry"

                use_icebergs: True                 # turns on icebergs
                use_icesheet_coupling: True        # initializes new icebergs every restart
                update_icebergs: True

                icb_inputs: [longitude,latitude,length,height,scaling,felem]

                add_restart_in_files:
                        icb_restart: icb_restart
                        icb_restart_ISM: icb_restart_ISM

                add_restart_out_files:
                        icb_restart: icb_restart
                        icb_restart_ISM: icb_restart_ISM

                add_outdata_targets:
                        buoys_track: "buoys_track.nc_${run_datestamp}"

                add_outdata_sources:
                        buoys_track: "buoys_track.nc"

                choose_general.iterative_coupling:
                        True:
                                choose_general.chunk_number:
                                        1:
                                                disch_file: "${ini_disch_file}"
                                        "*":
                                                disch_file: "${general.experiment_couple_dir}/latest_discharge.nc"
                        '*':
                                use_landice_water: False

                choose_use_icesheet_coupling:
                        true:
                                choose_general.run_number:
                                        1:
                                                iceberg_dir: "${ini_iceberg_dir}"
                                        "*":
                                                iceberg_dir: "${general.experiment_couple_dir}"

                                add_input_files:
                                        num_non_melted_icb_file: "num_non_melted_icb_file"

                        "*":
                                iceberg_dir: "${ini_iceberg_dir}"

                choose_update_icebergs:
                        true:
                                add_input_sources:
                                        "[[icb_inputs-->ICB_INPUT]]": ${iceberg_dir}/icb_ICB_INPUT.dat
                                        num_non_melted_icb_file: "${iceberg_dir}/num_non_melted_icb_file"

                        false:
                                add_input_sources:
                                        "[[icb_inputs-->ICB_INPUT]]": ${iceberg_dir}/icb_ICB_INPUT.dat_@YEAR@0101-@YEAR@1231
                                        num_non_melted_icb_file: "${iceberg_dir}/num_non_melted_icb_file_@YEAR@0101-@YEAR@1231"

                add_input_in_work:
                        latitude: "icb_latitude.dat"
                        longitude: "icb_longitude.dat"
                        length: "icb_length.dat"
                        height: "icb_height.dat"
                        scaling: "icb_scaling.dat"
                        felem: "icb_felem.dat"
                        num_non_melted_icb_file: "num_non_melted_icb_file"

                add_input_files:
                        latitude: "latitude"
                        longitude: "longitude"
                        length: "length"
                        height: "height"
                        scaling: "scaling"
                        felem: "felem"
                        #num_non_melted_icb_file: "num_non_melted_icb_file"

    log_files:
            clock: clock
            mesh_diag: mesh_diag

    log_in_work:
            clock: fesom.clock
            mesh_diag: fesom.mesh.diag.nc

    log_sources:
            clock: fesom.clock
            mesh_diag: fesom.mesh.diag.nc

    file_movements:
            fesom_raw_restart_in:
                    all_directions: move
            fesom_raw_restart_out:
                    all_directions: move
            fesom_raw_restart_info_in:
                    all_directions: move
            fesom_raw_restart_info_out:
                    all_directions: move
            fesom_raw_restart_tar_out:
                    all_directions: move
            fesom_bin_restart_in:
                    all_directions: move
            fesom_bin_restart_out:
                    all_directions: move
            fesom_bin_restart_info_in:
                    all_directions: move
            fesom_bin_restart_info_out:
                    all_directions: move
            fesom_bin_restart_tar_out:
                    all_directions: move

    choose_tar_binary_restarts:
        True:
            add_restart_out_files:
                fesom_raw_restart_tar: fesom_raw_restart_tar

    # Is it a branchoff experiment?
    branchoff: "$(( ${lresume} and ${general.run_number}==1 ))"
    choose_branchoff:
            # Makes sure the <units>new in the namelist make an earlier date than that of
            # of the clock to avoid cold starts for branching off experiments
            true:
                    daynew: "${startday}"
                    yearnew: "$(( ${initial_date!syear} - 1 ))"
            false:
                    daynew: "${initial_date!sdoy}"
                    yearnew: "${initial_date!syear}"
                    add_restart_in_files:
                            fesom_raw_restart_info: fesom_raw_restart_info
                            fesom_raw_restart: fesom_raw_restart
                            fesom_bin_restart_info: fesom_bin_restart_info
                            fesom_bin_restart: fesom_bin_restart



    namelist_changes:
            namelist.config:
                    clockinit:
                            daynew: "${daynew}"
                            yearnew: "${yearnew}"
                    calendar:
                            include_fleapyear: "${leapyear}"
                    paths:
                            MeshPath: "${mesh_dir}"
                            ClimateDataPath: "${climate_data_dir}"
                            ResultPath: "${work_dir}"
                    timestep:
                            step_per_day: "${steps_per_day}"
                            run_length: "${restart_rate}"
                            run_length_unit: "${restart_unit}"
                    restart_log:
                            restart_length: "${restart_rate}"
                            restart_length_unit: "${restart_unit}"
                    inout:
                            restartflag: "${restart_flag}"
                            output_length: "${restart_rate}"
                            output_length_unit: "${restart_unit}"
                            restart_length: "${restart_rate}"
                    run_config:
                            lwiso: "${with_wiso}"
                    icebergs:
                            use_icebergs: "${use_icebergs}"
                            use_icesheet_coupling: "${use_icesheet_coupling}"
                            steps_per_ib_step: 8


            namelist.forcing:

                    forcing_exchange_coeff:
                            Ce_atm_oce: ${Ce_atm_oce}
                            Ch_atm_oce: ${Ch_atm_oce}
                            Cd_atm_oce: ${Cd_atm_oce}
                            Ce_atm_ice: ${Ce_atm_ice}
                            Ch_atm_ice: ${Ch_atm_ice}
                            Cd_atm_ice: ${Cd_atm_ice}

                    forcing_bulk:
                            AOMIP_drag_coeff: ${AOMIP_drag_coeff}
                            ncar_bulk_formulae: ${ncar_bulk_formulae}
                            ncar_bulk_z_wind: ${ncar_bulk_z_wind}
                            ncar_bulk_z_tair: ${ncar_bulk_z_tair}
                            ncar_bulk_z_shum: ${ncar_bulk_z_shum}

                    nam_sbc:
                            nm_xwind_file: "${forcing_data_dir}/${forcing_folder}/${xwind_prefix}"
                            nm_ywind_file: "${forcing_data_dir}/${forcing_folder}/${ywind_prefix}"
                            nm_humi_file: "${forcing_data_dir}/${forcing_folder}/${humi_prefix}"
                            nm_qsr_file: "${forcing_data_dir}/${forcing_folder}/${qsr_prefix}"
                            nm_qlw_file: "${forcing_data_dir}/${forcing_folder}/${qlw_prefix}"
                            nm_tair_file: "${forcing_data_dir}/${forcing_folder}/${tair_prefix}"
                            nm_prec_file: "${forcing_data_dir}/${forcing_folder}/${prec_prefix}"
                            nm_snow_file: "${forcing_data_dir}/${forcing_folder}/${snow_prefix}"
                            nm_mslp_file: "${forcing_data_dir}/${forcing_folder}/${mslp_prefix}"

                            nm_xwind_var: ${nm_xwind_var}
                            nm_ywind_var: ${nm_ywind_var}
                            nm_humi_var: ${nm_humi_var}
                            nm_qsr_var: ${nm_qsr_var}
                            nm_qlw_var: ${nm_qlw_var}
                            nm_tair_var: ${nm_tair_var}
                            nm_prec_var: ${nm_prec_var}
                            nm_snow_var: ${nm_snow_var}
                            nm_mslp_var: ${nm_mslp_var}

                            nm_nc_iyear: ${nm_nc_iyear}
                            nm_nc_imm: ${nm_nc_imm}
                            nm_nc_idd: ${nm_nc_idd}
                            nm_nc_freq: ${nm_nc_freq}
                            nm_nc_tmid: ${nm_nc_tmid}
                            l_xwind: ${l_xwind}
                            l_ywind: ${l_ywind}
                            l_humi: ${l_humi}
                            l_qsr: ${l_qsr}
                            l_qlw: ${l_qlw}
                            l_tair: ${l_tair}
                            l_prec: ${l_prec}
                            l_mslp: ${l_mslp}
                            l_cloud: ${l_cloud}
                            l_snow: ${l_snow}

                            nm_runoff_file: "${forcing_data_dir}/${forcing_folder}/${runoff_file}"
                            nm_sss_data_file: "${forcing_data_dir}/${forcing_folder}/${sss_data_file}"

                            runoff_data_source: ${runoff_data_source}
                            sss_data_source: ${sss_data_source}
            namelist.ice:
                    ice_dyn:
                            whichEVP: ${whichEVP}
                            alpha_evp: ${alpha_evp}
                            beta_evp: ${beta_evp}

    with_cavity: false
    choose_with_cavity:
            true:
                    add_namelist_changes:
                            namelist.config:
                                    run_config:
                                            use_cavity: true

    with_xios: false
    # Opt-in switch: when true, route FESOM XIOS file_def/field_def to the
    # CMIP7-style XMLs (many variables, multiple frequencies). Default off:
    # upstream-namelist.io-style minimal monthly output.
    cmip7_cmor_output: false

    # REcoM/BGC XIOS output gates consumed by file_def_fesom.xml.j2. These mirror
    # the REcoM &parecomsetup logicals (enable_3zoo2det/enable_coccos) and the
    # per-tracer ltra_diag switch, so the BGC <file> blocks are only enabled when
    # the corresponding tracers/diagnostics actually exist (avoids fill-only files).
    # Defaults off; awiesm3 sets the parecomsetup flags from recom_setting.
    recom_enable_3zoo2det: false
    recom_enable_coccos: false
    recom_ltra_diag: false
    # When true, add regridded (regular lat/lon) output for all 2D fields
    # alongside the native unstructured output. Each regrid file is produced
    # at the same frequency as its native counterpart (daily for fesom_1d
    # fields, monthly for fesom_1mo 2D fields). CMIP7 file_def only.
    # Requires xios.fesom_regular_res_lon/lat and xios.interpolation_order.
    # Default ON for CMIP7: validated <1% wall-time penalty (HR Test_20 vs
    # baseline) and <1 GB/year disk overhead at 0.5deg.
    regrid_surface_output: true
    # When true, also regrid 3D fields (temp, salt, unod, vnod, w, bolus_*,
    # N2, Kv, u, v, *temp, *salt, Av, dMOC density-coord, ...). Default ON
    # for CMIP7: HR Test_21 (vs Test_20) measured +0.4% wall time and +8 GB
    # / simulated year of additional disk volume — essentially free thanks
    # to XIOS server-rank async IO. Set to false only for diagnostics-style
    # runs where the 3D regridded set isn't wanted.
    regrid_3d_output: true
    choose_with_xios:
            true:
                    # XIOS writes "<var>.fesom_<ystart>-<yend>.nc" into the work
                    # dir. fesom_xios and fesom_reg_xios file labels account for
                    # this different name pattern and ensures that the files are
                    # renamed when copied/moved to the outdata dir with the legacy
                    # pattern.
                    add_outdata_files:
                            fesom_xios: fesom_xios
                            fesom_reg_xios: fesom_reg_xios

    use_landice_water: False
    choose_general.iterative_coupling:
            true:
                    add_output_targets:
                            fesom: "*.fesom.*.nc"

                    choose_general.chunk_number:
                            1:
                                    use_landice_water: False
                            "*":
                                    use_landice_water: True

                    fwf_path: "${general.experiment_couple_dir}"

                    add_namelist_changes:
                                namelist.forcing:
                                        land_ice:
                                                use_landice_water: "${use_landice_water}"
                                                landice_start_mon: 1
                                                landice_end_mon: 12
                                                fwf_path: "${fwf_path}"
            '*':
                    use_landice_water: False

    lasttime: "$(( 86400 - ${time_step}))"
    currentday: "${current_date!sdoy}"
    choose_currentday:
            "1":
                    starttime: "0.0000000000000"
                    startday: 1
            '*':
                    starttime: "86400.0000000000"
                    startday: "$(( ${start_date!sdoy} - 1 ))"

    choose_lresume:
            false:
                    create_config:
                            fesom.clock:
                                    - "<--append-- 0.0000000000000 ${initial_date!sdoy} ${initial_date!syear}"
                                    - "<--append-- 0.0000000000000 ${initial_date!sdoy} ${initial_date!syear}"
            true:
                    create_config:
                            fesom.clock:
                                    - "<--append-- ${lasttime} ${parent_date!sdoy} ${parent_date!syear}"
                                    - "<--append-- ${starttime} ${startday} ${start_date!syear}"

    bin_in_work:
            bin: "${executable}"
            lib: "lib/fesom/libfesom.so"

    bin_sources:
            bin: "${bin_dir}/${comp_executable}"
            lib: "${fesom.model_dir}/build/lib/libfesom.so"



    config_files:
            config:  config
            cvmix:   cvmix
            dyn:     dyn
            forcing_nml: forcing_nml
            ice:     ice
            icepack: icepack
            io:      io
            oce:     oce
            tra:     tra
            transit: transit

    config_sources:
            config:  "${namelist_dir}/namelist.config"
            cvmix:   "${namelist_dir}/namelist.cvmix"
            dyn:     "${namelist_dir}/namelist.dyn"
            forcing_nml: "${namelist_dir}/namelist.forcing"
            ice:     "${namelist_dir}/namelist.ice"
            icepack: "${namelist_dir}/namelist.icepack"
            io:      "${namelist_dir}/namelist.io"
            oce:     "${namelist_dir}/namelist.oce"
            tra:     "${namelist_dir}/namelist.tra"
            transit: "${namelist_dir}/namelist.transit"

    config_in_work:
            config:  "namelist.config"
            cvmix:   "namelist.cvmix"
            dyn:     "namelist.dyn"
            forcing_nml: "namelist.forcing"
            ice:     "namelist.ice"
            icepack: "namelist.icepack"
            io:      "namelist.io"
            oce:     "namelist.oce"
            tra:     "namelist.tra"
            transit: "namelist.transit"

    coupling_fields:
            sst_feom:
                    grid: feom
            sit_feom:
                    grid: feom
            sie_feom:
                    grid: feom
            snt_feom:
                    grid: feom
            u_feom:
                    grid: feom
            v_feom:
                    grid: feom
            FCO2_feom:
                    grid: feom
            taux_oce:
                    grid: feom
            tauy_oce:
                    grid: feom
            taux_ico:
                    grid: feom
            tauy_ico:
                    grid: feom
            prec_oce:
                    grid: feom
            snow_oce:
                    grid: feom
            evap_oce:
                    grid: feom
            subl_oce:
                    grid: feom
            heat_oce:
                    grid: feom
            heat_ico:
                    grid: feom
            heat_swo:
                    grid: feom
            hydr_oce:
                    grid: feom
            calv_oce:
                    grid: feom
            enth_oce:
                    grid: feom
            u10w_oce:
                    grid: feom
            v10w_oce:
                    grid: feom
            XCO2_oce:
                    grid: feom


    wiso_fields:
            - o18w_oce
            - hdow_oce
            - o16w_oce
            - o18i_oce
            - hdoi_oce
            - o16i_oce
            - w1_oce
            - w2_oce
            - w3_oce
            - i1_oce
            - i2_oce
            - i3_oce


    choose_with_wiso:
            True:
                    add_restart_in_files:
                            wiso_restart: wiso_restart
                    add_restart_out_files:
                            wiso_restart: wiso_restart
                    add_coupling_fields:
                            "[[wiso_fields-->FIELD]]":
                                    grid: feom


    grids:
            feom:
                    name: feom
                    nx: ${nx}
                    ny: 1
                    oasis_grid_type: "U"
                    oyac_grid_type: "GC"
                    oyac_io_per_node: 4
                    number_of_overlapping_points: 0 # oasis P-value


    further_reading:
            - fesom/fesom.forcing.yaml
            - fesom/fesom.env.yaml
            - fesom/fesom.tripyview.yaml

    # ------------------------
    # RECIPE
    # ------------------------
    tidy_recipe:
    - "tidy_coupler"
    - "tar_binary_restarts"                 # Plugin
    - "assemble"
    - "check_for_unknown_files"
    - "log_used_files"
