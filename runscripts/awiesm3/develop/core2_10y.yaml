general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: "ba0989"
    compute_time: "08:00:00"
    initial_date: "1900-01-01"
    final_date: "1910-01-01"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 10

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 10
    restart_unit: "y"
    restart_first: 10
    lresume: false
    time_step: 1800
    nproc: 768 #originally 512 but worked with 1152
    omp_num_threads: 2 # originally 4 but worked with 1
    tar_binary_restarts: true

lpj_guess:
    nproc: 8 # originally 16
    omp_num_threads: 8
    lresume: false    
    mip: "cmip7"

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                LCMIP6: False
                LCMIP7: True
                CMIP7DATADIR: '/work/bb1469/a270089/input/oifs-48r1/cmip-data/'
                NCMIPFIXYR: 1850
                SCENARIONAME: 'SSP2-4.5'
                LMACV2SP: True
                LMACV2SP_CCNF: True
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8

oasis3mct:
    use_lucia: true #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600
    norestart: T #Do i restart from vegin or not?

xios:
    with_model:
        - oifs
        - fesom
    nproc: 32
    omp_num_threads: 8
    xml_dir: /home/a/a270092/esm_tools/namelists/oifs/48r1/xios/cmip7/
    fesom_xml_dir: ${fesom.model_dir}/docs/xios_xml
    add_config_files:
        context_fesom:    context_fesom
        axis_def_fesom:   axis_def_fesom
        domain_def_fesom: domain_def_fesom
        grid_def_fesom:   grid_def_fesom
        field_def_fesom:  field_def_fesom
        file_def_fesom:   file_def_fesom
    config_sources:
        # OIFS overrides (CMIP7 templates)
        file_def:  ${xml_dir}/file_def_oifs_cmip7_spinup.xml.j2
        field_def: ${xml_dir}/field_def_cmip7.xml.j2
        # Merged AWI-ESM3 iodef referencing both context_ifs.xml and context_fesom.xml
        io_def: ${fesom_xml_dir}/iodef.xml
        # FESOM per-component XMLs (unique names so they don't collide with OIFS)
        context_fesom:    ${fesom_xml_dir}/context_fesom.xml
        axis_def_fesom:   ${fesom_xml_dir}/axis_def_fesom.xml
        domain_def_fesom: ${fesom_xml_dir}/domain_def_fesom.xml
        grid_def_fesom:   ${fesom_xml_dir}/grid_def_fesom.xml
        field_def_fesom:  ${fesom_xml_dir}/field_def_fesom.xml
        file_def_fesom:   ${fesom_xml_dir}/file_def_fesom.xml
    config_in_work:
        context_fesom:    context_fesom.xml
        axis_def_fesom:   axis_def_fesom.xml
        domain_def_fesom: domain_def_fesom.xml
        grid_def_fesom:   grid_def_fesom.xml
        field_def_fesom:  field_def_fesom.xml
        file_def_fesom:   file_def_fesom.xml
