# ICON climate and weather forecast model configuration 
# As I (seb-wahl) keep getting confused with the different ICON versions 
# here's my personal summary
#    * ICON-AES: ICON version with ECHAM physics (AES=Atmosphere in the Earth System)
#    * ICON-LEM: Limited area model version, seems to be deprecated
#    * ICON-NWP: NWP version used at DWD
#    * ICON-SEAMLESS: „climate“ version based on NWP physics.
#    * ICON RUBY: ICON-ESM coupled to ICON-O with ECHAM physics, published in Jungclaus, J. H., Lorenz, S. J., Schmidt, H., Gutjahr, O., Haak, H., Mehlmann, C., … Hanke, M. (2021). The ICON Earth System Model Version 1.0. Journal of Advances in Modeling Earth Systems. https://doi.org/10.1002/essoar.10507989.1 
#    * ICON SAPPHIRE: High resolution version pushed at MPI, see Hohenegger, C., Korn, P., Linardakis, L., Redler, R., Schnur, R., Adamidis, P., … Stevens, B. (2023). ICON-Sapphire: Simulating the components of the Earth system and their interactions at kilometer and subkilometer scales. Geoscientific Model Development, 16(2), 779–811. https://doi.org/10.5194/gmd-16-779-2023 for details
#    * ICON-APE - ICON Aquaplanet Experiments
#
icon:

   model: icon 
   version: 2025.10-public 

   metadata:
        Institute: MPI-Met 
        Description: The ICON atmosphere model 
        Authors: Marco Giorgetta (marco.giorgetta@mpimet.mpg.de), Peter Korn, Christian Reick, Reinhard Budich
        Publications:
                - 'ICON-A, the Atmosphere Component of the ICON Earth System Model: I. Model Description <https://doi.org/10.1029/2017MS001242>'
        License:
           ICON is now open source, see https://www.icon-model.org 

   clean_command: ${defaults.clean_command}
   executable: icon   
   # TODO: decide whether we wan't to treat jsbach and hd
   # as separate models as we do it with ECHAM6
   #include_models:
   #- jsbach
   #- hdmodel
   #
   scenario: 'PI-CTRL'
   monitoring: False 

   compile_infos:
      choose_version:
         2025.04-public-sl:
            # TODO: update once I know the branch from Sveta
            branch: release-2025.04-public
         2025.10-public:
            branch: release-${icon.version} 


      # default settings 
      git-repository: https://gitlab.dkrz.de/icon/icon-model.git 
      repo_options: --recursive
      branch: release-${icon.version} 
      destination: icon
      install_bins: build/bin/icon
      comp_command: 'mkdir -p build ; cd build ; 
         $ICON_CONFIGURE_COMMAND ICON_BUNDLED_CFLAGS="$ICON_BUNDLED_CFLAGS -fpic" ICON_BUNDLED_FCFLAGS="$ICON_BUNDLED_FCFLAGS -fpic" ;
         make -j32' 

   file_movements:
      input:
         all_directions: link
      forcing:
         all_directions: link
      restart_in:
         all_directions: link
      restart_out:
         all_directions: move
      outdata:
         all_directions: move
      unknown:
         all_directions: move

   input_dir: ${computer.input_dir} 
   # the ICON-FESOM input directory on levante does not contain the extpar file
   # with modis/cdnc data for the modis tuning, so we need to read it from a 
   # separate directory on levante
   extpar_file: ${computer.extpar_file} 
   ozone_dir: ${computer.ozone_dir} 
   aerosol_dir: ${computer.aerosol_dir} 
   jsbach_ic_dir: ${computer.jsbach_ic_dir} 
   jsbach_forcing_dir: ${computer.jsbach_forcing_dir} 
   # format start_date/end_date according to ISO_8601 standard used by ICON
   start_rsttime: ${parent_date!syear!smonth!sday}T${parent_date!shour!sminute!ssecond}Z
   #start_rsttime: ${start_date!syear!smonth!sday}T${start_date!shour!sminute!ssecond}Z
   end_rsttime: ${next_date!syear!smonth!sday}T${next_date!shour!sminute!ssecond}Z
   # By default do a cold start
   lresume: false

   # parallelization
   nproma: 8 
   omp_num_threads: 1

   # grid settings
   grid_id: '0012' 
   grid_label: G
   resolution: R02B04
   grid_name: icon_grid_${grid_id}_${resolution}_${grid_label}
   choose_resolution:
       'R02B04':
           #grid_id: '0012' 
           resolution_lc: r2b4
       'R02B05':
           #grid_id: '0030' 
           resolution_lc: r2b5

   # time step (4min), ICON uses the http://en.wikipedia.org/wiki/ISO_8601 standard
   # for time stamps and time periods
   dtime: 900 
   #radTimeStep: PT60M

   # restart intervals
   checkpoint_interval: P01Y
   restart_interval: P01Y

   # output intervals
   output_interval: P01M
   # always use a file interval >> restart_interval as a new output file is 
   # created upon each restart
   file_interval: P50Y 
   # instant ("") or mean/max/min/acc over output_interval
   # TODO: check if precip is still accumulated or really averaged
   # TODO: does nothing at the moment
   operation: mean
   #
   # JSBACH settings
   #
   jsbach_with_hd: yes
   jsbach_year: 1850 # Trang uses 2000 but I don't have the data on levante
   jsbach_usecase: jsbach_pfts    # jsbach_lite or jsbach_pfts
   lcarbon: false

   # 7 = GEMS ozone climatology, no input files needed 
   # 5 = default prescribed ozone
   with_ozone: 7
   # 2 = solar radiation from file, for piControl a file where the same year is repeated
   #     is used
   solarforcing: 2
   #
   # namelists and namelist settings/changes
   #
   namelist_dir: "${general.esm_namelist_dir}/icon/${icon.version}/${resolution}"
   namelists:
       - NAMELIST_atm
       - NAMELIST_lnd
       - icon_master.namelist

   config_sources:
      'icon_master.namelist': ${namelist_dir}/icon_master.namelist 
      NAMELIST_atm: ${namelist_dir}/NAMELIST_atm   
      NAMELIST_lnd: ${namelist_dir}/NAMELIST_lnd   

   # https://esm-tools.readthedocs.io/en/latest/yaml.html#changing-namelists
   namelist_changes:
      'icon_master.namelist': 
         master_nml:
            lrestart: ${lresume}
         master_time_control_nml:
            experimentStartDate: ${start_date}
            experimentStopDate: ${next_date}
            restartTimeIntval: ${restart_interval} 
            checkpointTimeIntval: ${checkpoint_interval}

      NAMELIST_atm:
         parallel_nml:
            nproma: ${nproma}
         grid_nml:
            dynamics_grid_filename: icon${resolution}_DOM01.nc
         run_nml:
            dtime: ${dtime} 
            modelTimeStep: PT${dtime}S
            #msg_level: 1
            restart_filename: ${expid}_restart_atm_<rsttime>.mfr
         radiation_nml:
            ecrad_data_path: ${model_dir}/icon/externals/ecrad/data/ 
         output_nml:
            # TODO: different file names, look at f90nml issue
            # WORKAROUND is using a pre_run_command
            # output_filename: ${expid}
            output_start: ${start_date}
            output_end: ${next_date}
            # output_interval: ${output_interval}
            file_interval: ${file_interval}
            # TODO: operation = 'mean' not working at least not with
            # my set of output variables
            # operation: ${operation}
                  
      NAMELIST_lnd:
         jsb_model_nml:
            usecase: ${jsbach_usecase}
         jsb_fuel_nml:
            active: ${lcarbon}

   choose_icon.version:
       2025.04-public-sl:
          pfts: 11
       "*":
          pfts: 12 
   
   choose_jsbach_with_hd:
      yes:
         add_namelist_changes:
            NAMELIST_lnd:
               jsb_hd_nml:
                  active: true
                  routing_scheme: full
                  bc_filename: bc_land_hd.nc
                  diag_water_budget: true 
                  debug_hd: false
                  # enforce_water_budget: true  # True: stop in case of water conservation problem
         add_input_files:
             bc_land_hd: bc_land_hd

      no:
         add_namelist_changes:
            NAMELIST_lnd:
               jsb_hd_nml:
                  active: false

   # irad_aero = 18: Kinne background aerosol + volcanic aerosol in the
   #      stratosphere + MacSP V2 simple plumes for historical/scenario simulations
   # irad_aero 12: tropospheric ’Kinne’ aerosols, constant in time used in piControl setup
   # for other options see doc/Namelist_Overview.pdf in the ICON repository
   choose_scenario:
       'PI-CTRL':
           add_namelist_changes:
               NAMELIST_atm:
                   radiation_nml:
                       irad_aero: 12
                       irad_o3: ${with_ozone} 
           add_forcing_files:
               swflux: swflux_picontrol
               ozone: ozone_picontrol
               bc_land_frac: bc_land_frac_picontrol
               macv2_sp: macv2_sp
            
       'cmip7hist':
           add_namelist_changes:
               NAMELIST_atm:
                   radiation_nml:
                       irad_aero: 18
                       irad_o3: 5 # cmip7hist only works with irad_o3: 5                
                       # 3: tanh vert.prof. with vmr_ch4 at surface (def), 4: from greenhouse gas scenario
                       irad_co2: 4
                       irad_ch4: 4
                       irad_n2o: 4
                       irad_cfc11: 4
                       irad_cfc12: 4
                   ccycle_nml:
                       ccycle_config%ico2conc: 4

           add_forcing_files:
               swflux: swflux_hist
               ozone: ozone_hist
               # hist runs need the picontrol fractions
               bc_land_frac: bc_land_frac_picontrol
               bc_land_frac_hist: bc_land_frac_hist
               volc_hist: volc_hist
               macv2_sp: macv2_sp
               greenhouse_gases: greenhouse_gases

   #
   # output data settings
   #
   outdata_sources:
      # TODO: different file names, look at f90nml issue
      # workaround build with pre_run_commands
      #icon_nc: ${expid}_*_${start_rsttime}.nc
      #icon_nc: icon_*_${start_rsttime}.nc
      icon_nc: "*_${start_rsttime}.nc"
   #
   # restart settings, ICON uses multifile restarts
   #
   # all restart files are stored in a subdirectory in work at the end of a run
   #restart_in_files:
   #   restart_atm_mfr: restart_atm_mfr
   #restart_in_sources: 
   #   #restart_atm: /path/to/global/restart_atm_DOM01.nc
   #   restart_atm_mfr: ${parent_expid}_restart_atm_${start_rsttime}.mfr/*
   #restart_in_in_work:
   #    restart_atm_mfr: ${parent_expid}_restart_atm_${start_rsttime}.mfr/* 
   restart_out_sources: 
      restart_atm_mfr: ${general.expid}_restart_atm_${end_rsttime}.mfr/*
   #  restart_atm: /path/to/global/restart_atm_DOM01.nc
   #restart_out_targets: 
   #   restart_atm: /path/to/global/restart_atm_DOM01.nc
   #   restart_atm_mfr: ${expid}_restart_atm_${end_rsttime}.mfr/*

   bin_sources:
       bin_tag: ${model_dir}/bin/${executable} # This would be the normal way to do it

   log_files:
       finish: finish
       nml_icon: nml_icon
       nml_log: nml_log
       output_schedule_atmo: output_schedule_atmo
       output_schedule: output_schedule

   log_sources:
       finish: finish.status
       nml_icon: NAMELIST_ICON_output_atm
       nml_log: nml.atmo.log
       output_schedule_atmo: output_schedule_atmo.txt
       output_schedule: output_schedule.ps

   log_in_work:
       finish: finish.status
       nml_icon: NAMELIST_ICON_output_atm
       nml_log: nml.atmo.log
       output_schedule_atmo: output_schedule_atmo.txt
       output_schedule: output_schedule.ps

   #
   # input and forcing files
   # 

   choose_lresume:
      true:
         choose_general.run_number:
            1:
               parent_date: ${ini_parent_date} # this is the default anyways
            "*":
               parent_date: ${start_date} # restarts are in a folder matching the start date  

      false:
         # JSBACH init?
         init_from_ifs: true
         add_input_files:
            ifs2icon: ifs2icon

   input_files:
      cloud_optics: cloud_optics
      radrrtm: radrrtm
      radsrtm: radsrtm
      socrates_droplet_rrtm: socrates_droplet_rrtm
      fu_ice_rrtm: fu_ice_rrtm
      mcica_gamma: mcica_gamma
      #vardict: vardict
      atmo_dyn_grid: atmo_dyn_grid 
      atmo_dyn_grid_grfinfo: atmo_dyn_grid_grfinfo 
      extpar: extpar
      sst: sst
      sic: sic
      bc_land_sso: bc_land_sso
      bc_land_phys: bc_land_phys
      bc_land_soil: bc_land_soil
      lctlib: lctlib
      ic_land_soil: ic_land_soil
      kinne_sw: kinne_sw
      kinne_lw: kinne_lw
      kinne_fin: kinne_fin

   forcing_sources:

      # CMIP6 forcing
      #bc_aeropt_kinne_sw_b14_fin_yearly: 
      #   "${aerosol_dir}/bc_aeropt_kinne_sw_b14_fin_1854.nc":
      #      to: 1844
      #   "${aerosol_dir}/bc_aeropt_kinne_sw_b14_fin_@YEAR@.nc":
      #      from: 1845
      #      to: 2014
      #   # TODO: do proper scenario setup
      #   "${aerosol_dir}/bc_aeropt_kinne_sw_b14_fin_2014.nc":
      #       from: 2014

      # in the current setup, bc_land_frac is constant 
      bc_land_frac_picontrol:
         "${jsbach_forcing_dir}/bc_land_frac_${pfts}pfts_1850.nc"

      # TODO: remove tmp changes once land data is available
      # for both r2b4 and r2b5
      bc_land_frac_hist:
         "${jsbach_forcing_dir}/bc_land_frac_${pfts}pfts_1850.nc":
            to: 1850
         "${jsbach_forcing_dir}/bc_land_frac_${pfts}pfts_@YEAR@.nc":
            from: 1851
            to: 2023
         # TODO: do proper scenario setup
         "${jsbach_forcing_dir}/bc_land_frac_${pfts}pfts_2024.nc":
             from: 2024
      
      # solar forcing  
      swflux_picontrol: ${input_dir}/common/solar_radiation/swflux_14band_cmip7_picontrol_v4-6_999-4000.nc
      swflux_hist: ${input_dir}/common/solar_radiation/swflux_14band_cmip7_picontrol_v4-6_999-4000.nc

      # ozone forcing
      ozone_picontrol: ${ozone_dir}/bc_ozone_cmip7_picontrol_v1-2_1850.nc
      # TODO: remove tmp changes once ozone data is available
      # for both r2b4 and r2b5
      ozone_hist: 
         "${ozone_dir}/bc_ozone_cmip7_picontrol_v1-2_1850.nc":
            to: 1850
         "${ozone_dir}/bc_ozone_cmip7_historical_v2-0_@YEAR@.nc":
            from: 1851
            to: 2023
         # TODO: do proper scenario setup
         "${ozone_dir}/bc_ozone_cmip7_historical_v2-0_2023.nc":
            from: 2024
         
      # CMIP7 volcano aerosol forcing
      volc_hist: 
         "${input_dir}/common/aerosol_volcanic_cmip7/bc_aeropt_cmip7_volc_lw_b16_sw_b14_1750.nc":
            to: 1750
         "${input_dir}/common/aerosol_volcanic_cmip7/bc_aeropt_cmip7_volc_lw_b16_sw_b14_@YEAR@.nc":
            from: 1751
            to: 2023
      #   # TODO: do proper scenario setup
         "${input_dir}/common/aerosol_volcanic_cmip7/bc_aeropt_cmip7_volc_lw_b16_sw_b14_2023.nc":
            from: 2024

      macv2_sp: ${input_dir}/common/MACv2_simple_plumes_merged/SPv2.1_1850-2023_CMIP7.nc
      greenhouse_gases: ${input_dir}/common/greenhouse_gases/greenhouse_gases_cmip7_0001-2023.nc

      # SST / SEA ICE 
      #sst_ice: 
      #   "${input_dir}/buildbot_data/nwp/Checksuite_data/data_bbtest19/*_1979_*DOM01.nc"
      #      to: 1979
      #   "${input_dir}/buildbot_data/nwp/Checksuite_data/data_bbtest19/*_@YEAR@_*DOM01.nc"
      #      from: 1979
      #      to: 2014

   input_sources:
      # input files distributed with the source code
      cloud_optics: ${model_dir}/icon/data/ECHAM6_CldOptProps.nc
      radrrtm: ${model_dir}/icon/externals/ecrad/data/RADRRTM
      radsrtm: ${model_dir}/icon/externals/ecrad/data/RADSRTM
      socrates_droplet_rrtm: ${model_dir}/icon/externals/ecrad/data/socrates_droplet_scattering_rrtm.nc
      fu_ice_rrtm: ${model_dir}/icon/externals/ecrad/data/fu_ice_scattering_rrtm.nc
      mcica_gamma: ${model_dir}/icon/externals/ecrad/data/mcica_gamma.nc
      # "dictionary" describing the translation of user-defined shortnames with names used
      # in ICON's "add_var" call
      #vardict: ${model_dir}/icon/run/dict.iconam.mpim
      dictlatbc: ${model_dir}/icon/run/dict.latbc

      # ICON grid description file
      #atmo_dyn_grid: ${input_dir}/grids/${grid_name}.nc 
      #atmo_dyn_grid_grfinfo: ${input_dir}/grids/${grid_name}-grfinfo.nc 
      atmo_dyn_grid: ${input_dir}/${icon.grid_id}/${grid_name}.nc 
      atmo_dyn_grid_grfinfo: ${input_dir}/${icon.grid_id}/${grid_name}-grfinfo.nc 

      # initial conditions
      #ifs2icon: ${input_dir}/grids/private/dian/mpim/${grid_id}/initial_condition/r0001/ifs2icon_2000010100_${resolution}_${grid_label}.nc
      #extpar: ${input_dir}/grids/public/mpim/0013/nwp/icon_extpar_${grid_id}_${resolution}_${grid_label}_20180820_tiles.nc
      ifs2icon: ${input_dir}/${grid_id}/initial_conditions/r0001/ifs2icon_2000010100_${grid_id}_${resolution}_${grid_label}.nc

      extpar: ${extpar_file}  
      # greenhouse gases
      ozone_cariolle: ${input_dir}/common/greenhouse_gases/bc_ozone_cariolle.nc

      # Kinne background aerosol
      kinne_lw: ${aerosol_dir}/bc_aeropt_kinne_lw_b16_coa.nc
      kinne_sw: ${aerosol_dir}/bc_aeropt_kinne_sw_b14_coa.nc
      # sveta also links 1851 and 1852 for PI-CTRL...
      kinne_fin: ${aerosol_dir}/bc_aeropt_kinne_sw_b14_fin_1850.nc

      # SST / sea ice
      # TODO: not sure if that works.
      sic: ${input_dir}/path/to/data/CI_*_${resolution}_${grid_label}.nc
      sst: ${input_dir}/path/to/data/SST_*__${resolution}_${grid_label}.nc

      # JSBACH
      ic_land_soil: ${jsbach_ic_dir}/ic_land_soil.nc
      bc_land_sso: ${jsbach_ic_dir}/bc_land_sso.nc
      bc_land_phys: ${jsbach_ic_dir}/bc_land_phys.nc
      bc_land_soil: ${jsbach_ic_dir}/bc_land_soil.nc
      lctlib: ${model_dir}/icon/externals/jsbach/data/lctlib_nlct21.def

      # HD model 
      #bc_land_hd: ${jsbach_ic_dir}/hdpara_${resolution_lc}_0012_CORE2_sc_hfrac_s_v1.nc
      #bc_land_hd: ${input_dir}/common/hd/input/05deg/hdpara_vs1_12.nc
      bc_land_hd: ${jsbach_ic_dir}/hdpara_${resolution_lc}_${icon.grid_id}_${fesom.resolution}_sc_hfrac_s_v1.nc

   input_in_work:
      cloud_optics: ECHAM6_CldOptProps.nc
      radrrtm: radrrtm
      radsrtm: radsrtm
      socrates_droplet_rrtm: socrates_droplet_scattering_rrtm.nc
      fu_ice_rrtm: fu_ice_scattering_rrtm.nc
      mcica_gamma: mcica_gamma.nc
      dictlatbc: dict.latbc
      #vardict: vardict.txt
      extpar: extpar_icon${resolution}_DOM01.nc
      atmo_dyn_grid: icon${resolution}_DOM01.nc
      atmo_dyn_grid_grfinfo: icon${resolution}_DOM01-grfinfo.nc
      ifs2icon: ifs2icon.nc
      ic_land_soil: ic_land_soil.nc
      ozone_cariolle: cariolle_coeff.nc
      kinne_lw: bc_aeropt_kinne_lw_b16_coa.nc 
      kinne_sw: bc_aeropt_kinne_sw_b14_coa.nc 
      kinne_fin: bc_aeropt_kinne_sw_b14_fin.nc 
      sic: bc_sic.nc
      sst: bc_sst.nc
      bc_land_sso: bc_land_sso.nc
      bc_land_phys: bc_land_phys.nc
      bc_land_soil: bc_land_soil.nc
      lctlib: lctlib_nlct21.def
      bc_land_hd: bc_land_hd.nc

   forcing_in_work:
      ozone: bc_ozone_@YEAR@.nc
      swflux: bc_solar_irradiance_sw_b14.nc
      stenchikov_sw: bc_aeropt_stenchikov_lw_b16_sw_b14_@YEAR@.nc 
      volc_hist: bc_aeropt_volc_lw_b16_sw_b14_@YEAR@.nc
      macv2_sp: MACv2.0-SP_v1.nc
      bc_land_frac: bc_land_frac.nc
      bc_land_frac_hist: bc_land_frac_${pfts}pfts_@YEAR@.nc 
      bc_aeropt_kinne_sw_b14_fin_yearly: bc_aeropt_kinne_sw_b14_fin_@YEAR@.nc 
      greenhouse_gases: bc_greenhouse_gases.nc

   forcing_additional_information:
      ozone:
         - need_year_before
         - need_year_after
      volc_hist:
         - need_year_before
         - need_year_after
      bc_land_frac_hist:
         - need_year_after
         - need_2years_after

        # Postprocessing
   monitoringscript: "run_qp_driver_r2b4_icon-esm-tools.sh"
   choose_monitoring:
      True:
         workflow:
            next_run_triggered_by: tidy
            subjobs:
               icon_monitoring:
                  batch_or_shell: shell
                  order_in_cluster: concurrent
                  run_on_queue: ${computer.partitions.pp.name}
                  run_after: tidy
                  script_dir: ${computer.pool_directories.focipool}/ICON-FESOM/ICON/pyicon/tools
                  submit_to_batch_system: True
                  script: "
                      ${icon.monitoringscript} 
                      -r ${general.expid}
                      -i ${initial_date!syear}
                      -e ${end_date!syear}
                      -p ${general.base_dir}
                      "
                      #-o ${computer.pool_directories.focipool}/OBS_MONITORING/T63/
                  nproc: 1

# This section takes care of dealing with environment changes you might want to do, to
# deviated from the defaults define for the specific machine
computer:
   choose_general.execution_mode:
      compile:
         choose_computer.name:
            nesh:
               extpar_file: ""
               input_dir: "" 
               aerosol_dir: "" 
               ozone_dir: ""
               jsbach_ic_dir: "" 
               jsbach_forcing_dir: ${jsbach_ic_dir}

               iolibraries: system_libs
               compiler_mpi: intel2023_ompi415 
            levante:
               extpar_file: ""
               input_dir: "" 
               aerosol_dir: "" 
               ozone_dir: ""
               jsbach_ic_dir: "" 
               jsbach_forcing_dir: ${jsbach_ic_dir}

               iolibraries: None 
               compiler_mpi: None
               # this should work but esm_master is still stupid and can't resolve computer.name
               #comp_command: ./config/dkrz/levante.intel --enable-openmp ; make -j 16 
               #add_module_actions:
               #   - purge
               #   - load git
               #choose_compiler_mpi:
               #   intel:
               #      add_export_vars:
               #         ICON_CONFIGURE_COMMAND: "'./config/dkrz/levante.intel'"
               #   gcc:
               #      add_export_vars:
               #         ICON_CONFIGURE_COMMAND: "'./config/dkrz/levante.gcc'"
            "*":
               extpar_file: ""
               input_dir: "" 
               aerosol_dir: "" 
               ozone_dir: ""
               jsbach_ic_dir: "" 
               jsbach_forcing_dir: ${jsbach_ic_dir}
      run:
         choose_computer.name:
            levante:
               input_dir: /work/bb0519/foci_input2/ICON-FESOM/icon-xpp 
