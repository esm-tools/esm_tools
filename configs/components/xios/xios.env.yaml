computer:
    choose_general.execution_mode:
        compile:
            choose_computer.name:
                levante:
                    # `load perl` removed 2026-05-19: it defaulted to
                    # /sw/spack-levante/perl-5.34.0-mviuwj which broke
                    # XIOS's fcm (compiled against system Perl 5.26.3,
                    # "Perl lib version (5.26.3) doesn't match
                    # executable ... 5.34.0"). System /usr/bin/perl
                    # 5.26.3 is what fcm expects and is always on PATH.
                    # If a newer Perl ever becomes necessary, add a
                    # version-pinned module load (e.g. perl/5.26.x-...).
                    add_export_vars:
                        # HDF5 + c-blosc roots used by the xios comp_command's
                        # hdf5-blosc plugin build step. Must match the HDF5 ABI
                        # that XIOS / netCDF4 was built against (Levante:
                        # hdf5-1.12.1-tvymb5). For other HPCs add a similar
                        # entry with the spack/module-resolved paths.
                        HDF5_ROOT: /sw/spack-levante/hdf5-1.12.1-tvymb5
                        C_BLOSC_ROOT: /sw/spack-levante/c-blosc-1.21.6-k4kqv3
                albedo:
                    add_export_vars:
                        HDF5_ROOT: /albedo/soft/sw/spack-sw/hdf5/1.12.2-mstdrjw/
                        C_BLOSC_ROOT: /albedo/soft/sw/spack-sw/c-blosc/1.21.5-obta4qv
        run:
            add_export_vars:
                # Where HDF5 looks for filter plugins at runtime. The plugin
                # libh5blosc.so is built into ${general.model_dir}/xios/hdf5-blosc/plugin
                # by the xios comp_command (see xios.yaml). XIOS's patched
                # netCdfInterface.cpp calls nc_def_var_filter(id=32001) for
                # blosc+zstd compression of NetCDF4 output.
                # We use ${general.model_dir}/xios/... rather than
                # ${xios.model_dir}/... because the latter does not resolve
                # cleanly in this env-file context (esm_parser produces a
                # triple-slash, no-xios-segment path, presumably because the
                # xios component namespace is not yet populated at the time
                # the export var template is expanded). general.model_dir
                # plus the conventional xios/ subdirectory resolves correctly.
                HDF5_PLUGIN_PATH: ${general.model_dir}/xios/hdf5-blosc/plugin
