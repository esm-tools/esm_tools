                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
