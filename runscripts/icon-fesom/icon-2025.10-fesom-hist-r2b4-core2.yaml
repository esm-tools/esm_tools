computer:
    use_hyperthreading: True
    additional_flags: 
        - "--tasks-per-node=128"
        #- "--threads-per-core=2"
        #- "--nnodes=52"
   # launcher_flags: -l --kill-on-bad-exit=1 --nodes=${SLURM_JOB_NUM_NODES:-1} --distribution=plane --hint=nomultithread --ntasks=$((no_of_nodes * mpi_procs_pernode)) --ntasks-per-node=${mpi_procs_pernode} --cpus-per-task=${OMP_NUM_THREADS}
    launcher_flags: "-l --kill-on-bad-exit=1 --hint=nomultithread --distribution=plane" 
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill" # default is kill
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
      "Lookup table problem" :
          frequency: 30
          method: "kill" # default is kill
          message: "The good old lookup table overflow."
          file: "stdout"
      "write_blowup" :
          frequency: 30
          method: "kill" # default is kill
          message: "FESOM2 exploded."
          file: "stdout"
general:
   use_venv: false
   homedir: !ENV ${HOME}
   setup_name: icon-fesom
   compute_time: "00:10:00"
   account: bb0519
   # daily restart
   initial_date: "1851-01-01T00:00:00"       # Initial exp. date
   final_date: "1851-01-03T00:00:00"         # Final date of the experiment
   nday: 1
   # monthly restart
   #initial_date: "1850-01-01T00:00:00"       # Initial exp. date
   #final_date: "1850-04-01T00:00:00"         # Final date of the experiment
   #nmonth: 1
   # yearly restart
   #initial_date: "1850-01-01T00:00:00"       # Initial exp. date
   #final_date: "1852-01-01T00:00:00"         # Final date of the experiment
   # set length and unit, both are used to set ICON and FESOM time intervals correctly
   #nmonth: 12
   
   lresume: True 
   ini_parent_exp_id: "IF-SW004"
   ini_parent_date: "18510101"
   ini_parent_dir: "/work/bm1514/b350071/esm-experiments/${ini_parent_exp_id}/restart"
   
   base_dir: ${homedir}/esm/esm-experiments/ 
   model_dir: ${homedir}/esm/models/icon-fesom-v1.0
   version: "v1.0"

yac:
   lresume: ${general.lresume}
   input_sources:
       coupling_yaml: ${computer.pool_directories.focipool}/ICON-FESOM/ICON/coupling.yaml  

icon:
   lresume: ${general.lresume}
   #ini_parent_exp_id: ${general.ini_parent_exp_id} 
   #ini_parent_date: ${general.ini_parent_date} 
   #ini_parent_dir: ${general.ini_parent_dir} 
   scenario: 'cmip7hist'
   monitoring: True 
   monitoringscript: "run_qp_driver_r2b4_icon-esm-tools.sh"
   #choose_general.run_number:
   #     1:
   #        namelist_changes: 
   #            'icon_master.namelist':
   #                 time_nml:
   #                    is_relative_time: false

   # As icon insist on having the restart files in link that points to a directory
   # we have to run this pre_run_command, this can hopefully change in the future
   pre_run_commands: 
       - "ulimit -c 0"
       - "ulimit -a"
       - "LD_LIBRARY_PATH=/sw/spack-levante/libfyaml-0.7.12-fvbhgo/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
         # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*
   version: "2025.10-public"
   resolution: "R02B04"
   grid_id: "0012"
   nproc: 128
   #omp_num_threads: 8
   #nproc: 2560
   #nproc: 1488
   #nproc: 2560
   omp_num_threads: 1
   
   dtime: 450 # 900 is the current default in icon.yaml
   # daily restart and output interval
   checkpoint_interval: P01D
   restart_interval: P01D
   output_interval: P01D
   # monthly restart and output interval
   #checkpoint_interval: P01M
   #restart_interval: P01M
   #output_interval: P01M
   # yearly restart and monthly output interval
   #checkpoint_interval: P01Y
   #restart_interval: P01Y
   #output_interval: P01M

   # awi is the tuning from AWI (Svetlana Loza) based on slo1826 ICON-XPP experiment
   # https://gitlab.dkrz.de/icon/icon-nwp/-/wikis/ICON-Seamless/CMIP7-Experiments#tuning-experiments-with-icon-xpp-release-configuration-of-112024
   # geomar is Sebastian's tuning based on kcmPi019 (latest DWD as of 03/2026) ICON-XPP run
   # https://gitlab.dkrz.de/icon/icon-nwp/-/wikis/ICON-Seamless/CMIP7-Experiments#branch-iconbackports-release-202510-2
   # namelist_dir: "${general.esm_namelist_dir}/icon/${icon.version}/${icon.resolution}/awi/"
   # example, change a namelist parameter
   # be aware of typos, use the exact name as in the namelist 
   # otherwise a new namelist parameter will be created which will 
   # not be recognized by ICON.
   #add_namelist_changes:
   #   NAMELIST_atm:
   #      nwp_tuning_nml:
   #         tune_entrorg: 2.2e-3
   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 10
         output_nml:
            output_interval: "${output_interval}"
            # file_interval must be > output_interval
            file_interval: "P50Y"
fesom:
   lresume: ${general.lresume}
   ini_parent_date: $((${general.ini_parent_date} - ${fesom.time_step}seconds)) 
   choose_lresume:
      True:
         choose_general.run_number:
            1:
               #lasttime: '85950'
               restart_in_sources:
                  par_oce_restart: ${ini_parent_dir}/fesom.${ini_parent_date!syear}.oce.restart/*.nc
                  par_ice_restart: ${ini_parent_dir}/fesom.${ini_parent_date!syear}.ice.restart/*.nc

   version: "2.6.2-yac"
   resolution: "CORE2"
   time_step: 1800
   nproc: 72 # use for daily restarts 
   #nproc: 512  # use for monthly or yearly restarts with CORE2
   #nproc: 4096
   #nproc: 1280
   #nproc: 1920
   #restart_unit: "y" # yearly restarts
   #restart_unit: "m" # monthly restarts 
   restart_unit: "d" # daily restarts
   restart_rate: "1"
   
   #add_input_files:
       #fesom_griddes: fesom_griddes
   #add_input_sources:
       #fesom_griddes: ${computer.pool_directories.focipool}/ICON-FESOM/YAC/core2_griddes_elements.nc  
   #add_input_in_work: 
       #fesom_griddes: core2_griddes_elements.nc
