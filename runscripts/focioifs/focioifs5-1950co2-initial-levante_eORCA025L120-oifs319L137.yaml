general:
   check_error:
      "BFD: Dwarf Error":
          method: "warn"
          message: "Ignoring BFD: Dwarf Error"
          file: stdout
          frequency: 15
   use_venv: False
   verbose: False 
   homedir: !ENV ${HOME}
   userdir: !ENV ${USER}
   
   setup_name: "focioifs"      
   resolution: "TCO319_eORCA025"
   version: "5.0"
  
   compute_time: "02:00:00"
   initial_date: "1950-01-01T00:00:00"       # Initial exp. date
   final_date: "1950-03-01T00:00:00"         # Final date of the experiment
   nmonth: 1
   nday: 0
   
   nyear: 0
   hours: 0
   account: bb1460
   base_dir: /work/bb1460/${general.userdir}/esm-experiments
   #base_dir: /mnt/ceph-ssd/workspaces/ws/shk00060/u11179-esm-experiments-ssd-202603/ 

   # This activates post processing for OpenIFS and NEMO
   postprocessing: True
   
   lresume: False
   # Name of the run you are starting from
   ini_parent_exp_id: "foci3-test12"
   # Where are you starting from in the above run
   ini_parent_date: "19491231" 
   ini_string_parent_date: "1950-01-01"
   # Time step in NEMO from restarts in parent run
   # NOTE: ESM-Tools looks for a global NEMO restart file 
   # You must run nocs_combine on restarts first.
   #ini_nemo_restart_steps: 262800
   #ini_parent_dir: "/scratch/usr/shkjocke/esm-nemo4/${ini_parent_exp_id}/"
   # Time stamp from OASIS for restarts in parent run
   oasis_date_stamp: "_19400101-19491231"
   # Previous run config file
   # (should be general enough)
   prev_run_config_file: "/scratch/usr/shkjocke/esm-nemo4/${ini_parent_exp_id}/config/${ini_parent_exp_id}_finished_config.yaml${oasis_date_stamp}"

focioifs:
   #model_dir: ${general.homedir}/esm/models/focioifs-5.0
   model_dir: /work/bb1460/b350071/models/focioifs-5.0
   
oifs:
   
   # if you change name=OIFS in file_def*xml you currently have to adjust 
   # it here as well.
   # need to discuss this with Joakim and/or Jan Streffing from AWI
   # used to be ECE3 with OIFS43
   # this section can be removed once the search pattern for 
   # outdata_sources:
   #    oifsnc: ${input_expid}_*_${start_date!syear!smonth!sday}_*.nc
   # in oifs.yaml has been adjusted (need to talk to AWI first)
   # and I'm sure that I can safely change input_expid to OIFS
   # oifsnc: can't be overwritten here do to the use of wildcards
   # need to file a bug report with AWI
   add_outdata_files:
      oifsnc2: oifsnc2 
   add_outdata_in_work:
      oifsnc2: OIFS_*_${start_date!syear}*.nc
   add_outdata_sources:
      oifsnc2: OIFS_*_${start_date!syear}*.nc
   #outdata_sources:
   #  oifsnc: OIFS_*_${start_date!syear}*.nc

   post_run_commands: "sync"
   lresume: ${general.lresume}
   # This would be for a traditional restart
   # but not used here
   prev_run_config_file: "${general.prev_run_config_file}"
   #ini_parent_exp_id: "${general.ini_parent_exp_id}"
   #ini_parent_dir: "${general.ini_parent_dir}/restart/oifs/18591231/"
   #ini_parent_date: "${prev_date}"
   
   version: "48r1-foci5"
   major_version: "48r1"
   time_step: 900
   with_xios: True
   scenario: "piControl"
   copy_forcing: true
   mip: ""
   o3_scheme: default
   pool_dir: /work/bb1460/foci_input2/
   input_dir: "${pool_dir}/openifs_cy48_tco319/"
   rtables_dir: "${pool_dir}/openifs_cy48_general/rtables/"
   vtables_dir: "${pool_dir}/openifs_cy48_general/vtables/"
   tl_o3_data_dir: "${pool_dir}/openifs_cy48_tco319/"
   ifsdata_dir: "${pool_dir}/openifs_cy48_general/ifsdata/"
   cmip5_data_dir: "${pool_dir}/openifs_cy48_general/cmip5_ghg/"
   cmip6_data_dir: "${pool_dir}/openifs_cy48_general/cmip6-data/"
   #cmip7_data_dir: "${pool_dir}/openifs_cy48_general/cmip7-data/"
   icmcl_dir: "${pool_dir}/openifs_cy48_tco319/${prepifs_startdate}00/"
   icmcl_file: "ICMCLabooINIT"
   # This would use initial conditions from ERA-Interim 2008-01-01
   prepifs_expid: aboo
   prepifs_startdate: 19900101
   
   # This uses initial conditions from FOCI_GJK006 4000-01-02
   #prepifs_expid: ECE3 
   #prepifs_startdate: 40000101 
   
   resolution: TCO319
   levels: L137
   nproc: 948 #1000 #384
   omp_num_threads: 1
   solarspectrum: True 
   ini_pseudo_initial_date: "1859-01-01"
   # new option for FOCI5, see oifs.yaml
   # otherwise we get duplicate namelist entries in fort.4
   # need to talk to Jan Streffing about this
   massfixer: 4
   #cloudfixer: 0
   add_input_sources:
       icmcl: ${icmcl_dir}/*
   add_input_in_work:
       icmcl: ${prepifs_startdate}/*
   add_input_files:
       icmcl: icmcl

