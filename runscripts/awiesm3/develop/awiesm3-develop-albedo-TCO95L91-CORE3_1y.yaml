general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop"
    account: "clidyn.clidyn"
    compute_time: "08:00:00"
    initial_date: "1900-01-01"
    final_date: "1904-01-01"
    base_dir: "/albedo/work/user/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 1

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/albedo/home/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE3"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: true
    ini_parent_exp_id: "foo"
    ini_parent_date: "1900-01-01"
    ini_restart_dir: "/albedo/pool/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    time_step: 1200
    nproc: 1792 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.config:
            run_config:
                use_cavity: true
            restart_log:
                raw_restart_length_unit: "off"
                bin_restart_length_unit: "off"

lpj_guess:
    nproc: 64
    omp_num_threads: 4
    mip: "cmip7"
    fixed_landuse_year: 1850
    firemodel: NOFIRE
    lresume: true
    ini_parent_exp_id: "foo"
    ini_parent_date: "1999-12-31"
    ini_restart_dir: "/albedo/work/user/jstreffi/runtime/lpjg-spinup/first_test_01/restart/lpj_guess/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_1870/*

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 256
    omp_num_threads: 4
    mpi: cmip7 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                LCMIP6: False
                LCMIP7: True
                CMIP7DATADIR: '${input_dir}/cmip7-data/'
                NCMIPFIXYR: 1850
                SCENARIONAME: 'SSP2-4.5'
                LMACV2SP: True
                LMACV2SP_CCNF: True
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
                NO3CMIP: 7
                CO3DATADIR: '${input_dir}/cmip7-data/'
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8

oasis3mct:
    use_lucia: true #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 3600
    norestart: T #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
