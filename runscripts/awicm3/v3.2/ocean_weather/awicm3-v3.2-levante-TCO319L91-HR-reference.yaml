oifs:
    resolution: "TCO319"
    levels: "L91"
    prepifs_expid: h9wt
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 1200
    nproc: 384
    omp_num_threads: 1  

oasis3mct:
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 3600

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32

