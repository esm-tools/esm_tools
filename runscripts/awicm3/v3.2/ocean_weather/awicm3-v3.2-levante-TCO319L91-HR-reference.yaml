general:
    user: !ENV ${USER}
    setup_name: "awicm3"
    version: "v3.2"
    account: "ab0995"
    compute_time: "08:00:00"
    initial_date: "1950-01-01"
    final_date: "1950-03-01"
    base_dir: "/work/ab0995/${user}/runtime/${general.setup_name}-${general.version}/"
    nday: 0
    nmonth: 1
    nyear: 0
    use_venv: False

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: "/work/ab0995/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
