# Standalone ICON (2025.10-public) runscript, R02B05 (grid 0030), nesh, 1985-2021:
# CERESMIP amip-sst, member 2 (suggested expid icon-amip-sst-hadisst24-02). Same setup as
# member 1 (icon-2025.10-amip-sst-r2b5-hadisst2p4-nesh_1979-2021.yaml, icon-amip-sst-hadisst24-01:
# scenario PI-CTRL + with_ozone 5, i.e. all boundary conditions except SST/sea ice at 1850),
# except
#   - SST/sea ice as the amip member 2 (icon-amip-hadisst24-02): sstice hadisst2p4-p1986-m002
#     = HadISST 2.4.0.0 SST member 002 + HadISST 2.2.1.0 sea ice with the 1986 gap patched (r0004)
#   - start 1985-01-01 from the 1985-01-01 checkpoint of icon-amip-hadisst24-02 (lresume,
#     copied from its run_19790101-19921231/work to its restart/icon on 2026-11-26), instead
#     of a cold start from ifs2icon 1979. 1985-2000 (16 years) is spin-up for the CERESMIP
#     period 2001-2021 (the protocol starts in 1990), so 1979-1984 are not needed.
#     The forcing switches from cmip7hist (1985 state) to 1850 at the restart; the atmosphere
#     adjusts within months. JSBACH: with land-use change off the tile fractions are not
#     restart variables (jsbach base/mo_jsb_tile.f90 Init_fractions_on_tile, lrestart =
#     .NOT. l_fixed_fractions), so they are read from bc_land_frac 1850; the soil state
#     (moisture, temperature) of 1985 is kept and adjusts during the spin-up.
#
# Run length: 3 runs of 12 years (1985-1996, 1997-2008, 2009-2020; ~2.3-2.5 h per model year
#   on 24 nodes = ~28-30 h, 48 h limit), final_date 2021-01-01. Then 2021 as one run, started
#   by hand (ESM-Tools does not shorten the last run, and the SST/sea ice data end on
#   2022-01-16): AFTER run 3, its tidy and its interp job have finished (never edit the
#   experiment's runscript copy while a run is still running), set runlength: 1, nyear: 1
#   (choose_unit), checkpoint_interval: P01Y and final_date: "2022-01-01", and resubmit;
#   the experiment continues from the 2021-01-01 restart.
# Restart files: every 2 years (checkpoint_interval, ~4.9 GB each, they stay in run_*/work),
#   the restart at the end of each run is copied to restart/icon. Check that the final
#   restart exists before trusting "Experiment over" (node loss, see CLAUDE.md), and check
#   the speed in the first hour (defective nodes, see the exclude list).
# Disk: ~140 GB per year of daily 3d model-level output (~1.7 TB per 12-year run) before the
#   interpolation job deletes it (interp_to_plev_ml_files: remove).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
        # defective nodes (ceresmip/nesh/check_nesh_srp_nodes.sh, scan 2026-11-19): srp224-227
        # thermally throttled (2026-11-09, half speed), srp110 and srp283 hyperthreading on
        # (32 ranks on 16 cores, job ~1.6x slower), the others down/unreachable
        - "--exclude=nesh-srp[104,110,112,128,205,224-227,242,278,283,299]"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "48:00:00"

   initial_date: "1985-01-01T00:00:00"       # Initial exp. date (= date of the parent restart)
   final_date: "2021-01-01T00:00:00"         # Final date of the experiment, see above for 2021
   # set length and unit of each run, both are used to set the ESM-Tools run
   # length and the ICON restart_interval (end of the run)
   runlength: 12
   unit: 'y' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 12
         unitUpper: 'D'
      'm':
         nmonth: 12
         unitUpper: 'M'
      'y':
         nyear: 12
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B05
   grid_id: '0030'

   amip: True
   # extpar, JSBACH land files and sea-ice snow albedo (see amip_surface in icon.yaml):
   # xpp-r0007 = 0030-0062/land/r0007 extpar + JSBACH files, r0008 ic_land_soil (as Trang 2026-11)
   amip_surface: xpp-r0007
   # as amip member 2: HadISST 2.4.0.0 SST member 002 + HadISST 2.2.1.0 sea ice with the
   # 1986 gap patched, 1949-2021 (r0004, as in icon-amip-hadisst24-02, see icon.yaml)
   sstice: hadisst2p4-p1986-m002
   # CERESMIP amip-sst: all forcings except SST/sea ice at 1850 (see header)
   scenario: 'PI-CTRL'
   # CMIP7 piControl ozone file (irad_o3 5) instead of the GEMS climatology (7)
   with_ozone: 5
   cmip7_scenario: m

   # warm start from the 1985-01-01 restart of the amip member 2 (see header); ICON reads
   # ${ini_parent_dir}/${ini_parent_exp_id}_restart_atm_<ini_parent_date>T000000Z.mfr
   # (pre_run_commands), no ifs2icon initial state
   lresume: true
   ini_parent_exp_id: icon-amip-hadisst24-02
   ini_parent_date: "19850101"
   ini_parent_dir: ${general.base_dir}/${ini_parent_exp_id}/restart/icon

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job). The daily
   # model-level files are deleted (140 GB per year) once the pressure-level file
   # passed its check, the monthly ones are moved to outdata/icon/3d_ml (needed for aec)
   interp_to_plev: True
   interp_to_plev_ml_files: remove

   # 24 nodes, as icon-amip-01 (scaling test 2026-11-05: 96 % efficiency 12 -> 24 nodes)
   nproc: 768
   omp_num_threads: 1
   dtime: 450

   # restart files every 2 years (checkpoint_interval), the run stops after runlength
   # (restart_interval). Output intervals are set per stream in the amip NAMELIST_atm
   checkpoint_interval: P02Y
   restart_interval: P${general.runlength}${general.unitUpper}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 2
         output_nml:
            # yearly files, as in icon-fesom-pictl-r2b5-core2-levante_multiyear_geomar.yaml
            # (f90nml applies this to all output_nml groups)
            file_interval: "P01YT1S"
