# develop-cc at TCO95/CORE3, cold start, one-day legs.
# A byte-for-byte copy of core3_1d.yaml with only the version changed, so the
# CO2 arm is exercised on the resolution develop already passes 3/3 legs at.
# Deliberately NOT based on core3_3m.yaml: that one pairs monthly legs and a
# monthly FESOM restart_rate with a final_date three days out, so the leg ends
# before the restart is due and the run dies in finalisation.
# TCO95 also puts OpenIFS on a 3600 s step, where NRADFR resolves to 3 and a
# 24-step day divides it. The TL255 CO2 runscripts override to 2400, where
# NRADFR becomes 5, 36 steps a day never divide it, and every warm start walks
# into the radheatn overflow.
general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop-cc"
    account: "ab0246"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-04"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    # REcoM cold-starts its tracers every leg, matching how develop-cc is actually
    # run everywhere: all 22 of a270073's cc experiments and a270270's 14-leg
    # AWIESM729 stage recom_restart=.false. The FESOM source default in
    # bin_2p3z2d/namelist.recom is .true., and leaving it there makes leg 2 die in
    # FESOM ("reading restart for BenN ... No such file or directory") because
    # fesom-2.7.yaml's restart_in_files/restart_out_files declare only oce and ice,
    # so the bio restart FESOM writes is never collected or staged back.
    add_namelist_changes:
        namelist.recom:
            pavariables:
                REcoM_restart: ".false."
    resolution: "CORE3"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 600
    nproc: 1792 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true
    add_namelist_changes:
        namelist.config:
            run_config:
                use_cavity: true

lpj_guess:
    nproc: 8 # originally 16
    omp_num_threads: 8
    lresume: false

oifs:
    resolution: TCO95
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 128
    omp_num_threads: 1
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1990
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGWWMS:
                GGAUSSB: -0.8

oasis3mct:
    use_lucia: true #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 7200
    norestart: T #Do i restart from vegin or not?

xios:
    with_model:
        - oifs
        - fesom
    nproc: 4
    omp_num_threads: 32
