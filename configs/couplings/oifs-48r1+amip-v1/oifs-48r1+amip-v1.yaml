components:
- xios-2.5-ece
# 48r1v5 is oifs48r1.1.git on branch awiesm3-develop, the same source the coupled
# setup builds, so the AMIP and coupled trees stay identical. The older 48r1 points
# at a different remote.
- oifs-48r1v5
- amip-v1
- oasis3mct-5.0-smhi
coupling_changes:
- sed -i 's/xios-2.5+/xios/g' oifs-48r1/bundle.yml
- sed -i 's/xios\/build_ecearth/xios/g' oifs-48r1/bundle.yml
- sed -i 's/oasis3-mct-5.2/oasis/g' oifs-48r1/bundle.yml
- sed -i '/CPLNG_ACTIVE = /s/.FALSE./.TRUE./g' oifs-48r1/ifs-source/arpifs/module/yommcc.F90
- sed -i '/COUPLENEMOECE = /s/.TRUE./.FALSE./g' oifs-48r1/ifs-source/arpifs/module/yommcc.F90
- sed -i '/COUPLEFESOM2 = /s/.TRUE./.FALSE./g' oifs-48r1/ifs-source/arpifs/module/yommcc.F90
- sed -i '/COUPLENEMOFOCI = /s/.TRUE./.FALSE./g' oifs-48r1/ifs-source/arpifs/module/yommcc.F90

