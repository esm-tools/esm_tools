# Standalone ICON (2025.10-public) AMIP test runscript, R02B05 (grid 0030), nesh.
# Test for icon-2025.10-amip-r2b5-nesh_1979-2024.yaml (same settings): 10 days
# starting 1979-01-01 with a restart after 5 days, pressure-level interpolation
# after each run (model-level files moved to outdata/icon/3d_ml).
# Gives the time per model day (log/*_compute_*.log) to choose the production
# runlength: time per model year = 365 x time per day (+ ~2 min initialisation per run).
# icon-2025.10-amip-r2b5-nesh_12nodes.yaml: the same with 384 tasks (12 nodes).
computer:
    use_hyperthreading: False
    additional_flags:
        - "--tasks-per-node=32"
        - "--constraint=sapphire"
    launcher: mpirun
    launcher_flags: ""
    check_error:
      "srun: error:" :
          frequency: 30
          method: "kill"
          message: "SLURM ERROR: slurm ended with an error, good luck."
          file: "stdout"
    post_run_commands:
       - "jobinfo"

general:
   use_venv: False
   account: None
   setup_name: icon
   compute_time: "02:00:00"

   initial_date: "1979-01-01T00:00:00"       # Initial exp. date
   final_date: "1979-01-11T00:00:00"         # Final date of the experiment
   # set length and unit of each run (= restart interval), both are used
   # to set the ESM-Tools run length and the ICON restart intervals
   runlength: 5
   unit: 'd' # 'd' for day, 'm' for month, 'y' for year
   # needs fixing, esm_tools can't resolve ${runlength} here
   # https://github.com/esm-tools/esm_tools/issues/1453
   # so set nday/nmonth/nyear to the same value as runlength
   choose_unit:
      'd':
         nday: 5
         unitUpper: 'D'
      'm':
         nmonth: 1
         unitUpper: 'M'
      'y':
         nyear: 1
         unitUpper: 'Y'

   # only use !ENV for plain ${HOME}: esm_parser exports every !ENV variable to
   # the job with the full value of the line (e.g. HOME=<model_dir>)
   homedir: !ENV ${HOME}
   base_dir: ${homedir}/esm/esm-experiments
   model_dir: ${homedir}/esm/models/icon-2025.10-public

icon:
   version: 2025.10-public
   resolution: R02B05
   grid_id: '0030'

   amip: True
   amip_sst: hadisst1p1
   scenario: 'cmip7hist'
   cmip7_scenario: m

   # after each run: monthly and daily 3d model-level output -> 26 pressure levels
   # (configs/components/icon/interp_to_plev.sh, postprocessing job); the
   # model-level files are moved to outdata/icon/3d_ml once the pressure-level file passed its check
   interp_to_plev: True
   interp_to_plev_ml_files: move

   # as in ICON-FESOM on nesh (24 nodes)
   nproc: 768
   omp_num_threads: 1
   dtime: 450

   # restart after each run, output intervals are set per stream in the
   # amip NAMELIST_atm
   checkpoint_interval: P${general.runlength}${general.unitUpper}
   restart_interval: ${checkpoint_interval}

   pre_run_commands:
       - "ulimit -c 0"
       # libfyaml, as in the nesh ICON-FESOM runscripts
       - "LD_LIBRARY_PATH=/gxfs_work/geomar/smomw235/sw/libfyaml-0.9.6/lib:$LD_LIBRARY_PATH"
       - "cd ${work_dir}"
       # ICON reads the restart from a link that points to the multifile restart directory
       - "rm -f multifile_restart_atmo.mfr"
       - "ln -sf ${icon.parent_restart_dir}/${parent_expid}_restart_atm_${start_rsttime}.mfr multifile_restart_atmo.mfr"
       # overcome limitation of f90nml who cannot handle the duplicate namelists output_nml in NAMELIST_atm correctly
       - sed -i s/\'icon_/\'${general.expid}_/ NAMELIST_*

   add_namelist_changes:
      NAMELIST_atm:
         run_nml:
            msg_level: 10
