# ---------------------------------------------------------------------------------
# SB2 --- stable-boundary-layer mixing, RSBLB 2.0 (default 5.0), on the LX4 base.
#
# WHY THIS AND NOT ANOTHER SURFACE LEVER.  The DJF land cold bias was resolved by height
# against ERA5 on 2026-08-21 (scripts/analysis/djf_bias_vertical_structure.py).  In the
# best coupled run, 11P, over 60-90N land in DJF:
#
#     T2m -3.63   T1000 -2.10   T925 -0.88   T850 -0.42
#     low-level inversion bias (T925-T2m)  +2.81 K
#     surface  inversion bias (T2m-Tskt)   +0.11 K
#
# The bias decays to nothing by 850 hPa, so it is surface-confined and a redistribution
# lever is the right class.  But the SKIN IS ALREADY RIGHT: the whole excess inversion
# sits between the screen and 925 hPa.  That retires the surface-side candidates as a
# class, and it explains the three nulls already on record --- ECE_LAMSK_SN (J1/J2, skin
# conduction, 60-90N DJF +0.125 against a 0.41 threshold), Raupach z0 (11J-11I, DJF
# land-ocean gap -0.017 and -0.003 in two windows) and F1 (RVZ0H on forest).  Each was
# adjusting a part of the column that carries no error.
#
# THE LEVER.  The 2m-925 hPa layer is mixed by the stable branch of VDFEXCU, whose
# constants were hardcoded literals until they were exposed as &NAMVDFS
# (scripts/patches/expose_sbl_mixing.py).  RSBLB is coefficient b of the LTG stability
# functions, F_H = 1/(1 + 2 b Ri sqrt(1 + d Ri)).  LOWERING it lengthens the stable tail:
# at Ri = 0.5, F_H goes 0.140 (b=5) -> 0.214 (b=3) -> 0.290 (b=2), so roughly 1.5x and 2x
# the heat exchange.  More heat mixed down = weaker inversion = warmer winter screen.
# This is the direction Holtslag et al. (2013) and Sandu et al. (2013) discuss, and it is
# the route Round 16's own pre-registered falsifier named when skin conductivity failed.
#
# ZCB, ZCD and ZLMIN are used ONLY inside the IF (ZRI > 0) branch of VDFEXCU, checked
# before patching, so this cannot reach unstable or convective mixing.
#
# WHAT WOULD DISQUALIFY IT.  The known cost of a longer tail is a too-weak inversion and
# degraded synoptic behaviour, so: 60-90N DJF overshooting warm; the low-level inversion
# bias crossing zero; global net TOA beyond about +-0.3 at 44 years; Siberian JJA going
# backwards.  Sea ice and the Southern Ocean must be checked too --- the stable regime is
# not land-only, it is simply rare over open ocean, and it is NOT rare over ice.
#
# VERIFY BEFORE TRUSTING.  &NAMVDFS is new.  SUVDFS echoes the values it used to NULOUT,
# so confirm "SUVDFS: stable-BL mixing" in NODE.001_01 shows RSBLB=2.0 before scoring
# this arm.  A malformed group aborts by design; an ABSENT group silently keeps 5.0,
# which would make this arm a copy of its control.
# ---------------------------------------------------------------------------------

