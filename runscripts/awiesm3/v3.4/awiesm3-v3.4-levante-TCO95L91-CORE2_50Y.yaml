oifs:
    #resolution: "TL159"
    resolution: TL255
    levels: "L91"
    #prepifs_expid: abis
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    #time_step: 3600 //this one worked
    lresume: false
    time_step: 2400
    nproc: 512
    omp_num_threads: 8
    #add_namelist_changes: #this turns XIOS off
    #    fort.4:
    #        NAMCT0:
    #            LXIOS: False
    add_namelist_changes:
        fort.4:
            NAMECECMIP6:
                LCMIP6: True
                CMIP6DATADIR: '/work/ab0246/a270092/input/oifs-48r1/cmip6-data/'
                NCMIPFIXYR: 0
                #NCMIPFIXYR: 1990
                SSPNAME: 'historical'
            NAMCT0:
                LXIOS: True
                NFRPOS: $(( 86400 / ${oifs.time_step} ))  # output frequency
                NFRHIS: $(( 86400 / ${oifs.time_step} ))  # history frequency

oasis3mct:
    use_lucia: False
    debug_level: 1
