general:
    user: !ENV ${USER}
    setup_name: "awiesm3"
    version: "develop-cc"
    account: "ab0246"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-04"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/" 
    nday: 0
    nmonth: 0
    nyear: 1

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}//"

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "y"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 1152 #originally 512 but worked with 1152
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true

lpj_guess:
    lresume: false 
    nproc: 8 # originally 16
    omp_num_threads: 8

oifs:
    resolution: TL255
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    nproc: 512
    omp_num_threads: 2
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1990
            NAERAD:
                NRADFR: -3
                NDECOLAT: 0
            NAMCLDP:
                RVICE: 0.19
            NAMGFL:
                NGHG: 1
                YGHG_NL(1)%CNAME: "CO2_GHG"
                YGHG_NL(1)%IGRBCODE: 210061
                YGHG_NL(1)%LADV: TRUE
                YGHG_NL(1)%LADV5: TRUE
                YGHG_NL(1)%LREQOUT: TRUE
                YGHG_NL(1)%LMASSFIX: TRUE
                YGHG_NL(1)%LQM: FALSE
                YGHG_NL(1)%LQM3D: TRUE
                YGHG_NL(1)%LNEGFIX: FALSE
                YGHG_NL(1)%BETAMFBC: 2
            NAMCOMPO:
                LCHEM_DIA: .false.
                LCHEM_DDFLX: .false.
                LCOMPO_DDFLX_DIR: .false.
                LCHEM_TROPO: .false.
                LCOMPO_DCDD: .false.

oasis3mct:
    use_lucia: false #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 7200
    norestart: false #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
